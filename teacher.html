<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作答分析</title>
  <script>
    window.MEDIAN_TEACHER = window.MEDIAN_TEACHER || {
      reviewPassword: "",
      collectUrl: "https://script.google.com/macros/s/AKfycbwvWwcfUqXC3rD-0LDVlKatfyfLsU4-KoeM5OmK7TiN2gW_pCxGd9NrNBBxcgp4BPA/exec"
    };
  </script>
  <script src="teacher-config.js"></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    h2 { font-size: 1.05rem; margin: 20px 0 8px; }
    p, li { line-height: 1.5; }
    .note { color: #475569; }
    .gate-error { color: #b91c1c; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
    input[type="password"], input[type="date"] {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      max-width: 280px;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .btn-secondary { background: #64748b; }
    .filters, .links { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    body.embed { padding: 0; background: transparent; }
    body.embed .container { box-shadow: none; max-width: none; padding: 0; }
    .filters { margin: 12px 0; }
    .lead { background: #fff7ed; border-radius: 10px; padding: 10px 12px; margin: 8px 0 14px; }
    .bar-block { margin: 0 0 14px; }
    .bar-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .bar-track { display: flex; height: 18px; margin-top: 4px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
    .bar-fill { background: #d97706; height: 100%; }
    .page-back { margin: 0 0 8px; }
    .weak-row { display: grid; grid-template-columns: minmax(9rem, 13rem) minmax(0, 1fr); gap: 4px 12px; align-items: center; }
    .weak-label strong { display: block; }
    .weak-label .note { margin: 0; }
    .focus-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; }
    .focus-card .bar-track { margin-top: 0; }
    @media (max-width: 640px) {
      .weak-row { grid-template-columns: minmax(0, 1fr); }
    }
    .stack-wrong { background: #d97706; height: 100%; }
    .stack-right { background: #16a34a; height: 100%; }
    .advice { margin: 4px 0 0; }
    .legend { display: flex; gap: 14px; margin: 0 0 8px; font-size: 0.85rem; }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
    .swatch-wrong { background: #d97706; }
    .swatch-right { background: #16a34a; }
    .attempt {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      margin: 8px 0;
    }
    .attempt p { margin: 4px 0; }
    .input-list { list-style: none; margin: 4px 0 0; padding: 0; }
    .input-list li {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      justify-content: space-between;
      align-items: baseline;
      border-top: 1px solid #e2e8f0;
      padding: 6px 0;
    }
    .input-text { min-width: 0; word-break: break-word; }
    .wrong { color: #b45309; font-weight: bold; }
    .right { color: #15803d; font-weight: bold; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <p class="page-back"><a href="index.html">返回練習</a></p>
    <h1>作答分析</h1>
    <p class="note">第一眼是次數最多的一項。名稱和次數在橫條左邊。其餘不對的步驟要按開。全對的步驟不列出。這部瀏覽器記住密碼後，重新整理就會更新。不顯示姓名。</p>
    <form id="gate">
      <input type="text" name="username" autocomplete="username" value="老師" hidden>
      <label>密碼
        <input id="password" name="password" type="password" autocomplete="current-password">
      </label>
      <p><button class="btn" type="submit">進入</button></p>
      <p id="gateError" class="gate-error" hidden>密碼不對。試算表若仍是預設密碼，讀取也會被拒絕。</p>
    </form>
    <div id="app" hidden>
      <div class="filters">
        <label>由 <input id="from" type="date"></label>
        <label>至 <input id="to" type="date"></label>
      </div>
      <p id="scopeNote" class="note"></p>
      <p id="countNote"></p>
      <h2>現在最弱</h2>
      <div id="focus"></div>
      <p><button type="button" class="btn btn-secondary" id="toggleRest">其他步驟</button></p>
      <div id="rest" hidden>
        <h2>其他難點</h2>
        <div id="gaps"></div>
        <h2>有不對的步驟</h2>
        <div id="steps"></div>
        <h2>不同輸入</h2>
        <p class="note">同一種寫法合在一起。錯的先列，對的寫法要按開。</p>
        <div id="inputs"></div>
        <p><button type="button" class="btn btn-secondary" id="toggleRecent">展開逐次作答</button></p>
        <div id="recent" hidden></div>
      </div>
      <p class="links">
        <a href="index.html">課堂練習</a>
        <button type="button" class="btn btn-secondary" id="clearReview">清除全部作答</button>
        <button type="button" class="btn btn-secondary" id="lockReview">鎖定</button>
      </p>
    </div>
  </div>
  <script>
    (function () {
      if (new URLSearchParams(location.search).get("embed") === "1") document.body.classList.add("embed");
      const state = { rows: [], sheetNote: "local", recentOpen: false, restOpen: false, correctOpen: {} };
      const advice = {
        "總數加錯": "先帶學生逐格把頻數加一次，加完再填總數。",
        "單雙判斷錯": "總數加完後，先判斷單數還是雙數，再找中間的項。",
        "中位數位置錯": "單數取中間一項的位置；雙數要找出中間那兩項。",
        "雙數沒有取兩項的位置": "雙數要寫出中間兩項的位置，不是只寫一項。",
        "雙數沒有取平均": "找到中間兩個數之後，還要把兩個數相加再除以 2。",
        "中位數數值錯": "先確認中間是第幾項，再回到由小至大的數列讀出那個數。",
        "最小 x 偏小": "再少一個就會離開目標。沿位置帶逐個加，剛落到目標就停。",
        "最小 x 偏大": "還有更小的正整數也可以。往回試，直到再少一個就離開。",
        "最大 x 偏小": "還可以再加。一直加到再多一個就離開目標。",
        "最大 x 偏大": "再多一個就會離開目標。停在離開之前的那一個。",
        "沒有填正整數": "最小和最大都要填正整數。",
        "正中間選錯": "x 最小時，正中間是第一個目標數。x 最大時，是最後一個。",
        "剩下的人數錯": "先拿出正中間那 1 個，再數這一組還剩幾個。",
        "放錯邊": "x 最小時，剩下的放右方。x 最大時，放左方。",
        "左右還沒相等": "左方和右方的人數要寫到相等，再解 x。",
        "兩堆人數還沒相等": "看圖數兩堆的人。正中間那個不要加進任何一堆。有 x 的那堆，人數要連 x 一起寫。",
        "x 還沒解出": "數式對了之後，再解出 x。",
        "其他": "先看哪一類出現最多，下一節只重教那一步。"
      };
      const stepOrder = ["總數", "單雙", "第幾項", "中位數", "正中間", "跟哪一堆", "剩下幾個", "數式", "最小 x", "最大 x"];

      function expectedPassword() {
        return String((window.MEDIAN_TEACHER && window.MEDIAN_TEACHER.reviewPassword) || "");
      }

      function localRows() {
        try {
          const list = JSON.parse(localStorage.getItem("median-attempts") || "[]");
          return Array.isArray(list) ? list : [];
        } catch (error) {
          return [];
        }
      }

      function hkDay(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return String(iso).slice(0, 10);
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Hong_Kong",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(date);
      }

      function formatTime(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return String(iso);
        const parts = new Intl.DateTimeFormat("zh-HK", {
          timeZone: "Asia/Hong_Kong",
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(date);
        const part = (type) => parts.find((item) => item.type === type).value;
        return part("month") + "月" + part("day") + "日 " + part("hour") + ":" + part("minute");
      }

      function normalize(row) {
        const ok = row.ok === true || row.ok === "對";
        return {
          at: String(row.at || ""),
          device: String(row.device || "").slice(0, 16),
          source: row.source === "試用" ? "試用" : "課堂",
          lesson: String(row.lesson || ""),
          step: String(row.step || ""),
          input: String(row.input == null ? "" : row.input).slice(0, 80),
          ok: ok,
          gap: ok ? "" : String(row.gap || "其他")
        };
      }

      function merge(local, remote) {
        const seen = new Set();
        const out = [];
        local.concat(remote).forEach((row) => {
          const item = normalize(row);
          const key = [item.at, item.device, item.source, item.step, item.input, item.ok].join("|");
          if (seen.has(key)) return;
          seen.add(key);
          out.push(item);
        });
        out.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
        return out;
      }

      function loadSheet(password, action) {
        const url = window.MEDIAN_TEACHER && window.MEDIAN_TEACHER.collectUrl;
        if (!url) return Promise.resolve({ skipped: true, ok: true, rows: [] });
        return new Promise((resolve) => {
          const cb = "medianSheet" + Date.now();
          let done = false;
          const finish = (payload) => {
            if (done) return;
            done = true;
            window[cb] = function () {};
            const node = document.getElementById(cb);
            if (node) node.remove();
            resolve(payload || { ok: false, rows: [] });
          };
          window[cb] = (data) => finish(Object.assign({ denied: !data || data.ok === false }, data));
          const script = document.createElement("script");
          script.id = cb;
          const join = String(url).indexOf("?") === -1 ? "?" : "&";
          script.src = url + join + "password=" + encodeURIComponent(password) + "&callback=" + cb + (action ? "&action=" + encodeURIComponent(action) : "");
          script.onerror = () => finish({ ok: false, rows: [] });
          document.body.appendChild(script);
          setTimeout(() => finish({ ok: false, rows: [], timeout: true }), 20000);
        });
      }

      function selectedRows() {
        const from = document.getElementById("from").value;
        const to = document.getElementById("to").value;
        return state.rows.filter((row) => {
          const day = hkDay(row.at);
          if (from && day < from) return false;
          if (to && day > to) return false;
          return true;
        });
      }

      function rankGaps(rows) {
        const map = new Map();
        rows.filter((row) => !row.ok && row.gap).forEach((row) => {
          if (!map.has(row.gap)) map.set(row.gap, { gap: row.gap, count: 0 });
          map.get(row.gap).count += 1;
        });
        return Array.from(map.values()).sort((a, b) => b.count - a.count || a.gap.localeCompare(b.gap, "zh-HK"));
      }

      function tallyInputs(list) {
        const map = new Map();
        list.forEach((row) => {
          const key = row.input || "";
          if (!map.has(key)) map.set(key, { input: key, right: 0, wrong: 0 });
          const item = map.get(key);
          if (row.ok) item.right += 1;
          else item.wrong += 1;
        });
        return Array.from(map.values()).sort((a, b) => (b.wrong - a.wrong) || (b.right - a.right) || a.input.localeCompare(b.input, "zh-HK"));
      }

      function weakLabel(name, countText) {
        const label = document.createElement("div");
        label.className = "weak-label";
        const title = document.createElement("strong");
        title.textContent = name;
        const count = document.createElement("div");
        count.className = "note";
        count.textContent = countText;
        label.append(title, count);
        return label;
      }

      function weakRow(name, countText, ratio) {
        const row = document.createElement("div");
        row.className = "weak-row";
        const track = document.createElement("div");
        track.className = "bar-track";
        const fill = document.createElement("div");
        fill.className = "bar-fill";
        fill.style.width = Math.max(8, Math.round(ratio * 100)) + "%";
        track.appendChild(fill);
        row.append(weakLabel(name, countText), track);
        return row;
      }

      function inputLine(item) {
        const line = document.createElement("li");
        const text = document.createElement("span");
        text.className = "input-text";
        text.textContent = item.input || "（空白）";
        const marks = document.createElement("span");
        if (item.wrong) {
          const wrong = document.createElement("span");
          wrong.className = "wrong";
          wrong.textContent = "錯 " + item.wrong;
          marks.appendChild(wrong);
        }
        if (item.right) {
          if (item.wrong) marks.appendChild(document.createTextNode(" · "));
          const right = document.createElement("span");
          right.className = "right";
          right.textContent = "對 " + item.right;
          marks.appendChild(right);
        }
        line.append(text, marks);
        return line;
      }

      function groupInputs(rows) {
        const steps = new Map();
        rows.forEach((row) => {
          if (!steps.has(row.step)) steps.set(row.step, new Map());
          const inputs = steps.get(row.step);
          const key = row.input || "";
          if (!inputs.has(key)) inputs.set(key, { input: key, right: 0, wrong: 0 });
          const item = inputs.get(key);
          if (row.ok) item.right += 1;
          else item.wrong += 1;
        });
        return Array.from(steps.entries()).map(([step, inputs]) => ({
          step: step,
          inputs: Array.from(inputs.values()).sort((a, b) => (b.wrong - a.wrong) || (b.right - a.right) || a.input.localeCompare(b.input, "zh-HK"))
        })).sort((a, b) => {
          const ai = stepOrder.indexOf(a.step);
          const bi = stepOrder.indexOf(b.step);
          return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
        });
      }

      function render() {
        const rows = selectedRows().filter((row) => row.step !== "選擇中位數");
        const wrong = rows.filter((row) => !row.ok);
        const scope = document.getElementById("scopeNote");
        if (state.sheetNote === "sheet") {
          scope.textContent = "已合併這部瀏覽器和試算表。重新整理會更新。";
        } else if (state.sheetNote === "delete-pending") {
          scope.textContent = "這部瀏覽器的記錄已清除。試算表要貼上新程式並部署新版本後，再按一次清除。";
        } else if (state.sheetNote === "denied") {
          scope.textContent = "試算表拒絕讀取。請在 Apps Script 把密碼改成與這裡相同，再部署新版本。下面先顯示這部瀏覽器的作答。";
        } else if (state.sheetNote === "sheet-fail") {
          scope.textContent = "試算表暫時讀不到。下面先顯示這部瀏覽器的作答。";
        } else {
          scope.textContent = "現在只看這部瀏覽器。其他電話要等試算表接上之後，才會出現在這裡。";
        }
        document.getElementById("countNote").textContent = rows.length + " 次作答，" + wrong.length + " 次不對。";

        const ranked = rankGaps(rows);
        const focus = document.getElementById("focus");
        focus.textContent = "";
        if (!ranked.length) {
          const empty = document.createElement("p");
          empty.className = "note";
          empty.textContent = "這段還沒有不對的作答。";
          focus.appendChild(empty);
        } else {
          const top = ranked[0];
          const card = document.createElement("div");
          card.className = "focus-card";
          card.appendChild(weakRow(top.gap, top.count + " 次", 1));
          const tip = document.createElement("p");
          tip.className = "note advice";
          tip.textContent = advice[top.gap] || advice["其他"];
          card.appendChild(tip);
          const tied = ranked.slice(1).filter((group) => group.count === top.count);
          if (tied.length) {
            const same = document.createElement("p");
            same.className = "note";
            same.textContent = "同樣多次：" + tied.map((group) => group.gap).join("、") + "。";
            card.appendChild(same);
          }
          const wrongs = rows.filter((row) => !row.ok && row.gap === top.gap);
          const writings = tallyInputs(wrongs);
          if (writings.length) {
            const caption = document.createElement("p");
            caption.className = "note";
            caption.textContent = "最常見的錯法";
            const list = document.createElement("ul");
            list.className = "input-list";
            list.appendChild(inputLine(writings[0]));
            card.append(caption, list);
            const step = wrongs[0] ? wrongs[0].step : "";
            const others = writings.slice(1);
            const correct = tallyInputs(rows.filter((row) => row.ok && row.step === step)).filter((item) => item.right);
            if (others.length || correct.length) {
              const more = document.createElement("button");
              more.type = "button";
              more.className = "btn btn-secondary";
              const key = "gap:" + top.gap;
              more.textContent = state.correctOpen[key] ? "收起其餘寫法" : "其餘寫法";
              const extra = document.createElement("div");
              extra.hidden = !state.correctOpen[key];
              if (others.length) {
                const otherList = document.createElement("ul");
                otherList.className = "input-list";
                others.forEach((item) => otherList.appendChild(inputLine(item)));
                extra.appendChild(otherList);
              }
              if (correct.length) {
                const rightNote = document.createElement("p");
                rightNote.className = "note";
                rightNote.textContent = "對的寫法";
                const rightList = document.createElement("ul");
                rightList.className = "input-list";
                correct.forEach((item) => rightList.appendChild(inputLine(item)));
                extra.append(rightNote, rightList);
              }
              more.addEventListener("click", () => {
                state.correctOpen[key] = !state.correctOpen[key];
                render();
              });
              card.append(more, extra);
            }
          }
          focus.appendChild(card);
        }

        const gaps = document.getElementById("gaps");
        gaps.textContent = "";
        const otherGaps = ranked.slice(1);
        if (!otherGaps.length) {
          const empty = document.createElement("p");
          empty.className = "note";
          empty.textContent = "沒有其他難點。";
          gaps.appendChild(empty);
        } else {
          otherGaps.forEach((group) => {
            const block = document.createElement("div");
            block.className = "bar-block";
            block.appendChild(weakRow(group.gap, group.count + " 次", group.count / ranked[0].count));
            const tip = document.createElement("p");
            tip.className = "note advice";
            tip.textContent = advice[group.gap] || advice["其他"];
            block.appendChild(tip);
            gaps.appendChild(block);
          });
        }

        const steps = document.getElementById("steps");
        steps.textContent = "";
        const stepMap = new Map();
        rows.forEach((row) => {
          if (!stepMap.has(row.step)) stepMap.set(row.step, { step: row.step, right: 0, wrong: 0 });
          const item = stepMap.get(row.step);
          if (row.ok) item.right += 1;
          else item.wrong += 1;
        });
        const stepRows = Array.from(stepMap.values()).sort((a, b) => {
          const ai = stepOrder.indexOf(a.step);
          const bi = stepOrder.indexOf(b.step);
          return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
        });
        const wrongSteps = stepRows.filter((item) => item.wrong > 0);
        if (!wrongSteps.length) {
          const empty = document.createElement("p");
          empty.className = "note";
          empty.textContent = "沒有不對的步驟。";
          steps.appendChild(empty);
        } else {
          const legend = document.createElement("p");
          legend.className = "legend";
          legend.textContent = "";
          [["swatch swatch-wrong", "不對"], ["swatch swatch-right", "對"]].forEach((pair) => {
            const span = document.createElement("span");
            const mark = document.createElement("i");
            mark.className = pair[0];
            span.append(mark, document.createTextNode(pair[1]));
            legend.appendChild(span);
          });
          steps.appendChild(legend);
          const maxStep = Math.max.apply(null, wrongSteps.map((item) => item.right + item.wrong));
          wrongSteps.forEach((item) => {
            const block = document.createElement("div");
            block.className = "bar-block";
            const row = document.createElement("div");
            row.className = "weak-row";
            const track = document.createElement("div");
            track.className = "bar-track";
            if (item.wrong) {
              const wrongBar = document.createElement("div");
              wrongBar.className = "stack-wrong";
              wrongBar.style.width = Math.max(6, Math.round(item.wrong / maxStep * 100)) + "%";
              track.appendChild(wrongBar);
            }
            if (item.right) {
              const rightBar = document.createElement("div");
              rightBar.className = "stack-right";
              rightBar.style.width = Math.max(6, Math.round(item.right / maxStep * 100)) + "%";
              track.appendChild(rightBar);
            }
            row.append(weakLabel(item.step, "不對 " + item.wrong + " · 對 " + item.right), track);
            block.appendChild(row);
            steps.appendChild(block);
          });
        }

        const inputs = document.getElementById("inputs");
        inputs.textContent = "";
        const grouped = groupInputs(rows).filter((group) => group.inputs.some((item) => item.wrong));
        if (!grouped.length) {
          const empty = document.createElement("p");
          empty.className = "note";
          empty.textContent = "這段還沒有不對的寫法。";
          inputs.appendChild(empty);
        } else {
          grouped.forEach((group) => {
            const block = document.createElement("div");
            block.className = "bar-block";
            const head = document.createElement("div");
            head.className = "bar-top";
            const title = document.createElement("strong");
            title.textContent = group.step;
            const wrongKinds = group.inputs.filter((item) => item.wrong);
            const rightKinds = group.inputs.filter((item) => item.right && !item.wrong);
            const count = document.createElement("span");
            count.className = "note";
            count.textContent = wrongKinds.length + " 種錯法";
            head.append(title, count);
            const list = document.createElement("ul");
            list.className = "input-list";
            wrongKinds.forEach((item) => list.appendChild(inputLine(item)));
            block.append(head, list);
            if (rightKinds.length) {
              const key = "step:" + group.step;
              const more = document.createElement("button");
              more.type = "button";
              more.className = "btn btn-secondary";
              more.textContent = state.correctOpen[key] ? "收起對的寫法" : "對的寫法";
              const extra = document.createElement("ul");
              extra.className = "input-list";
              extra.hidden = !state.correctOpen[key];
              rightKinds.forEach((item) => extra.appendChild(inputLine(item)));
              more.addEventListener("click", () => {
                state.correctOpen[key] = !state.correctOpen[key];
                render();
              });
              block.append(more, extra);
            }
            inputs.appendChild(block);
          });
        }

        const rest = document.getElementById("rest");
        const restButton = document.getElementById("toggleRest");
        const hasOther = ranked.length > 0;
        restButton.hidden = !hasOther;
        if (!hasOther) state.restOpen = false;
        rest.hidden = !state.restOpen;
        restButton.textContent = state.restOpen ? "收起其他步驟" : "其他步驟";

        const toggle = document.getElementById("toggleRecent");
        toggle.textContent = (state.recentOpen ? "收起逐次作答" : "展開逐次作答") + "（" + rows.length + "）";
        const recent = document.getElementById("recent");
        recent.hidden = !state.recentOpen;
        recent.textContent = "";
        const latest = rows.slice(-40).reverse();
        if (!latest.length) {
          const empty = document.createElement("p");
          empty.className = "note";
          empty.textContent = "這段還沒有作答。";
          recent.appendChild(empty);
          tellParent();
          return;
        }
        latest.forEach((row) => {
          const card = document.createElement("article");
          card.className = "attempt";
          const head = document.createElement("p");
          head.textContent = formatTime(row.at) + " · " + row.source + " · " + row.lesson + " · " + row.step;
          const body = document.createElement("p");
          body.textContent = "輸入：" + (row.input || "（空白）") + " · ";
          const mark = document.createElement("span");
          mark.className = row.ok ? "right" : "wrong";
          mark.textContent = row.ok ? "對" : "錯";
          body.appendChild(mark);
          if (!row.ok) body.appendChild(document.createTextNode(" · " + row.gap));
          const id = document.createElement("p");
          id.className = "note";
          id.textContent = "編號 " + (row.device || "—");
          card.append(head, body, id);
          recent.appendChild(card);
        });
        tellParent();
      }

      function tellParent() {
        if (new URLSearchParams(location.search).get("embed") !== "1" || window.parent === window) return;
        setTimeout(() => {
          parent.postMessage({ type: "median-review-height", height: document.documentElement.scrollHeight }, location.origin);
        }, 0);
      }

      function savedPassword() {
        try { return localStorage.getItem("median-review-key") || ""; }
        catch (error) { return ""; }
      }

      function rememberPassword(password) {
        try { localStorage.setItem("median-review-key", password); }
        catch (error) {}
      }

      function forgetPassword() {
        try { localStorage.removeItem("median-review-key"); }
        catch (error) {}
      }

      function showGate(message) {
        const error = document.getElementById("gateError");
        error.hidden = !message;
        if (message && !expectedPassword()) {
          error.textContent = "公開頁讀不到試算表，所以進不去。請開老師電腦的本機頁，用 teacher-config.js 裡的密碼。";
        } else if (message) {
          error.textContent = "密碼不對。";
        }
        document.getElementById("gate").hidden = false;
        document.getElementById("app").hidden = true;
      }

      function openReview(typed) {
        const expected = expectedPassword();
        const url = window.MEDIAN_TEACHER && window.MEDIAN_TEACHER.collectUrl;
        if (!typed || (expected && typed !== expected) || (!expected && !url)) {
          forgetPassword();
          showGate(true);
          return;
        }
        document.getElementById("gateError").hidden = true;
        const local = localRows();
        loadSheet(typed).then((sheet) => {
          const sheetOk = !!(sheet && sheet.ok && !sheet.skipped);
          if (!expected && !sheetOk) {
            forgetPassword();
            showGate(true);
            return;
          }
          rememberPassword(typed);
          const remote = sheetOk && Array.isArray(sheet.rows) ? sheet.rows : [];
          state.rows = merge(local, remote);
          state.sheetNote = sheet && sheet.skipped ? "local" : (sheetOk ? "sheet" : (sheet && sheet.denied ? "denied" : "sheet-fail"));
          document.getElementById("gate").hidden = true;
          document.getElementById("app").hidden = false;
          render();
        });
      }

      document.getElementById("gate").addEventListener("submit", (event) => {
        event.preventDefault();
        openReview(document.getElementById("password").value);
      });
      document.getElementById("lockReview").addEventListener("click", () => {
        forgetPassword();
        document.getElementById("password").value = "";
        showGate(false);
      });
      document.getElementById("clearReview").addEventListener("click", () => {
        if (!window.confirm("確定清除全部作答記錄？")) return;
        const password = savedPassword() || document.getElementById("password").value;
        try { localStorage.removeItem("median-attempts"); } catch (error) {}
        loadSheet(password, "delete").then((sheet) => {
          if (sheet && sheet.deleted) {
            state.rows = [];
            state.sheetNote = "sheet";
          } else {
            const remote = sheet && sheet.ok && Array.isArray(sheet.rows) ? sheet.rows : [];
            state.rows = merge([], remote);
            state.sheetNote = "delete-pending";
          }
          render();
        });
      });
      if (savedPassword()) openReview(savedPassword());
      document.getElementById("from").addEventListener("change", render);
      document.getElementById("to").addEventListener("change", render);
      document.getElementById("toggleRest").addEventListener("click", () => {
        state.restOpen = !state.restOpen;
        render();
      });
      document.getElementById("toggleRecent").addEventListener("click", () => {
        state.recentOpen = !state.recentOpen;
        render();
      });
    })();
  </script>
</body>
</html>
