<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中位數</title>
  <script src="median.js"></script>
  <script>
    window.MEDIAN_TEACHER = window.MEDIAN_TEACHER || { geminiKey: "" };
  </script>
  <script src="teacher-config.js"></script>
  <style>
    :root {
      --pos-color: #2563eb;
      --pos-bg: #dbeafe;
      --val-color: #dc2626;
      --val-bg: #fee2e2;
      --median-color: #16a34a;
      --median-bg: #dcfce7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.25rem;
      color: #0f172a;
      margin: 0 0 4px;
    }

    .progress { margin: 0 0 16px; color: #475569; font-weight: bold; }

    .teacher-bar {
      background: #fff7ed;
      border: 1px solid #fdba74;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .teacher-bar p { margin: 8px 0; line-height: 1.5; }

    .card {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      margin-bottom: 10px;
    }

    .card-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .problem-text { line-height: 1.6; margin: 8px 0 12px; }
    .problem-img { max-width: 100%; height: auto; border: 1px solid #cbd5e1; border-radius: 8px; background: white; display: block; margin: 8px 0 12px; }

    .sheet p { margin: 8px 0; font-size: 1.05rem; }

    .table-wrapper {
      overflow-x: auto;
      background: white;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      padding: 4px;
    }

    table.horizontal-table { border-collapse: collapse; width: auto; min-width: 100%; white-space: nowrap; }
    .table-stage { position: relative; display: inline-block; min-width: 100%; }
    table.horizontal-table th, table.horizontal-table td {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      text-align: center;
    }
    table.horizontal-table th.row-header {
      background-color: #f8fafc;
      font-weight: bold;
      color: #334155;
      min-width: 72px;
      max-width: 7em;
      white-space: normal;
      line-height: 1.25;
    }
    .static-cell { font-weight: bold; min-width: 48px; }
    table.horizontal-table input {
      width: 64px;
      text-align: center;
      padding: 6px;
      font-size: 1rem;
      font-weight: bold;
      border: 1px solid #94a3b8;
      border-radius: 6px;
    }
    .remove-col {
      color: #dc2626;
      cursor: pointer;
      border: none;
      background: none;
      font-weight: bold;
      font-size: 1rem;
    }

    .curve-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .curve-wrap svg { width: 100%; height: auto; min-width: 640px; display: block; touch-action: none; cursor: ns-resize; }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-hint { background: #d97706; }
    .btn-hint:hover { background: #b45309; }
    .btn-hint.level-2 { background: #ea580c; }
    .btn-hint.level-2:hover { background: #c2410c; }
    .btn-hint.level-3 { background: #9a3412; }
    .btn-hint.level-3:hover { background: #7c2d12; }

    .legend { display: flex; gap: 16px; margin: 0 0 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: bold; }
    .badge { padding: 2px 8px; border-radius: 4px; }
    .badge-pos { background: var(--pos-bg); color: var(--pos-color); border: 1px solid var(--pos-color); }
    .badge-val { background: var(--val-bg); color: var(--val-color); border: 1px solid var(--val-color); }
    .badge-med { background: var(--median-bg); color: var(--median-color); border: 1px solid var(--median-color); }

    .blocks-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      background: white;
      border-radius: 8px;
      min-height: 80px;
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid #cbd5e1;
    }
    .block {
      display: flex;
      flex-direction: column;
      width: auto;
      min-width: 52px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid #cbd5e1;
      text-align: center;
    }
    .block-pos {
      background: var(--pos-bg);
      color: var(--pos-color);
      font-size: 0.68rem;
      font-weight: bold;
      padding: 2px 3px;
      white-space: nowrap;
    }
    .block-val {
      background: var(--val-bg);
      color: var(--val-color);
      font-size: 1.1rem;
      font-weight: bold;
      padding: 6px 0;
    }
    .block.highlight { border-color: var(--median-color); box-shadow: 0 0 10px rgba(22, 163, 74, 0.4); }
    .block.highlight .block-pos { background: var(--median-color); color: white; }
    .block-gap { align-self: center; font-size: 1.4rem; font-weight: bold; color: #64748b; padding: 0 4px; }
    .raw-scroll { overflow-x: hidden; max-width: 100%; padding-bottom: 4px; }
    .raw-plain { font-size: 1.05rem; font-weight: 700; line-height: 1.7; margin: 4px 0 8px; }
    .median-cut {
      display: inline-block;
      width: 0;
      height: 1.15em;
      margin: 0 6px;
      border-left: 3px solid #7c3aed;
      vertical-align: -0.15em;
    }
    .median-point {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: top;
      margin: 0 2px;
      line-height: 1;
    }
    .median-point-value { color: #15803d; }
    .median-point-arrow { color: #15803d; font-size: 0.72rem; font-weight: 800; line-height: 1; }
    .raw-case { margin: 12px 0 16px; }
    .raw-case-title { font-weight: 800; color: #1d4ed8; margin-bottom: 6px; }
    .raw-track { display: flex; align-items: flex-end; justify-content: center; gap: 8px; width: 100%; min-width: 0; }
    .raw-col { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1 1 0; min-width: 0; }
    .raw-col.raw-mid { flex: 0 0 auto; width: 4.8rem; }
    .raw-above { min-height: 2.5em; color: #2563eb; font-weight: 800; text-align: center; line-height: 1.15; white-space: nowrap; }
    .raw-num { font-size: 1.02rem; font-weight: 700; color: #0f172a; line-height: 1.45; text-align: center; overflow-wrap: anywhere; }
    .raw-num.median-num { color: #1d4ed8; }
    .raw-under { min-height: 2.4em; border-top: 2px solid #334155; text-align: center; font-size: 0.92rem; padding-top: 3px; width: 100%; }
    .list-and-trial { display: inline-flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
    .item-scroll { overflow-x: auto; background: white; border: 1px solid #cbd5e1; border-radius: 8px; }
    .item-track { display: flex; align-items: flex-end; width: max-content; padding: 8px 6px 4px; }
    .item-cell { display: flex; flex-direction: column; align-items: center; min-width: 1.7rem; padding: 0 1px; }
    .item-pos { font-size: 0.58rem; line-height: 1; color: #2563eb; font-weight: 700; white-space: nowrap; }
    .item-val { font-size: 0.95rem; font-weight: 800; color: #b91c1c; line-height: 1.25; min-width: 1.15rem; text-align: center; border-radius: 4px; padding: 1px 2px; }
    .item-cell.lit-a .item-val { background: #fde68a; box-shadow: inset 0 0 0 2px #d97706; }
    .item-cell.lit-b .item-val { background: #bbf7d0; box-shadow: inset 0 0 0 2px #15803d; }
    .item-arrow { color: #15803d; font-size: 0.72rem; line-height: 1; font-weight: 800; }
    .item-cut { width: 0; align-self: stretch; border-left: 3px solid #7c3aed; margin: 0 4px; position: relative; }
    .item-gap { align-self: center; color: #64748b; font-weight: 800; padding: 0 4px; }

    .result-box {
      margin-top: 16px;
      background: var(--median-bg);
      border: 2px solid var(--median-color);
      border-radius: 12px;
      padding: 16px 20px;
      color: #065f46;
    }
    .result-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 8px; color: #047857; }
    .formula-step { font-size: 1.05rem; margin: 8px 0; line-height: 1.6; }

    .action-row, .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .form-row input[type="text"], .form-row input[type="number"],
    .action-row input[type="text"], .action-row input[type="number"] {
      width: 140px;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #94a3b8;
      border-radius: 6px;
    }
    #askInput { width: min(100%, 280px); }

    [hidden] { display: none !important; }

    .question-line {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 0 8px;
      padding: 6px 2px;
      background: #f1f5f9;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.45;
      white-space: pre-line;
    }
    .cut-demo { margin: 0 0 10px; padding: 8px 8px 10px; background: #fff7ed; border: 1px solid #fdba74; border-radius: 10px; }
    .cut-kicker { margin: 0 0 8px; color: #9a3412; font-weight: 800; }
    .cut-board {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      padding-top: 1.15em;
      transition: gap 0.65s ease;
    }
    .cut-board.is-open { gap: 12px; }
    .cut-side, .cut-mid { display: flex; gap: 6px; }
    .cut-chip {
      min-width: 2.7rem;
      padding: 4px 4px 3px;
      border: 2px solid #334155;
      border-radius: 8px;
      background: white;
      text-align: center;
    }
    .cut-chip strong { display: block; font-size: 1.15rem; line-height: 1.2; }
    .cut-chip span { display: block; margin-top: 2px; color: #475569; font-size: 0.72rem; font-weight: 700; }
    .cut-mid .cut-chip { border-color: #2563eb; background: #eff6ff; }
    .cut-mid .cut-chip span { color: #1d4ed8; }
    .cut-knife { position: relative; width: 3px; }
    .cut-knife::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 2px;
      background: #dc2626;
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.4s ease 0.12s;
    }
    .cut-knife::after {
      content: "斬";
      position: absolute;
      top: -1.15em;
      left: 50%;
      color: #dc2626;
      font-size: 0.75rem;
      font-weight: 800;
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 0.25s ease 0.35s;
    }
    .cut-board.is-open .cut-knife::before { transform: scaleY(1); }
    .cut-board.is-open .cut-knife::after { opacity: 1; }
    .cut-caption { margin: 8px 0 0; line-height: 1.55; }
    .chat-log:empty { display: none; }
    .past-log { background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 10px; }
    .past-log summary { font-weight: bold; cursor: pointer; }
    .chat-log {
      background: white;
      border: none;
      padding: 8px 0 0;
      min-height: 0;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bubble { max-width: min(92%, 640px); padding: 10px 12px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; }
    .bubble-tutor { background: #f0fdf4; border: 1px solid #86efac; }
    .bubble-student { background: #dbeafe; border: 1px solid #93c5fd; align-self: flex-end; }
    .bubble-hint { background: #fffbeb; border: 1px solid #fcd34d; }
    .bubble-label { display: block; font-size: 0.75rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
    .trial-list { margin: 0; padding-left: 1.2rem; }
    .trial-readout { font-weight: 800; font-size: 1.2rem; min-width: 4.8rem; text-align: center; }
    .trial-stepper { display: inline-flex; align-items: center; gap: 6px; }
    .step-btn { min-width: 52px; min-height: 48px; font-size: 1.45rem; line-height: 1; padding: 8px 14px; }
    #toolCard { margin-bottom: 18px; }

    #pictureCard td.hl-left { background: #dbeafe; }
    #pictureCard td.hl-mid { background: #dcfce7; }
    #pictureCard td.hl-right { background: #ffedd5; }
    #pictureCard td.hl-join-left { box-shadow: inset 0 0 0 3px #2563eb; }
    #pictureCard td.hl-join-right { box-shadow: inset 0 0 0 3px #ea580c; }
    #pictureCard td.hl-join-both { box-shadow: inset 0 0 0 3px #2563eb, inset 0 0 0 6px #ea580c; }
    .balance-layout { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .balance-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
    .pile {
      flex: 1 1 160px;
      min-height: 84px;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
    }
    .pile-left { background: #dbeafe; border: 2px solid #2563eb; }
    .pile-mid { background: #dcfce7; border: 2px solid #16a34a; }
    .pile-right { background: #ffedd5; border: 2px solid #ea580c; }
    .pile-title { flex: 1 0 100%; font-size: 0.8rem; font-weight: bold; color: #334155; }
    .chip {
      background: white;
      border-radius: 8px;
      padding: 4px 8px;
      font-weight: bold;
      min-width: 42px;
      text-align: center;
      line-height: 1.2;
    }
    .chip small { display: block; font-weight: normal; color: #64748b; font-size: 0.72rem; }
    .median-slot {
      margin-top: 6px;
      background: #fef9c3;
      border: 2px solid #ca8a04;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      padding: 8px 6px;
    }
    .eq-sign { align-self: center; font-size: 1.8rem; font-weight: 800; color: #0f172a; }
    .form-row input.wide { width: min(100%, 280px); }

    #pictureCard td.hl-ask { outline: 3px solid #0f172a; outline-offset: -3px; }
    .more-box { margin-top: 10px; background: white; border-radius: 8px; padding: 8px 10px; }
    .more-box summary { font-weight: bold; cursor: pointer; }
    #tutorActions.tutor-dock {
      position: sticky;
      bottom: 0;
      z-index: 6;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -6px 16px rgba(15, 23, 42, 0.08);
    }
    .dock-btn { flex: 1 1 30%; min-height: 52px; font-size: 1.05rem; }
    .digit-wrap { flex: 1 1 100%; }
    .digit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .digit-grid .btn { min-height: 48px; background: #e2e8f0; color: #0f172a; }
    .entry-display { font-size: 1.35rem; font-weight: 800; text-align: center; padding: 6px 0 8px; }
    .chip-builder, .answer-box { flex: 1 1 100%; min-width: 100%; }
    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 4px;
    }
    .chip-btn {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 58px;
      border: 2px solid transparent;
      min-height: 52px;
      background: white;
      color: #0f172a;
      line-height: 1.15;
    }
    .chip-btn:hover { background: #f8fafc; }
    .chip-btn small { display: block; font-weight: 600; color: #64748b; font-size: 0.72rem; }
    .chip-btn.selected { outline: 3px solid #0f172a; }
    .chip-btn[data-side="left"] { border-color: #2563eb; }
    .chip-btn[data-side="right"] { border-color: #ea580c; }
    .chip-btn[data-side="pool"] { border-color: #cbd5e1; }
    .chip-btn:disabled { background: white; color: #0f172a; cursor: default; }
    #tutorLog:empty { display: none; }
    .btn-hint { min-height: 48px; }
    .built-eq { font-size: 1.2rem; font-weight: 800; text-align: center; margin: 8px 0; }
    .baskets { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
    .basket { flex: 1 1 90px; min-height: 88px; border-radius: 10px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
    .basket-pool { flex: 1 1 100%; background: #f8fafc; border: 2px dashed #94a3b8; }
    #pictureCard td.hl-walk-left { background: #93c5fd; box-shadow: inset 0 0 0 3px #1d4ed8; }
    #pictureCard td.hl-walk-right { background: #fdba74; box-shadow: inset 0 0 0 3px #c2410c; }
    #pictureCard td.hl-walk-mid { background: #86efac; box-shadow: inset 0 0 0 3px #15803d; }
    #pictureCard td.hl-walk-now { outline: 3px solid #0f172a; outline-offset: -3px; animation: walk-glow 0.7s ease; }
    @keyframes walk-glow { from { filter: brightness(1.45); } to { filter: brightness(1); } }
    .walk-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
    .walk-chip {
      position: absolute;
      width: 36px;
      box-sizing: border-box;
      padding: 3px 2px;
      border-radius: 8px;
      background: white;
      border: 2px solid #334155;
      font-weight: 800;
      text-align: center;
      line-height: 1.1;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .walk-chip small { display: block; font-weight: 600; color: #64748b; }
    .walk-chip.walk-gold { background: #fef9c3; border-color: #ca8a04; }
    .digit-grid .btn.digit-ok { background: #2563eb; color: white; }
    .dock-btn, .digit-grid .btn, .chip-btn { touch-action: manipulation; }
    .anim-trial { background: #fffbeb; border-color: #fcd34d; }
    .anim-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .anim-head .card-title { margin-bottom: 0; }
    .anim-tag { font-size: 0.78rem; font-weight: 800; color: #92400e; background: #fde68a; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
    .anim-note { margin: 0 0 6px; color: #92400e; font-size: 0.92rem; line-height: 1.45; }
    .anim-kicker { margin: 0 0 8px; min-height: 1.45em; font-weight: 800; font-size: 1.02rem; line-height: 1.45; }
    .anim-board { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px; min-height: 108px; overflow-x: auto; }
    .anim-sheet { display: grid; gap: 4px 6px; align-items: center; width: max-content; max-width: 100%; margin: 0 auto; }
    .anim-sheet .lab { font-size: 0.78rem; font-weight: 800; color: #475569; }
    .anim-pill { min-width: 36px; padding: 4px 2px; border-radius: 6px; border: 2px solid transparent; text-align: center; font-weight: 800; }
    .anim-pill.val { color: #b91c1c; }
    .anim-pill.freq { color: #0f172a; background: #f8fafc; border-color: #cbd5e1; transition: background 0.2s, border-color 0.2s; }
    .anim-pill.freq.on { background: #fde68a; border-color: #d97706; }
    .anim-pill.freq.done { background: #e2e8f0; border-color: #94a3b8; }
    .anim-total { margin-top: 10px; text-align: center; font-weight: 800; font-size: 1.15rem; }
    .anim-total strong { color: #1d4ed8; font-size: 1.55rem; }
    .anim-grid { position: relative; display: grid; column-gap: 4px; row-gap: 16px; width: max-content; max-width: 100%; margin: 0 auto; padding: 18px 2px 16px; }
    .anim-chip { position: relative; box-sizing: border-box; width: 30px; height: 34px; display: flex; align-items: center; justify-content: center; border: 2px solid #334155; border-radius: 6px; background: white; color: #b91c1c; font-weight: 800; transition: opacity 0.16s linear, background 0.16s, border-color 0.16s, color 0.16s, transform 0.3s; }
    .anim-chip.gone { opacity: 0.2; border-color: #cbd5e1; background: #f8fafc; color: #94a3b8; }
    .anim-chip.keep { border-color: #15803d; background: #dcfce7; color: #15803d; z-index: 1; }
    .anim-chip.grow { transform: scale(1.16); z-index: 2; }
    .anim-chip.cut::after { content: ""; position: absolute; top: 0; bottom: 0; right: -5px; width: 3px; background: #7c3aed; transform-origin: top center; animation: anim-drop 0.4s ease; }
    .anim-chip.extra, .anim-pill.extra { background: #ede9fe; color: #5b21b6; border-color: #7c3aed; }
    .anim-chip.extra-x, .anim-pill.extra-x { background: #fde68a; color: #92400e; border-color: #d97706; }
    .anim-chip.extra.gone, .anim-chip.extra-x.gone { opacity: 0.2; border-color: #cbd5e1; background: #f8fafc; color: #94a3b8; }
    .bridge-row { display: flex; flex-wrap: wrap; column-gap: 4px; row-gap: 18px; justify-content: center; padding-bottom: 16px; }
    .bridge-chip { position: relative; width: 30px; height: 32px; box-sizing: border-box; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; background: #e2e8f0; color: #0f172a; }
    .bridge-chip.extra { background: #ddd6fe; color: #5b21b6; }
    .bridge-chip.mid { box-shadow: inset 0 0 0 2px #ea580c; }
    .bridge-chip.mid::after { content: "▲"; position: absolute; left: 0; right: 0; bottom: -14px; text-align: center; font-size: 10px; color: #ea580c; }
    .anim-arrow { position: absolute; left: 50%; bottom: -15px; color: #15803d; font-size: 0.8rem; font-weight: 800; line-height: 1; transform: translateX(-50%); animation: anim-rise 0.35s ease; }
    .anim-mark { position: absolute; color: #2563eb; font-size: 0.72rem; font-weight: 800; line-height: 1; white-space: nowrap; transform: translateX(-50%); }
    .anim-math { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; min-height: 52px; margin-top: 8px; font-weight: 800; font-size: 1.25rem; }
    .anim-math .n { min-width: 2rem; padding: 4px 8px; border: 2px solid #15803d; border-radius: 8px; background: #dcfce7; color: #15803d; text-align: center; }
    .anim-math .op { color: #334155; }
    .anim-math .answer { transform: scale(0.7); opacity: 0; }
    .anim-math .answer.show { animation: anim-pop 0.4s ease forwards; }
    .anim-posbox { margin: 4px 0; text-align: center; font-weight: 800; line-height: 1.45; }
    .anim-posbox strong { color: #1d4ed8; font-size: 1.35rem; }
    .anim-cum { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .anim-cum th, .anim-cum td { border: 1px solid #cbd5e1; padding: 4px 3px; text-align: center; word-break: break-word; }
    .anim-cum th { background: #f8fafc; font-size: 0.75rem; }
    .anim-cum tr.now td { background: #fde68a; }
    .anim-cum tr.hit td { background: #dcfce7; font-weight: 800; }
    .anim-central { color: #15803d; font-size: 0.72rem; font-weight: 800; line-height: 1.3; }
    .anim-trial .btn { padding: 7px 10px; font-size: 0.86rem; }
    .anim-kicker.anim-kicker-sr { position: absolute; width: 1px; height: 1px; min-height: 0; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .anim-trial[data-clip="2"] .anim-board { overflow: hidden; }
    #animNext.anim-next-locate:not(:disabled) { background: #ecfdf5; color: #065f46; box-shadow: inset 0 0 0 2px #34d399; }
    .anim-loc-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .anim-loc-chip { border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 999px; padding: 3px 8px; font-size: 0.72rem; font-weight: 800; color: #334155; line-height: 1.35; }
    .anim-loc-chip.title { background: #e2e8f0; }
    .anim-loc-chip.found { background: #fff7ed; border-color: #fdba74; color: #c2410c; }
    .anim-band-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px; margin: 8px 0; background: white; }
    .anim-band-head, .anim-band-foot { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .anim-band-head strong { color: #0f172a; font-size: 0.84rem; }
    .anim-band-head span, .anim-band-foot { color: #64748b; font-size: 0.72rem; font-weight: 700; }
    .anim-band { position: relative; display: flex; height: 44px; margin: 8px 0 6px; border-radius: 8px; background: #e7f6ef; overflow: hidden; }
    .anim-seg { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; border-right: 1px solid rgba(255, 255, 255, 0.9); color: transparent; font-size: 0.62rem; font-weight: 800; line-height: 1.1; text-align: center; }
    .anim-seg.done { background: #cdeedf; color: #115e59; }
    .anim-seg.hit { background: #f8cfc4; color: #9a3412; }
    .anim-seg.low { background: #cdeedf; color: #115e59; }
    .anim-seg.mid { background: #bfdbfe; color: #1e3a8a; }
    .anim-seg.high { background: #e2e8f0; color: #334155; }
    .anim-seg.x { background: #fde68a; color: #92400e; }
    .anim-seg.extra, .anim-seg.done.extra, .anim-seg.hit.extra { background: #ddd6fe; color: #5b21b6; }
    .anim-seg.extra-x, .anim-seg.done.extra-x, .anim-seg.hit.extra-x { background: #fde68a; color: #92400e; }
    .anim-seg.land { box-shadow: inset 0 0 0 2px #ea580c; }
    .anim-seg span { padding: 0 1px; white-space: nowrap; }
    .anim-pin { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ea580c; z-index: 2; }
    .anim-pin::after { content: ""; position: absolute; left: -3px; bottom: 2px; width: 8px; height: 8px; border-radius: 50%; background: #ea580c; }
    .anim-loc-table { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
    .anim-loc-table th { background: #f1f5f4; color: #1e293b; font-size: 0.7rem; }
    .anim-loc-table th, .anim-loc-table td { border-bottom: 1px solid #e2e8f0; padding: 5px 2px; text-align: center; vertical-align: middle; word-break: break-word; }
    .anim-loc-table td.val { text-align: left; font-weight: 800; padding-left: 4px; }
    .anim-loc-table tr.hit { background: #fff1ee; }
    .anim-loc-table .pending { color: #94a3b8; }
    .anim-cum-pill { display: inline-block; min-width: 1.5rem; padding: 2px 6px; border-radius: 999px; background: #d1fae5; color: #047857; font-weight: 800; }
    .anim-pos-badge { display: inline-block; margin: 1px; padding: 2px 5px; border-radius: 999px; background: #e11d48; color: white; font-size: 0.66rem; font-weight: 800; line-height: 1.3; }
    .anim-loc-note { margin: 8px 0 0; font-size: 0.82rem; line-height: 1.45; color: #334155; }
    .xband-now { margin: 0 0 6px; text-align: center; font-size: 1.12rem; font-weight: 800; line-height: 1.35; color: #9a3412; }
    .xband-now.ok { color: #15803d; }
    .xband-zones { display: flex; gap: 2px; margin: 0 0 2px; }
    .xband-zones span { min-width: 0; overflow: hidden; text-align: center; white-space: nowrap; font-size: 0.68rem; font-weight: 800; color: #64748b; }
    .xband-zones .mid { color: #1d4ed8; }
    .xband-zones .high { color: #92400e; }
    .xband-aim { position: relative; height: 1.35em; }
    .xband-flag { position: absolute; transform: translateX(-50%); background: #1d4ed8; color: white; font-size: 0.68rem; font-weight: 800; line-height: 1.3; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
    .xband-flag::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -4px; border: 4px solid transparent; border-top-color: #1d4ed8; }
    @keyframes anim-drop { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes anim-rise { from { transform: translateX(-50%) translateY(8px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
    @keyframes anim-pop { to { transform: scale(1); opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .walk-chip { transition: none !important; }
      #pictureCard td.hl-walk-now { animation: none; }
      .cut-board, .cut-knife::before, .cut-knife::after { transition: none !important; }
      .anim-chip, .anim-pill.freq, .anim-chip.cut::after, .anim-arrow, .anim-math .answer { transition: none !important; animation: none !important; }
      .anim-math .answer { transform: none; opacity: 1; }
    }

    @media (max-width: 640px) {
      body { padding: 8px; }
      .container { padding: 10px; }
      h1 { font-size: 1.25rem; }
      .progress { margin-bottom: 8px; }
      .card { padding: 8px; margin-bottom: 6px; }
      .more-box { margin-top: 6px; padding: 4px 8px; }
      .action-row, .form-row { margin-top: 6px; }
      .question-line { margin-bottom: 6px; padding: 4px 2px; font-size: 1.08rem; }
      #tutorActions.tutor-dock { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
      .chat-log { max-height: 180px; min-height: 0; }
      table.horizontal-table th.row-header { min-width: 52px; padding: 6px 4px; }
      table.horizontal-table th, table.horizontal-table td { padding: 4px; }
      table.horizontal-table input { width: 42px; padding: 4px 2px; font-size: 0.95rem; }
      table.bridge-table th.row-header { min-width: 40px; }
      table.bridge-table input { width: 34px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div id="teacherBar" class="teacher-bar" hidden></div>
  <h1>中位數</h1>
  <p id="progress" class="progress"></p>
  <div class="card" id="pictureCard"></div>
  <div class="card anim-trial" id="animTrial" hidden>
    <div class="anim-head">
      <div class="card-title">動畫試做</div>
      <span class="anim-tag">可改可刪</span>
    </div>
    <div id="animBody">
      <p class="anim-note">動畫1由兩端找中間。動畫2沿項次位置帶逐行累加，找到中央項次。可逐步，或自動播放。</p>
      <p class="anim-kicker" id="animKicker" aria-live="polite"></p>
      <div class="anim-board" id="animBoard"></div>
      <div class="action-row">
        <button type="button" class="btn" id="animClip1">動畫1</button>
        <button type="button" class="btn btn-secondary" id="animClip2">動畫2</button>
        <button type="button" class="btn" id="animEven">這題</button>
        <button type="button" class="btn btn-secondary" id="animClose">收起</button>
      </div>
      <div class="action-row">
        <button type="button" class="btn btn-secondary" id="animPrev">上一步</button>
        <button type="button" class="btn" id="animNext">下一步</button>
        <button type="button" class="btn btn-secondary" id="animAuto">自動播放</button>
        <button type="button" class="btn btn-secondary" id="animReplay" hidden>重新示範</button>
      </div>
    </div>
    <div id="animReopen" hidden>
      <button type="button" class="btn btn-secondary" id="animOpen">看動畫試做</button>
    </div>
  </div>
  <div class="card" id="queueCard" hidden>
    <div class="card-title">由小至大排列的原始數據</div>
    <div id="blocksWrapper"></div>
    <div class="result-box" id="resultBox" hidden>
      <div class="result-title">中位數</div>
      <div id="resultContent"></div>
    </div>
  </div>
  <div class="card" id="tutorCard">
    <div id="tutorLog"></div>
    <div id="tutorForm"></div>
    <div class="form-row" id="tutorActions"></div>
  </div>
  <div class="card" id="checkCard" hidden>
    <div id="checkSlot"></div>
  </div>
  <div class="card" id="toolCard">
    <div id="toolSlot"></div>
  </div>
</div>
<script>
  const GEMINI_MODEL = "gemini-3.5-flash-lite";
  const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent";
  const teacherView = new URLSearchParams(location.search).get("teacher") === "1";

  const lessons = [
    {
      id: "discrete",
      kind: "discrete",
      title: "離散數據",
      header: "觀看的電影數目",
      stem: "（參考書 P10.23 例 10.12）下表所示為某班學生在暑假期間所觀看的電影數目。",
      rows: [
        { val: 0, freq: "4" },
        { val: 1, freq: "6" },
        { val: 2, freq: "9" },
        { val: 3, freq: "12" },
        { val: 4, freq: "5" }
      ],
      structure: 0
    },
    {
      id: "bridge",
      kind: "discrete",
      title: "加數據",
      header: "數值",
      freqHeader: "個數",
      stem: "下面有 5 個數據。先選一個中位數。另一顏色的數據會逐個加上，直到正中間落到這個數。",
      bridge: true,
      rows: [
        { val: 1, freq: "1" },
        { val: 2, freq: "1" },
        { val: 3, freq: "1" },
        { val: 4, freq: "1" },
        { val: 5, freq: "1" }
      ],
      structure: 0
    },
    {
      id: "pens",
      kind: "discrete",
      title: "求未知頻數",
      header: "原子筆的數目",
      freqHeader: "學生人數",
      stem: "8.（參考書 P10.23 例 10.13）（DSE 2025/I/Q9a,b）下表顯示一些學生擁有原子筆的數目的分佈。該分佈的中位數為 7。",
      target: "7",
      rows: [
        { val: 5, freq: "9" },
        { val: 6, freq: "13" },
        { val: 7, freq: "2" },
        { val: 8, freq: "x" },
        { val: 9, freq: "11" }
      ],
      structure: 0
    }
  ];
  const lessonTemplates = JSON.parse(JSON.stringify(lessons));

  let lessonIndex = 0;
  let phase = "type";
  let tutor = freshTutor();
  let fieldDrafts = {};
  let experiment = null;
  let bridgeRun = { target: null, added: 0, timer: 0 };
  let showBlocks = false;
  let discreteRevealed = false;
  let casesRevealed = false;
  let asking = false;
  let authFailed = false;
  let teacherNote = "";
  let askWasOpen = false;
  let readerCf = null;
  let walkSerial = 0;
  let walkTimer = 0;

  function freshTutor() {
    return {
      mode: "type", step: 1, log: [], hints: {}, trials: [], trap: false, solved: false,
      stale: false, blocked: false, phase: "ask", cursor: 0, placed: {}, selectedChip: "",
      entry: "", held: null, minLocked: false, guessMin: null, walk: null, walkPlayed: false,
      lit: [], arrow: false, litTrial: null
    };
  }

  function current() {
    return lessons[lessonIndex];
  }

  function geminiKey() {
    return String((window.MEDIAN_TEACHER && window.MEDIAN_TEACHER.geminiKey) || "").trim();
  }

  function pacificDateKey(date) {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Los_Angeles",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(date);
  }

  function storageGet(key) {
    try { return localStorage.getItem(key); } catch (error) { return null; }
  }

  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (error) { /* private mode */ }
  }

  function storageRemove(key) {
    try { localStorage.removeItem(key); } catch (error) { /* private mode */ }
  }

  function dailyLocked() {
    return storageGet("medianGeminiDay") === pacificDateKey(new Date());
  }

  function minuteLocked() {
    return Number(storageGet("medianGeminiMinuteUntil") || 0) > Date.now();
  }

  function aiOpen() {
    return !!geminiKey() && !authFailed && !dailyLocked() && !minuteLocked();
  }

  function remember429(body) {
    if (MedianMath.classifyQuota(body) === "minute") {
      storageSet("medianGeminiMinuteUntil", String(Date.now() + 60000));
    } else {
      storageSet("medianGeminiDay", pacificDateKey(new Date()));
    }
  }

  function modelOf(lesson) {
    return MedianMath.normalizeRows(lesson.rows.map((row) => ({
      val: String(row.val),
      freq: String(row.freq)
    })));
  }

  function knownView() {
    const model = modelOf(current());
    if (model.error || model.hasX) return null;
    return MedianMath.medianForX(model.rows, 1);
  }

  function parseCell(raw) {
    const text = normalizeTyped(raw).toLowerCase().replace(/\s+/g, "");
    if (!text) return null;
    if (text === "x") return { c: 0, k: 1 };
    if (/[a-wyz]/.test(text)) return null;
    const parsed = MedianMath.parseExpr(text);
    if (parsed) return parsed;
    const neg = text.match(/^-(\d+)$/);
    if (neg) return { c: -Number(neg[1]), k: 0 };
    return null;
  }

  function addExpr(a, b) {
    return { c: a.c + b.c, k: a.k + b.k };
  }

  function subExpr(a, b) {
    return { c: a.c - b.c, k: a.k - b.k };
  }

  function lessonHasX() {
    const lesson = current();
    const cells = lesson.kind === "continuous"
      ? lesson.cums.concat(lesson.freqs)
      : lesson.rows.map((row) => row.freq);
    return cells.some((cell) => {
      const expr = parseCell(cell);
      return expr && expr.k !== 0;
    });
  }

  function unknownLetter() {
    return "x";
  }

  function trialNumber() {
    const raw = document.getElementById("trialX");
    if (raw && String(raw.value).trim() !== "") return Number(raw.value);
    return experiment && Number.isInteger(experiment.x) ? experiment.x : NaN;
  }

  function currentTrial() {
    if (experiment && Number.isInteger(experiment.x) && experiment.x > 0) return experiment.x;
    return 1;
  }

  function continuousState(trialX) {
    const lesson = current();
    const bounds = lesson.bounds.map((value) => Number(value));
    const exprs = lesson.cums.map(parseCell);
    if (lesson.cums.concat(lesson.freqs).some((cell) => {
      const expr = parseCell(cell);
      return expr && expr.k !== 0;
    })) return { error: "no-x" };
    const freqExprs = lesson.freqs.slice(1).map(parseCell);
    if (bounds.some((value) => !Number.isFinite(value)) || exprs.some((expr) => !expr) || freqExprs.some((expr) => !expr)) return { error: "invalid" };
    const positive = freqExprs.filter((expr) => expr.k > 0).length;
    const negative = freqExprs.filter((expr) => expr.k < 0).length;
    if (positive > 1 || negative > 1) return { error: "multi-x" };
    const hasX = positive + negative > 0;
    if (hasX && (!Number.isInteger(trialX) || trialX <= 0)) return { error: "need-x", hasX: true };
    const x = hasX ? trialX : 0;
    const points = bounds.map((bound, index) => ({ x: bound, y: exprs[index].c + exprs[index].k * x }));
    for (let i = 1; i < points.length; i += 1) {
      if (!(points[i].x > points[i - 1].x) || points[i].y < points[i - 1].y - 1e-9) return { error: "order", hasX };
    }
    return { points, hasX, totalExpr: exprs[exprs.length - 1] };
  }

  function travelAnswer() {
    if (current().kind !== "continuous") return null;
    const state = continuousState(trialNumber());
    if (!state.points) return null;
    return MedianMath.curveMedian(state.points);
  }

  function recomputeCumsFromFreqs(lesson) {
    if (!parseCell(lesson.cums[0])) lesson.cums[0] = "0";
    for (let i = 1; i < lesson.freqs.length; i += 1) {
      const freq = parseCell(lesson.freqs[i]);
      const prev = parseCell(lesson.cums[i - 1]);
      if (!freq || !prev) continue;
      lesson.cums[i] = MedianMath.formatExpr(addExpr(prev, freq));
    }
  }

  function recomputeFreqsFromCums(lesson) {
    lesson.freqs[0] = "";
    for (let i = 1; i < lesson.cums.length; i += 1) {
      const cur = parseCell(lesson.cums[i]);
      const prev = parseCell(lesson.cums[i - 1]);
      if (!cur || !prev) continue;
      lesson.freqs[i] = MedianMath.formatExpr(subExpr(cur, prev));
    }
  }

  function writeInputValues(selector, values) {
    document.querySelectorAll(selector).forEach((input, index) => {
      if (document.activeElement === input) return;
      if (values[index] != null) input.value = values[index];
    });
  }

  function normalizeTyped(raw) {
    return String(raw ?? "").replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).trim();
  }

  function formatMedian(n) {
    if (Number.isInteger(n)) return String(n);
    return String(Math.round(n * 1000) / 1000);
  }

  function loadLesson(index) {
    lessons[index] = JSON.parse(JSON.stringify(lessonTemplates[index]));
    lessonIndex = index;
    const card = document.getElementById("pictureCard");
    if (card) card.dataset.key = "";
    const checkSlot = document.getElementById("checkSlot");
    if (checkSlot) checkSlot.dataset.mode = "";
    startWork();
  }

  function rememberFields() {
    document.querySelectorAll("input[id]").forEach((input) => {
      fieldDrafts[input.id] = input.value;
    });
  }

  function restoreField(input) {
    if (Object.prototype.hasOwnProperty.call(fieldDrafts, input.id)) input.value = fieldDrafts[input.id];
  }

  function render() {
    rememberFields();
    renderProgress();
    renderTeacher();
    renderPicture();
    renderQueue();
    renderTutor();
    renderCheck();
    renderTools();
    askWasOpen = aiOpen();
    syncAnimCard();
  }

  function showMode(index) {
    if (index === lessonIndex) return;
    lessonIndex = index;
    const card = document.getElementById("pictureCard");
    if (card) card.dataset.key = "";
    const checkSlot = document.getElementById("checkSlot");
    if (checkSlot) checkSlot.dataset.mode = "";
    startWork();
  }

  function startWork() {
    const lesson = current();
    const hasX = lessonHasX();
    phase = "steps";
    tutor = freshTutor();
    fieldDrafts = {};
    experiment = null;
    showBlocks = lesson.kind !== "continuous";
    discreteRevealed = false;
    casesRevealed = false;
    asking = false;
    bridgeStop();
    bridgeRun = { target: null, added: 0, timer: 0 };
    animTrial.pensOpen = false;
    animTrial.closed = true;
    animTrial.seen = false;
    animStop();
    if (lesson.bridge) {
      tutor.mode = "bridge";
      tutor.step = 1;
      tutor.log.push({ kind: "tutor", text: "選一個表裡已有的數值。紫色數據會逐個加上，直到正中間落到這個數。" });
      render();
      return;
    }
    if (hasX && lesson.kind !== "continuous") {
      const model = modelOf(lesson);
      const target = Number(lesson.target);
      if (!Number.isFinite(target) || model.error || !model.rows || !MedianMath.groupSpan(model.rows, target).found) {
        tutor.blocked = true;
        tutor.mode = "unknown";
        tutor.log.push({
          kind: "tutor",
          text: model.error === "multi-x"
            ? "只可以有一個未知數。請改好再按繼續。"
            : "表裡有未知數。請先填「題目的中位數」，並確認它是表裡的其中一個數值，再按繼續。"
        });
        render();
        return;
      }

  function adjustTrial(delta) {
    const x = Math.max(1, currentTrial() + delta);
    const lesson = current();
    const model = modelOf(lesson);
    const view = model.error ? null : MedianMath.medianForX(model.rows, x);
    const median = view ? view.median : null;
    const target = Number(lesson.target);
    const hit = median != null && Number.isFinite(target) && MedianMath.sameNumber(median, target);
    experiment = { x, view, hit, median };
    if (median != null) {
      const previous = tutor.trials[tutor.trials.length - 1];
      if (!previous || previous.x !== x || previous.median !== median) tutor.trials.push({ x, median, hit });
    }
    showBlocks = true;
    tutor.lit = [];
    tutor.arrow = false;
    tutor.litTrial = null;
    if (tutor.mode === "unknown" && tutor.step === 1 && !tutor.solved) {
      tutor.held = null;

  }

  function answerRange() {
    const lesson = current();
    const target = Number(lesson.target);
    if (!Number.isFinite(target)) return { error: "need-target" };
    if (lesson.kind !== "continuous") {
      const model = modelOf(lesson);
      if (model.error) return { error: model.error };
      return MedianMath.rangeForTarget(model.rows, target);
    }
    const hits = [];
    for (let x = 1; x <= 400; x += 1) {
      const state = continuousState(x);
      if (!state.points) continue;
      const answer = MedianMath.curveMedian(state.points);
      if (answer && answer.minute === target) hits.push(x);
    }
    if (!hits.length) return { none: true };
    const last = hits[hits.length - 1];
    const unbounded = last === 400 && [401, 420, 500].every((x) => {
      const state = continuousState(x);
      if (!state.points) return false;
      const answer = MedianMath.curveMedian(state.points);
      return answer && answer.minute === target;
    });
    return { min: hits[0], max: unbounded ? null : last, unbounded, none: false, intervals: [] };
  }

  function checkRange() {
    const note = document.getElementById("rangeNote");
    if (!note) return;
    const range = answerRange();
    if (range.error === "need-target") {
      note.textContent = "先填題目的中位數。";
      return;
    }
    if (range.error === "multi-x") {
      note.textContent = "只可以有一個未知數。";
      return;
    }
    if (range.error || range.none) {
      note.textContent = "按現在這張表，沒有正整數 x 能使中位數等於題目。";
      return;
    }
    const min = Number(normalizeTyped(document.getElementById("rangeMin").value));
    const max = Number(normalizeTyped(document.getElementById("rangeMax").value));
    if (!Number.isInteger(min) || min <= 0 || (!range.unbounded && (!Number.isInteger(max) || max <= 0))) {
      note.textContent = "最小和最大都要填正整數。";
      return;
    }
    const minOk = min === range.min;
    const maxOk = range.unbounded ? true : max === range.max;
    if (minOk && maxOk) {
      casesRevealed = true;
      showBlocks = true;
      const button = document.getElementById("toggleBlocks");
      if (button) button.textContent = "收起原始數據";
      note.textContent = range.unbounded
        ? "對。最小是 " + range.min + "，沒有最大可取值。"
        : "對。最小是 " + range.min + "，最大是 " + range.max + "。";
      renderQueue();
      return;
    }
    const notes = [];
    if (!minOk && min < range.min) notes.push("最小值偏小。");
    if (!minOk && min > range.min) notes.push("最小值偏大，還有更小的正整數也可以。");
    if (!range.unbounded && !maxOk && max > range.max) notes.push("最大值偏大。");
    if (!range.unbounded && !maxOk && max < range.max) notes.push("最大值偏小，還有更大的正整數也可以。");
    if (minOk) notes.unshift("最小值對了。");
    if (maxOk && !range.unbounded) notes.unshift("最大值對了。");
    note.textContent = notes.join("");
  }
