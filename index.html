  function plotFrame(points) {
    const w = 720;
    const h = 470;
    const pad = { l: 72, r: 24, t: 36, b: 86 };
    const xmin = points[0].x;
    const xmax = points[points.length - 1].x;
    const ymax = Math.max(...points.map((point) => point.y), 1);
    const plotW = w - pad.l - pad.r;
    const plotH = h - pad.t - pad.b;
    return {
      w: w,
      h: h,
      pad: pad,
      xmin: xmin,
      xmax: xmax,
      ymax: ymax,
      X: (x) => pad.l + (x - xmin) / (xmax - xmin) * plotW,
      Y: (y) => pad.t + (1 - y / ymax) * plotH,
      yAt: (py) => (1 - (py - pad.t) / plotH) * ymax
    };
  }

  function formatAxis(value) {
    if (Math.abs(value - Math.round(value)) < 0.05) return String(Math.round(value));
    return String(Math.round(value * 10) / 10);
  }

  function formatReadingMinute(value) {
    const rounded = Math.round(value * 10) / 10;
    return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
  }

  function curveSvg(points, guide) {
    const frame = plotFrame(points);
    const w = frame.w;
    const h = frame.h;
    const pad = frame.pad;
    const xmin = frame.xmin;
    const xmax = frame.xmax;
    const ymax = frame.ymax;
    if (!(xmax > xmin)) return "<p class=\"problem-text\">組界要由左到右變大。</p>";
    const X = frame.X;
    const Y = frame.Y;
    const samples = MedianMath.curveSamples(points, 0.15);
    const line = samples.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
    const fill = line + " L" + X(xmax).toFixed(1) + " " + Y(0).toFixed(1) + " L" + X(xmin).toFixed(1) + " " + Y(0).toFixed(1) + " Z";
    let grid = "";
    const yGrid = ymax >= 100 ? 10 : ymax >= 40 ? 5 : 1;
    const yLabel = ymax >= 200 ? 50 : ymax >= 80 ? 10 : yGrid;
    for (let y = 0; y <= ymax + 0.01; y += yGrid) {
      const major = Math.abs(y / yLabel - Math.round(y / yLabel)) < 0.01;
      grid += '<line x1="' + pad.l + '" y1="' + Y(y).toFixed(1) + '" x2="' + (w - pad.r) + '" y2="' + Y(y).toFixed(1) + '" stroke="' + (major ? "#e2e8f0" : "#f1f5f9") + '"/>';
      if (major) grid += '<text x="' + (pad.l - 8) + '" y="' + (Y(y) + 4).toFixed(1) + '" text-anchor="end" font-size="12" fill="#475569">' + formatAxis(y) + "</text>";
    }
    for (let x = Math.ceil(xmin); x <= Math.floor(xmax); x += 1) {
      grid += '<line x1="' + X(x).toFixed(1) + '" y1="' + pad.t + '" x2="' + X(x).toFixed(1) + '" y2="' + (h - pad.b) + '" stroke="#f1f5f9"/>';
      const nearBoundary = points.some((point) => Math.abs(point.x - x) < 1.2);
      if (x % 5 === 0 && !nearBoundary) {
        grid += '<text x="' + X(x).toFixed(1) + '" y="' + (h - pad.b + 34) + '" text-anchor="middle" font-size="11" fill="#64748b">' + x + "</text>";
      }
    }
    let dots = "";
    points.forEach((p) => {
      const label = formatAxis(p.x);
      grid += '<line x1="' + X(p.x).toFixed(1) + '" y1="' + pad.t + '" x2="' + X(p.x).toFixed(1) + '" y2="' + (h - pad.b) + '" stroke="#cbd5e1"/>';
      grid += '<text x="' + X(p.x).toFixed(1) + '" y="' + (h - pad.b + 16) + '" text-anchor="middle" font-size="12" fill="#0f172a">' + label + "</text>";
      dots += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="3.5" fill="#0f172a"/>';
    });
    let guideSvg = "";
    if (guide) {
      const answer = MedianMath.curveMedian(points);
      if (answer) {
      const gx = X(answer.rawX).toFixed(1);
      const gy = Y(points[0].y + answer.half).toFixed(1);
      guideSvg = '<line x1="' + pad.l + '" y1="' + gy + '" x2="' + gx + '" y2="' + gy + '" stroke="#16a34a" stroke-dasharray="6 4" stroke-width="2"/>' +
        '<line x1="' + gx + '" y1="' + gy + '" x2="' + gx + '" y2="' + (h - pad.b) + '" stroke="#16a34a" stroke-dasharray="6 4" stroke-width="2"/>' +
        '<circle cx="' + gx + '" cy="' + gy + '" r="4.5" fill="#16a34a"/>';
      }
    }
    const midY = (pad.t + h - pad.b) / 2;
    const chartTitle = current().chartTitle || "累積頻數曲線";
    return '<svg viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="' + chartTitle + '">' +
      '<text x="' + ((pad.l + w - pad.r) / 2) + '" y="20" text-anchor="middle" font-size="15" fill="#0f172a">' + chartTitle + "</text>" +
      grid +
      '<path d="' + fill + '" fill="#dbeafe" opacity="0.7"/>' +
      '<path d="' + line + '" fill="none" stroke="#0f172a" stroke-width="2.5"/>' +
      dots + guideSvg +
      '<text x="' + ((pad.l + w - pad.r) / 2) + '" y="' + (h - 16) + '" text-anchor="middle" font-size="13" fill="#334155">' + (current().axisLabel || "數值") + "</text>" +
      '<text x="18" y="' + midY + '" text-anchor="middle" font-size="13" fill="#334155" transform="rotate(-90 18 ' + midY + ')">累積頻數</text>' +
      "</svg>";
  }

  function ensureReaderCf(points) {
    const maxY = points[points.length - 1].y;
    const minY = points[0].y;
    if (readerCf == null || readerCf < minY || readerCf > maxY) {
      readerCf = minY + (maxY - minY) / 2;
    }
  }

  function svgPoint(svg, event) {
    const point = svg.createSVGPoint();
    point.x = event.clientX;
    point.y = event.clientY;
    const matrix = svg.getScreenCTM();
    if (!matrix) return null;
    return point.matrixTransform(matrix.inverse());
  }

  function paintReader(svg, points, frame) {
    const ns = "http://www.w3.org/2000/svg";
    let group = svg.querySelector("#readerGroup");
    if (!group) {
      group = document.createElementNS(ns, "g");
      group.id = "readerGroup";
      ["h", "v"].forEach((name) => {
        const line = document.createElementNS(ns, "line");
        line.id = "reader-" + name;
        line.setAttribute("stroke", "#dc2626");
        line.setAttribute("stroke-width", "2");
        group.appendChild(line);
      });
      const dot = document.createElementNS(ns, "circle");
      dot.id = "reader-dot";
      dot.setAttribute("r", "4.5");
      dot.setAttribute("fill", "#dc2626");
      group.appendChild(dot);
      const label = document.createElementNS(ns, "text");
      label.id = "reader-label";
      label.setAttribute("fill", "#dc2626");
      label.setAttribute("font-size", "13");
      label.setAttribute("font-weight", "700");
      group.appendChild(label);
      svg.appendChild(group);
    }
    const reading = MedianMath.valueAtCumulative(points, readerCf);
    if (!reading) return;
    const x = frame.X(reading.x);
    const y = frame.Y(reading.y);
    const horizontal = group.querySelector("#reader-h");
    horizontal.setAttribute("x1", String(frame.pad.l));
    horizontal.setAttribute("y1", String(y));
    horizontal.setAttribute("x2", String(x));
    horizontal.setAttribute("y2", String(y));
    const vertical = group.querySelector("#reader-v");
    vertical.setAttribute("x1", String(x));
    vertical.setAttribute("y1", String(y));
    vertical.setAttribute("x2", String(x));
    vertical.setAttribute("y2", String(frame.h - frame.pad.b));
    const dot = group.querySelector("#reader-dot");
    dot.setAttribute("cx", String(x));
    dot.setAttribute("cy", String(y));
    const label = group.querySelector("#reader-label");
    label.textContent = "累積頻數 " + Math.round(reading.y) + " → " + formatReadingMinute(reading.x);
    label.setAttribute("x", String(x > frame.w * 0.62 ? frame.pad.l + 8 : x + 8));
    label.setAttribute("y", String(Math.max(frame.pad.t + 16, y - 8)));
  }

  function bindReader(svg, points) {
    const frame = plotFrame(points);
    ensureReaderCf(points);
    paintReader(svg, points, frame);
    let dragging = false;
    const move = (event) => {
      const local = svgPoint(svg, event);
      if (!local) return;
      readerCf = Math.min(frame.ymax, Math.max(points[0].y, frame.yAt(local.y)));
      paintReader(svg, points, frame);
    };
    svg.addEventListener("pointerdown", (event) => {
      dragging = true;
      if (svg.setPointerCapture) svg.setPointerCapture(event.pointerId);
      move(event);
    });
    svg.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      move(event);
    });
    svg.addEventListener("pointerup", () => { dragging = false; });
    svg.addEventListener("pointercancel", () => { dragging = false; });
  }

  function renderQueue() {
    const card = document.getElementById("queueCard");
    const lesson = current();
    const title = card.querySelector(".card-title");
    if (title) title.textContent = "由小至大排列的原始數據";
    if (lesson.kind === "continuous") {
      card.hidden = true;
      const stale = document.getElementById("blocksWrapper");
      const staleResult = document.getElementById("resultContent");
      const staleBox = document.getElementById("resultBox");
      if (stale) stale.innerHTML = "";
      if (staleResult) staleResult.innerHTML = "";
      if (staleBox) staleBox.hidden = true;
      return;
    }
    const model = modelOf(lesson);
    const reveal = discreteRevealed || (tutor.solved && !model.hasX);
    const revealCases = model.hasX && (casesRevealed || tutor.solved);
    const wrapper = document.getElementById("blocksWrapper");
    const resultBox = document.getElementById("resultBox");
    const result = document.getElementById("resultContent");
    if (!(showBlocks || reveal || revealCases)) {
      card.hidden = true;
      wrapper.innerHTML = "";
      result.innerHTML = "";
      resultBox.hidden = true;
      return;
    }
    card.hidden = false;
    wrapper.innerHTML = "";
    result.innerHTML = "";
    resultBox.hidden = true;
    if (model.error === "multi-x") {
      wrapper.textContent = "只可以有一個未知數。";
      return;
    }
    if (model.error) {
      wrapper.textContent = "請輸入有效的數據與頻數。頻數須為正整數，或一個 s 或 x。";
      return;
    }
    const letter = unknownLetter();
    if (model.hasX && revealCases) {
      const range = MedianMath.rangeForTarget(model.rows, Number(lesson.target));
      if (!range || range.none) {
        wrapper.textContent = "按現在這張表，沒有正整數能使中位數等於題目。";
        return;
      }
      wrapper.appendChild(caseFigure(model.rows, letter, range));
      resultBox.hidden = false;
      result.append(stepLine("中位數 = " + formatMedian(Number(lesson.target)) + "。"));
      return;
    }
    if (model.hasX) {
      wrapper.appendChild(trialRaw(model.rows, letter));
      return;
    }
    const view = MedianMath.medianForX(model.rows, 1);
    if (!view) {
      wrapper.textContent = "請輸入有效的數據與頻數。";
      return;
    }
    const expanded = expandRows(model.rows, 1);
    if (!reveal && !rowMarksOn()) {
      wrapper.appendChild(plainLine(expanded));
      return;
    }
    wrapper.appendChild(compactRow(expanded, view, !!reveal));
    if (!reveal) return;
    resultBox.hidden = false;
    if (view.odd) {
      result.append(
        stepLine("數據的數目 = " + view.N + "，是奇數。中位數是第 " + view.positions[0] + " 個數據。"),
        stepLine("中位數 = " + formatMedian(view.median) + "。")
      );
    } else {
      result.append(
        stepLine("數據的數目 = " + view.N + "，是偶數。中位數是第 " + view.positions[0] + " 個和第 " + view.positions[1] + " 個數據的平均。"),
        stepLine("中位數 = (" + view.values[0] + " + " + view.values[1] + ") / 2 = " + formatMedian(view.median) + "。")
      );
    }
  }

  function renderCheck() {
    const card = document.getElementById("checkCard");
    const slot = document.getElementById("checkSlot");
    if (!card || !slot) return;
    const letter = current().kind === "continuous" ? "" : unknownLetter();
    const wanted = (current().kind === "continuous" ? "continuous" : (lessonHasX() ? "x" : "plain")) + ":" + letter;
    card.hidden = false;
    if (slot.dataset.mode === wanted && slot.childElementCount) return;
    slot.dataset.mode = wanted;
    slot.innerHTML = "";
    if (current().kind === "continuous") slot.appendChild(medianChecker());
    else if (lessonHasX()) slot.appendChild(rangeChecker());
    else slot.appendChild(discreteMedianChecker());
  }

  function runLabel(val, count) {
    const text = String(val);
    const n = Number(count);
    // Ellipsis only for an unknown frequency (s, x, or an expression). 2000 keeps a mistyped huge count from freezing the page.
    if (!Number.isInteger(n) || n < 0 || n > 2000) return text + ", …, " + text + "（" + count + " 個）";
    return Array.from({ length: n }, () => text).join(", ");
  }

  function compressValues(values) {
    const runs = [];
    values.forEach((val) => {
      const last = runs[runs.length - 1];
      if (last && last.val === val) last.count += 1;
      else runs.push({ val, count: 1 });
    });
    return runs.map((run) => runLabel(run.val, run.count)).join(", ");
  }

  function plainLine(values) {
    const line = document.createElement("p");
    line.className = "raw-plain";
    line.textContent = compressValues(values);
    return line;
  }

  function symbolicLine(rows, letter) {
    const line = document.createElement("p");
    line.className = "raw-plain";
    line.textContent = rows.map((row) => runLabel(row.val, row.freq.k ? MedianMath.formatExpr(row.freq, letter) : row.freq.c)).join(", ");
    return line;
  }

  function rawCol(text, under, median) {
    const col = document.createElement("div");
    col.className = "raw-col";
    const above = document.createElement("div");
    above.className = "raw-above";
    if (median) above.append(document.createTextNode("中位數"), document.createElement("br"), document.createTextNode("↓"));
    const num = document.createElement("div");
    num.className = "raw-num" + (median ? " median-num" : "");
    num.textContent = text;
    const brace = document.createElement("div");
    brace.className = "raw-under";
    brace.textContent = under || "";
    if (!under) brace.style.borderTopColor = "transparent";
    col.append(above, num, brace);
    return col;
  }

  function markedLine(expanded, view) {
    const first = view.positions[0] - 1;
    const last = view.positions[view.positions.length - 1];
    const left = expanded.slice(0, first);
    const mid = expanded.slice(first, last);
    const right = expanded.slice(last);
    const board = document.createElement("div");
    board.className = "raw-scroll";
    const row = document.createElement("div");
    row.className = "raw-track";
    if (left.length) row.appendChild(rawCol(compressValues(left), left.length + " 個數據", false));
    row.appendChild(rawCol(compressValues(mid), "", true));
    if (right.length) row.appendChild(rawCol(compressValues(right), right.length + " 個數據", false));
    board.appendChild(row);
    return board;
  }

  function caseFigure(rows, letter, range) {
    const wrap = document.createElement("div");
    const specs = [{ title: "情況一", x: range.min, which: "最小" }];
    if (!range.unbounded && range.max != null) specs.push({ title: "情況二", x: range.max, which: "最大" });
    specs.forEach((spec) => {
      const view = MedianMath.medianForX(rows, spec.x);
      const box = document.createElement("div");
      box.className = "raw-case";
      const heading = document.createElement("div");
      heading.className = "raw-case-title";
      heading.textContent = spec.title + "：" + letter + " = " + spec.x + "（" + spec.which + "）";
      box.appendChild(heading);
      if (view) box.appendChild(markedLine(expandRows(rows, spec.x), view));
      wrap.appendChild(box);
    });
    return wrap;
  }

  function stepLine(text) {
    const line = document.createElement("div");
    line.className = "formula-step";
    line.textContent = text;
    return line;
  }

  function expandRows(rows, x) {
    const expanded = [];
    rows.forEach((row) => {
      const count = row.freq.c + row.freq.k * x;
      for (let i = 0; i < count; i += 1) expanded.push(row.val);
    });
    return expanded;
  }

  function expandedCount(rows, x) {
    return rows.reduce((sum, row) => sum + row.freq.c + row.freq.k * x, 0);
  }

  function shortRuns(rows, x) {
    return rows.map((row) => {
      const count = row.freq.c + row.freq.k * x;
      const text = String(row.val);
      if (count <= 12) return Array.from({ length: count }, () => text).join(", ");
      return text + ", …, " + text + "（" + count + " 個）";
    }).join(", ");
  }

  function itemStep() {
    if (tutor.mode === "known") return 2;
    if (tutor.mode === "unknown") return 1;
    return -1;
  }

  function itemLabelsOn() {
    const step = itemStep();
    return step > 0 && !!(tutor.hints[step] && tutor.hints[step][1]);
  }

  function cutLineOn() {
    const step = itemStep();
    return step > 0 && !!(tutor.hints[step] && tutor.hints[step][2]);
  }

  function rowMarksOn() {
    return itemLabelsOn() || cutLineOn() || (tutor.lit && tutor.lit.length > 0);
  }

  function bookRuns(rows, x) {
    return rows.map((row) => {
      const count = row.freq.c + row.freq.k * x;
      const text = String(row.val);
      if (count <= 3) return Array.from({ length: count }, () => text).join(", ");
      return text + ", …, " + text + "（" + count + " 個）";
    }).join(", ");
  }

  function compactRow(expanded, view, solvedMarks) {
    const scroll = document.createElement("div");
    scroll.className = "item-scroll";
    const track = document.createElement("div");
    track.className = "item-track";
    const total = expanded.length;
    const indexes = [];
    if (total <= 60) {
      for (let i = 0; i < total; i += 1) indexes.push(i);
    } else {
      const keep = new Set();
      for (let i = 0; i < Math.min(6, total); i += 1) keep.add(i);
      for (let i = Math.max(0, total - 4); i < total; i += 1) keep.add(i);
      if (view) {
        view.positions.forEach((position) => {
          for (let delta = -4; delta <= 4; delta += 1) {
            const j = position - 1 + delta;
            if (j >= 0 && j < total) keep.add(j);
          }
        });
      }
      indexes.push(...[...keep].sort((a, b) => a - b));
    }
    const hintOdd = !!(view && view.odd && (solvedMarks || cutLineOn()));
    const lit = solvedMarks && view
      ? view.positions.map((position) => position - 1)
      : hintOdd
        ? [view.positions[0] - 1]
        : (lightsApply() ? (tutor.lit || []) : []);
    const arrow = solvedMarks || hintOdd || (!!tutor.arrow && lightsApply());
    const showCut = !!(view && !view.odd && (solvedMarks || cutLineOn()));
    let previous = -1;
    indexes.forEach((index) => {
      if (previous >= 0 && index > previous + 1) {
        const gap = document.createElement("span");
        gap.className = "item-gap";
        gap.textContent = "…";
        track.appendChild(gap);
      }
      if (showCut && view && ((view.odd && index === view.positions[0] - 1) || (!view.odd && index === view.positions[0]))) {
        const cut = document.createElement("div");
        cut.className = "item-cut";
        track.appendChild(cut);
      }
      const cell = document.createElement("div");
      let className = "item-cell";
      if (lit[0] === index) className += arrow && lit.length === 1 ? " lit-b" : " lit-a";
      if (lit[1] === index) className += " lit-b";
      if (arrow && lit.indexOf(index) >= 0) className += " arrowed";
      cell.className = className;
      const pos = document.createElement("span");
      pos.className = "item-pos";
      pos.textContent = "第" + (index + 1) + "項";
      const val = document.createElement("span");
      val.className = "item-val";
      val.textContent = String(expanded[index]);
      cell.append(pos, val);
      if (arrow && lit.indexOf(index) >= 0) {
        const mark = document.createElement("span");
        mark.className = "item-arrow";
        mark.textContent = "▲";
        cell.appendChild(mark);
      }
      track.appendChild(cell);
      previous = index;
    });
    scroll.appendChild(track);
    if (total > 60) {
      const note = document.createElement("p");
      note.className = "problem-text";
      note.textContent = "項數很多，這裡列出兩端和中間，每一格仍寫著第幾項。";
      const wrap = document.createElement("div");
      wrap.append(scroll, note);
      return wrap;
    }
    return scroll;
  }

  function lightsApply() {
    if (!tutor.lit || !tutor.lit.length) return false;
    if (tutor.mode === "unknown") return tutor.litTrial === currentTrial();
    return true;
  }

  function lightPosition(position, withArrow) {
    const index = position - 1;
    tutor.lit = tutor.lit || [];
    if (tutor.lit.indexOf(index) < 0) tutor.lit.push(index);
    tutor.arrow = !!withArrow;
    tutor.litTrial = tutor.mode === "unknown" ? currentTrial() : 1;
    showBlocks = true;
  }

  function clearLastLight() {
    if (tutor.lit && tutor.lit.length) tutor.lit.pop();
    tutor.arrow = false;
  }

  function scrollMark() {
    const mark = document.querySelector(".item-cut") || document.querySelector(".item-cell.lit-b") || document.querySelector(".item-cell.lit-a");
    if (mark) mark.scrollIntoView({ inline: "center", block: "nearest", behavior: "auto" });
  }

  function labeledBoard(expanded) {
    const board = document.createElement("div");
    board.className = "blocks-container";
    const total = expanded.length;
    const keep = new Set();
    const windowed = total > 80;
    if (!windowed) {
      expanded.forEach((_, index) => keep.add(index));
    } else {
      for (let i = 0; i < Math.min(16, total); i += 1) keep.add(i);
      for (let i = Math.max(0, total - 8); i < total; i += 1) keep.add(i);
      const mid = Math.floor((total - 1) / 2);
      for (let delta = -8; delta <= 8; delta += 1) {
        const j = mid + delta;
        if (j >= 0 && j < total) keep.add(j);
      }
    }
    let previous = -1;
    [...keep].sort((a, b) => a - b).forEach((index) => {
      if (previous >= 0 && index > previous + 1) {
        const gap = document.createElement("div");
        gap.className = "block-gap";
        gap.textContent = "…";
        board.appendChild(gap);
      }
      previous = index;
      const block = document.createElement("div");
      block.className = "block";
      const pos = document.createElement("div");
      pos.className = "block-pos";
      pos.textContent = "第" + (index + 1) + "項";
      const val = document.createElement("div");
      val.className = "block-val";
      val.textContent = String(expanded[index]);
      block.append(pos, val);
      board.appendChild(block);
    });
    if (windowed) {
      const note = document.createElement("p");
      note.className = "problem-text";
      note.textContent = "項數很多，這裡列出兩端和中間，每一格仍寫著第幾項。";
      const wrap = document.createElement("div");
      wrap.append(board, note);
      return wrap;
    }
    return board;
  }

  function trialRaw(rows, letter) {
    const wrap = document.createElement("div");
    const x = currentTrial();
    const caption = document.createElement("p");
    caption.className = "problem-text";
    caption.textContent = letter + " = " + x;
    wrap.appendChild(caption);
    const count = expandedCount(rows, x);
    const view = MedianMath.medianForX(rows, x);
    if (rowMarksOn() && view && count <= 400) wrap.appendChild(compactRow(expandRows(rows, x), view, false));
    else {
      const line = document.createElement("p");
      line.className = "raw-plain";
      line.textContent = bookRuns(rows, x);
      wrap.appendChild(line);
      if (rowMarksOn()) {
        const note = document.createElement("p");
        note.className = "problem-text";
        note.textContent = "這個數太大，未能逐項標出第幾項。試一個小一點的正整數。";
        wrap.appendChild(note);
      }
    }
    if (view) {
      const status = document.createElement("p");
      status.className = "problem-text";
      const target = Number(current().target);
      status.textContent = "中位數是 " + formatMedian(view.median) + "。" + (
        Number.isFinite(target)
          ? (MedianMath.sameNumber(view.median, target) ? "和題目一樣。" : "和題目不同。")
          : ""
      );
      wrap.appendChild(status);
    }
    return wrap;
  }

  function renderTutor() {
    renderLog();
    const form = document.getElementById("tutorForm");
    const actions = document.getElementById("tutorActions");
    form.innerHTML = "";
    actions.innerHTML = "";
    actions.className = "form-row tutor-dock";
    if (tutor.stale && !tutor.solved) {
      const note = document.createElement("p");
      note.className = "problem-text";
      note.textContent = "表已改過。重新開始後，會用現在的數字。";
      form.appendChild(note);
      actions.appendChild(makeButton("重新開始", "btn", beginSteps));
      if (aiOpen()) actions.appendChild(askRow());
      updateBalance();
      return;
    }
    if (tutor.blocked && !tutor.solved) {
      actions.appendChild(makeButton("繼續", "btn", beginSteps));
      if (aiOpen()) actions.appendChild(askRow());
      updateBalance();
      return;
    }
    if (tutor.solved) {
      if (current().kind !== "continuous") actions.appendChild(makeButton("去看連續數據", "btn", () => showMode(1)));
      else actions.appendChild(makeButton("回到離散數據", "btn btn-secondary", () => showMode(0)));
      updateBalance();
      return;
    }
    if (tutor.mode === "unknown" && tutor.step > 1) {
      renderUnknownControls(form, actions);
    } else {
      actions.appendChild(answerBox(confirmDigits));
    }
    const hintRow = document.createElement("div");
    hintRow.className = "form-row";
    [1, 2, 3].forEach((level) => {
      const bucket = hintBucket();
      const used = tutor.hints[bucket] && tutor.hints[bucket][level];
      const name = "提示" + "一二三"[level - 1];
      hintRow.appendChild(makeButton(used ? name + "（收起）" : name, "btn btn-hint" + (level > 1 ? " level-" + level : ""), () => showHint(level)));
    });
    form.appendChild(hintRow);
    if (aiOpen()) form.appendChild(askRow());
    updateBalance();
    if (tutor.phase === "shown" && tutor.walk && !tutor.walkPlayed) {
      tutor.walkPlayed = true;
      playWalk(tutor.walk);
    }
  }

  function askRow() {
    const row = document.createElement("div");
    row.className = "form-row";
    row.id = "askRow";
    const input = document.createElement("input");
    input.id = "askInput";
    input.type = "text";
    input.maxLength = 200;
    input.autocomplete = "off";
    input.placeholder = "想問這一小步，可以打在這裡";
    restoreField(input);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        askAi();
      }
    });
    const button = document.createElement("button");
    button.type = "button";
    button.id = "askSend";
    button.className = "btn btn-secondary";
    button.textContent = "問這一步";
    button.disabled = asking;
    button.addEventListener("click", askAi);
    row.append(input, button);
    return row;
  }

  function latestPrompt() {
    for (let i = tutor.log.length - 1; i >= 0; i -= 1) {
      if (tutor.log[i].kind === "tutor" || tutor.log[i].kind === "hint") return { index: i, item: tutor.log[i] };
    }
    return null;
  }

  function stepCaption() {
    return "";
  }

  function askQuestion() {
    tutor.log.push({ kind: "tutor", text: questionText(), asks: true, step: tutor.step });
  }

  function displayText(item) {
    if (!item) return "";
    if (item.kind === "hint" && item.bucket === hintBucket()) {
      const seen = tutor.hints[item.bucket];
      if (seen && seen[item.level]) return hintText(item.level);
    }
    if (item.kind === "tutor" && item.asks && item.step === tutor.step && !tutor.solved) return questionText();
    return item.text;
  }

  function paintQuestion() {
    const line = document.getElementById("questionLine");
    if (!line) return;
    const found = latestPrompt();
    const caption = stepCaption();
    const body = found ? displayText(found.item) : "";
    line.textContent = caption ? caption + body : body;
    syncCutDemo(line);
  }

  function cutHintOpen() {
    if (tutor.mode !== "known" || tutor.step !== 2 || tutor.solved) return false;
    const seen = tutor.hints[2];
    return !!(seen && seen[3]);
  }

  function cutSample(odd) {
    if (odd) {
      return {
        left: [[1, 1], [4, 2]],
        mid: [[7, 3]],
        right: [[9, 4], [12, 5]],
        caption: "例子：5 個數據，斬開後左右各有 2 個。正中間是第 3 項，數值是 7，中位數就是 7。回到上面自己數。"
      };
    }
    return {
      left: [[1, 1], [3, 2]],
      mid: [[4, 3], [8, 4]],
      right: [[9, 5], [10, 6]],
      caption: "例子：6 個數據，斬開後左右各有 2 個。正中間是第 3 項和第 4 項。中位數 = (4 + 8) / 2 = 6。回到上面自己數。"
    };
  }

  function cutGroup(pairs, mid) {
    const group = document.createElement("div");
    group.className = mid ? "cut-mid" : "cut-side";
    pairs.forEach((pair) => {
      const chip = document.createElement("div");
      chip.className = "cut-chip";
      const num = document.createElement("strong");
      num.textContent = String(pair[0]);
      const pos = document.createElement("span");
      pos.textContent = "第" + pair[1] + "項";
      chip.append(num, pos);
      group.appendChild(chip);
    });
    return group;
  }

  function cutKnife() {
    const knife = document.createElement("div");
    knife.className = "cut-knife";
    knife.setAttribute("aria-hidden", "true");
    return knife;
  }

  function syncCutDemo(line) {
    const existing = document.getElementById("cutDemo");
    if (!cutHintOpen()) {
      if (existing) existing.remove();
      return;
    }
    const demo = existing || document.createElement("div");
    demo.id = "cutDemo";
    demo.className = "cut-demo";
    if (demo.previousElementSibling !== line) line.insertAdjacentElement("afterend", demo);
    const view = knownView();
    const sample = cutSample(!!(view && view.odd));
    demo.innerHTML = "";
    const kicker = document.createElement("p");
    kicker.className = "cut-kicker";
    kicker.textContent = "斬一半";
    const board = document.createElement("div");
    board.className = "cut-board";
    board.setAttribute("aria-hidden", "true");
    board.append(cutGroup(sample.left, false), cutKnife(), cutGroup(sample.mid, true), cutKnife(), cutGroup(sample.right, false));
    const caption = document.createElement("p");
    caption.className = "cut-caption";
    caption.textContent = sample.caption;
    demo.append(kicker, board, caption);
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) board.classList.add("is-open");
    else requestAnimationFrame(() => requestAnimationFrame(() => board.classList.add("is-open")));
  }

  function logBubble(item) {
    const bubble = document.createElement("div");
    bubble.className = "bubble bubble-" + item.kind;
    if (item.kind === "hint") {
      const label = document.createElement("span");
      label.className = "bubble-label";
      label.textContent = "提示" + "一二三"[item.level - 1];
      bubble.appendChild(label);
    }
    const body = document.createElement("div");
    body.textContent = displayText(item);
    bubble.appendChild(body);
    return bubble;
  }

  function renderLog() {
    const log = document.getElementById("tutorLog");
    log.innerHTML = "";
    const found = latestPrompt();
    const older = tutor.log.filter((item, index) => !found || index !== found.index);
    if (older.length) {
      const details = document.createElement("details");
      details.className = "past-log";
      const summary = document.createElement("summary");
      summary.textContent = "先前的對話";
      const box = document.createElement("div");
      box.className = "chat-log";
      older.forEach((item) => box.appendChild(logBubble(item)));
      details.append(summary, box);
      log.appendChild(details);
    }
    paintQuestion();
  }

  function makeButton(label, className, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = className;
    button.textContent = label;
    button.addEventListener("click", onClick);
    return button;
  }

  function answerFields() {
    const row = document.createElement("div");
    row.className = "form-row";
    if (tutor.mode === "known" && tutor.step === 1) row.append(fieldLabel("N =", "knownN"));
    else if (tutor.mode === "known" && tutor.step === 2 && knownView() && !knownView().odd) {
      row.append(fieldLabel("第", "pos1"), text(" 項及第 "), fieldLabel("", "pos2"), text(" 項"));
    } else if (tutor.mode === "known" && tutor.step === 2) row.append(fieldLabel("第", "pos1"), text(" 項"));
    else if (tutor.mode === "known" && tutor.step === 3 && knownView() && !knownView().odd) {
      row.append(fieldLabel("較前那一項的數值 =", "knownVal1"), fieldLabel("較後那一項的數值 =", "knownVal2"));
    } else if (tutor.mode === "known" && tutor.step === 3) row.append(fieldLabel("中間那一項的數值 =", "knownVal1"));
    else if (tutor.mode === "known" && tutor.step === 4) row.append(fieldLabel("中位數 =", "knownMedian"));
    else if (tutor.mode === "unknown" && tutor.step === 1) {
      row.append(fieldLabel("比中位數小", "leftExpr"), fieldLabel("中間有", "midExpr"), text(" 個 "), fieldLabel("比中位數大", "rightExpr"));
    } else if (tutor.mode === "unknown" && tutor.step === 2) {
      row.append(fieldLabel("減 1 後剩下", "spareExpr"), text(" 個"));
    } else if (tutor.mode === "unknown" && tutor.step === 3) {
      row.append(fieldLabel("等式", "eqMin"));
    } else if (tutor.mode === "unknown" && tutor.step === 4 && tutor.phase !== "solve") {
      row.append(fieldLabel("等式", "eqMax"));
    } else if (tutor.mode === "unknown" && tutor.step === 4) {
      const range = answerRange();
      if (range && range.unbounded) row.append(fieldLabel("最小 x =", "ansMin"), text(" 沒有最大可取值"));
      else row.append(fieldLabel("最小 x =", "ansMin"), fieldLabel("最大 x =", "ansMax"));
    } else if (tutor.mode === "continuous" && tutor.step === 1) row.append(fieldLabel("總頻數 =", "cfTotal"));
    else if (tutor.mode === "continuous" && tutor.step === 2) row.append(fieldLabel("累積頻數 =", "cfHalf"));
    else if (tutor.mode === "continuous" && tutor.step === 3) row.append(fieldLabel("中位數 =", "minute"));
    return row;
  }

  function fieldLabel(caption, id, placeholder) {
    const label = document.createElement("label");
    if (caption) label.append(document.createTextNode(caption + " "));
    const input = document.createElement("input");
    input.type = "text";
    input.id = id;
    input.autocomplete = "off";
    if (placeholder) input.placeholder = placeholder;
    if (id === "eqMin" || id === "eqMax" || id === "leftExpr" || id === "rightExpr" || id === "exprN" || id === "spanStart" || id === "spanEnd") input.className = "wide";
    restoreField(input);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        if (tutor.mode === "unknown" && tutor.step === 4 && tutor.phase === "solve") checkFinalAnswer();
        else submitStep();
      }
    });
    label.appendChild(input);
    return label;
  }

  function text(value) {
    return document.createTextNode(value);
  }

  function trialSummary() {
    const wrap = document.createElement("div");
    if (!tutor.trials.length) {
      wrap.textContent = "你還沒有試過 x。";
      return wrap;
    }
    const list = document.createElement("ul");
    list.className = "trial-list";
    tutor.trials.slice(-8).forEach((trial) => {
      const item = document.createElement("li");
      item.textContent = "x = " + trial.x + "，中位數 " + formatMedian(trial.median) + (trial.hit ? "（符合題目）" : "（不符合題目）");
      list.appendChild(item);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function questionText() {
    if (phase === "type") return "做之前，先判斷：這是離散數據還是連續數據？";
    const lesson = current();
    if (tutor.mode === "known") {
      const view = knownView();
      if (!view) return "請先填好頻數表。";
      if (tutor.step === 1) return "單看頻數表，這批數據一共有多少個？";
      if (tutor.step === 2) return view.odd ? "中位數位於第幾項？" : "中位數在第幾項及第幾項的中間？";
      if (tutor.step === 3) return view.odd
        ? "中間那一項是哪個數值？"
        : "正中間這兩項的數值是多少？";
      return "總數是雙數。把這兩個數值加起來再除以 2。中位數是多少？";
    }
    if (tutor.mode === "continuous") {
      if (tutor.step === 1) return "曲線終點的高度就是數據的總頻數。總頻數是多少？";
      if (tutor.step === 2) return "連續數據的中位數，對應總頻數的 50%。這個累積頻數是多少？";
      return "在縱軸找到這個累積頻數，水平碰到曲線，再讀橫軸最接近的數值。中位數是多少？";
    }
    const letter = unknownLetter();
    const model = modelOf(lesson);
    const view = !model.error && model.rows ? MedianMath.medianForX(model.rows, currentTrial()) : null;
    if (tutor.step === 1) {
      if (!view) return "先用 − 和 + 選定一個正整數。";
      return view.odd
        ? "現在 " + letter + " = " + currentTrial() + "。中位數位於第幾項？"
        : "現在 " + letter + " = " + currentTrial() + "。中位數在第幾項及第幾項的中間？";
    }
    return "先分最小和最大兩種情況。中位數放在正中間，左邊的項數等於右邊的項數。" + letter + " 的最小和最大可取值是多少？";
  }

  function conceptText() {
    if (phase === "type") return "幫同學分辨分開逐個點算的數據，和有組界、用累積頻數曲線表示的數據。不要直接說出是離散還是連續。";
    if (tutor.mode === "known") {
      if (tutor.step === 1) return "幫他明白總數是把頻數相加。不要說出總數。";
      if (tutor.step === 2) return "幫他找出中位數是第幾項。奇數是正中間一項，偶數是正中間兩項。不要說出第幾項。";
      if (tutor.step === 3) return "幫他由最小的數值數起，找出那一項是哪個數值。不要說出那個數值。";
      return "幫他明白雙數要把中間兩個數值平均。不要說出中位數。";
    }
    if (tutor.mode === "continuous") {
      if (tutor.step === 1) return "幫他從曲線終點的高度讀總頻數。不要說出那個數。";
      if (tutor.step === 2) return "幫他明白連續數據取總頻數的 50% 作累積頻數，不是把逐個數據斬半。不要說出算出來的數。";
      return "幫他在一半的高度看曲線交點，再讀橫軸最接近的數值。不要說出那個數。";
    }
    const letter = unknownLetter();
    if (tutor.step === 1) return "幫他找出現在這個數的中位數是第幾項。奇數是正中間一項，偶數是正中間兩項。不要說出第幾項。";
    return "幫他分最小和最大兩種情況。中位數放在正中間，左邊的項數等於右邊的項數，從而自己寫出等式。不要寫出等式，不要說出最小和最大，也不要說出 " + letter + " 的值。";
  }

  function neighborValues(rows, target) {
    const index = rows.findIndex((row) => MedianMath.sameNumber(row.val, target));
    return {
      prev: index > 0 ? rows[index - 1].val : null,
      next: index >= 0 && index < rows.length - 1 ? rows[index + 1].val : null
    };
  }

  function hintText(level) {
    const lesson = current();
    if (phase === "type") {
      const continuous = lesson.kind === "continuous";
      if (level === 1) return "先看數據長什麼樣子：一個個分開的數值，還是一段段範圍畫成的曲線。";
      if (level === 2) return continuous ? "看橫軸的組界（有 .5），和一路向上累積的縱軸。" : "看每一欄是不是一個分開的數值，加上它出現的次數。";
      return "畫面上是頻數表，就選離散。畫面上是累積頻數曲線，就選連續。看清楚再按。";
    }
    if (tutor.mode === "known") return knownHint(level);
    if (tutor.mode === "continuous") return continuousHint(level);
    return unknownHint(level);
  }

  function knownHint(level) {
    const view = knownView();
    if (!view) return "請先填好頻數表。";
    if (tutor.step === 1) {
      if (level === 1) return "頻數是每個數值出現的次數。總數是全部頻數相加。";
      if (level === 2) return "把頻數那一列的數字逐個相加。";
      return "每一格頻數都加完，得到的數就是 N。自己算完再填。";
    }
    if (tutor.step === 2) {
      if (level === 1) return "看原始數據。每個數值上方寫著第幾項，由第 1 項數起。";
      if (level === 2) return view.odd
        ? "現在共 " + view.N + " 個，是單數。正中間只有一項，箭嘴和亮燈直接標出中位數的這一項。"
        : "現在共 " + view.N + " 個，是偶數。正中間剩下兩項。斬線畫在這兩項中間。";
      return view.odd
        ? "中位數位於第幾項？"
        : "中位數在第幾項及第幾項的中間？先填第幾項，對了再填及第幾項。";
    }
    if (tutor.step === 3) {
      if (level === 1) return "由最小的數值開始數。它的頻數就是開頭佔了多少項。";
      if (level === 2) return "一路數下去，看到中間那一項停在哪一個數值。雙數要看兩項，兩項可能是同一個數值，也可能跨到下一個數值。";
      return "沿表由左數到你求出的那一項，看是哪個數值。自己填。";
    }
    if (level === 1) return view.odd ? "單數時，中位數就是中間那一個數值。" : "雙數時，不要只取其中一個數值。";
    if (level === 2) return view.odd ? "把上一格的數值再填一次，它就是中位數。" : "把兩個中間數值相加，再除以 2。";
    return view.odd ? "中位數就是中間那一個數值。填進去就可以。" : "兩個數值相加後除以 2，算出來的才填。不要只填其中一個。";
  }

  function bracketBounds(points, rawX) {
    let left = points[0].x;
    let right = points[points.length - 1].x;
    for (let i = 0; i < points.length - 1; i += 1) {
      if (rawX >= points[i].x && rawX <= points[i + 1].x) {
        left = points[i].x;
        right = points[i + 1].x;
      }
    }
    return { left, right };
  }

  function continuousHint(level) {
    const answer = travelAnswer();
    if (!answer) return "先把組界和累積頻數填好。";
    if (tutor.step === 1) {
      if (level === 1) return "看曲線最右、最高的那一點。";
      if (level === 2) return "這一點的縱座標就是全部數據的個數。";
      return "終點對準的縱軸數字就是總頻數。自己讀完再填。";
    }
    if (tutor.step === 2) {
      if (level === 1) return "連續數據不是把逐個數據斬半，而是取總頻數的一半。";
      if (level === 2) return "用總頻數乘 50%，或除以 2。";
      return "用你上一格求出的總頻數計算 50%。算出來的數才填，不要填 50% 或 0.5。";
    }
    if (level === 1) return "在縱軸找到一半的累積頻數，看水平線會碰到曲線的哪裡。";
    if (level === 2) return "把紅線拖到那個高度，看垂直線落在哪兩個組界之間。";
    return "看垂直線靠近哪一個整數，填最接近的整數。剛好在兩個整數正中間時，填較小的那個。不要填小數，也不要填組界上的 .5。";
  }

  function unknownPlacement() {
    const model = modelOf(current());
    const target = Number(current().target);
    if (model.error || !Number.isFinite(target)) return "mixed";
    let before = 0;
    let at = 0;
    let after = 0;
    model.rows.forEach((row) => {
      if (!row.freq.k) return;
      if (row.val < target) before += row.freq.k;
      else if (row.val > target) after += row.freq.k;
      else at += row.freq.k;
    });
    if (before && !after && !at) return "left";
    if (after && !before && !at) return "right";
    if (at && !before && !after) return "mid";
    return "mixed";
  }

  function unknownHint(level) {
    const letter = unknownLetter();
    const model = modelOf(current());
    if (model.error || !model.rows) return "請先填好頻數表。";
    if (!MedianMath.groupSpan(model.rows, Number(current().target)).found) return "請先確認中位數是表裡的其中一個數值。";
    if (tutor.step === 1) {
      const view = MedianMath.medianForX(model.rows, currentTrial());
      if (!view) return "先用 − 和 + 選定一個正整數。";
      if (level === 1) return "看原始數據。每個數值上方寫著第幾項，由第 1 項數起。重複的數先用省略號。";
      if (level === 2) return view.odd
        ? "現在共 " + view.N + " 個，是單數。正中間只有一項，箭嘴和亮燈直接標出中位數的這一項。"
        : "現在共 " + view.N + " 個，是偶數。正中間剩下兩項。斬線畫在這兩項中間。";
      return view.odd
        ? "中位數位於第幾項？"
        : "中位數在第幾項及第幾項的中間？先填第幾項，對了再填及第幾項。";
    }
    if (level === 1) return "先分兩種情況：最小，和最大。用 − 和 + 試一個正整數，看中位數會不會變成題目的數。先不要算出最小和最大。";
    if (level === 2) return "把中位數放在正中間。它左邊的項數，要等於右邊的項數。";
    return "按最小和最大兩種情況，各自寫出左邊等於右邊的等式。先不要算出來。提示不寫出最小和最大。";
  }

  function pileText(rows) {
    if (!rows.length) return "0";
    return rows.map((row) => MedianMath.formatExpr(row.freq)).join(" + ");
  }

  function valueList(rows) {
    if (!rows.length) return "沒有";
    const name = current().header || "數值";
    return rows.map((row) => name + " " + row.val).join("、");
  }

  function sideText(parts) {
    const usable = parts.filter((part) => part && part !== "0");
    return usable.length ? usable.join(" + ") : "0";
  }

  function hintBucket() {
    if (tutor.mode === "unknown" && tutor.step === 4 && tutor.phase === "solve") return "solve";
    return tutor.step;
  }

  function shouldLabelItems() {
    return tutor.step === itemStep();
  }

  function showHint(level) {
    if (tutor.solved) return;
    const bucket = hintBucket();
    tutor.hints[bucket] = tutor.hints[bucket] || {};
    if (tutor.hints[bucket][level]) {
      tutor.hints[bucket][level] = false;
      tutor.log = tutor.log.filter((item) => !(item.kind === "hint" && item.level === level && item.bucket === bucket));
      render();
      return;
    }
    tutor.hints[bucket][level] = true;
    tutor.log.push({ kind: "hint", level, bucket, text: hintText(level) });
    const onItem = shouldLabelItems() && (level === 1 || level === 2);
    if (onItem) showBlocks = true;
    render();
    if (onItem) {
      const card = document.getElementById("queueCard");
      if (card) card.scrollIntoView({ block: "nearest", behavior: "auto" });
      if (level === 2) scrollMark();
    }
  }

  function answerType(choseContinuous) {
    const continuous = current().kind === "continuous";
    const correct = choseContinuous === continuous;
    tutor.log.push({ kind: "student", text: choseContinuous ? "連續數據" : "離散數據" });
    if (correct) {
      beginSteps();
      return;
    }
    const first = !tutor.trap;
    tutor.trap = true;
    tutor.log.push({
      kind: "tutor",
      text: continuous
        ? (first ? "還未對。橫軸標出的是組界，縱軸是一路累積的頻數。" : "這是一段段範圍，加上累積頻數曲線，不是逐個數值各算一次。再選一次。")
        : (first ? "還未對。表裡每一欄是一個分開的數值，旁邊是它的次數。沒有組界。" : "這是一個個分開的數值，各自一個次數，不是一段段範圍。再選一次。")
    });
    render();
  }

  function beginSteps() {
    const lesson = current();
    const hasX = lessonHasX();
    tutor.stale = false;
    tutor.blocked = false;
    tutor.hints = {};
    tutor.trap = false;
    tutor.solved = false;
    tutor.trials = [];
    if (hasX && !Number.isFinite(Number(lesson.target))) {
      tutor.blocked = true;
      tutor.log.push({ kind: "tutor", text: "表裡有未知數。請先填「題目的中位數」，再按繼續。" });
      render();
      return;
    }
    if (hasX && lesson.kind !== "continuous") {
      const model = modelOf(lesson);
      if (model.error) {
        tutor.blocked = true;
        tutor.log.push({ kind: "tutor", text: model.error === "multi-x" ? "只可以有一個未知數。請改好再按繼續。" : "頻數表還未有效。請先修正，再按繼續。" });
        render();
        return;
      }
      if (!MedianMath.groupSpan(model.rows, Number(lesson.target)).found) {
        tutor.blocked = true;
        tutor.log.push({ kind: "tutor", text: "你填的中位數不是表裡的其中一個數值。請核對題目的中位數，再按繼續。" });
        render();
        return;
      }
    }
    phase = "steps";
    tutor.mode = lesson.kind === "continuous" ? "continuous" : hasX ? "unknown" : "known";
    resetEntry();
    tutor.lit = [];
    tutor.arrow = false;
    tutor.litTrial = null;
    tutor.step = 1;
    askQuestion();
    render();
  }

  function resetEntry() {
    tutor.phase = "ask";
    tutor.cursor = 0;
    tutor.placed = {};
    tutor.selectedChip = "";
    tutor.entry = "";
    tutor.held = null;
    tutor.minLocked = false;
    tutor.guessMin = null;
    tutor.walk = null;
    tutor.walkPlayed = false;
  }

  function advance(message) {
    tutor.log.push({ kind: "tutor", text: message });
    const knownViewNow = tutor.mode === "known" ? knownView() : null;
    const maxStep = tutor.mode === "unknown" ? 2 : tutor.mode === "known" && knownViewNow && !knownViewNow.odd ? 4 : 3;
    tutor.step += 1;
    tutor.trap = false;
    resetEntry();
    if (tutor.step > maxStep) {
      tutor.solved = true;
      return;
    }
    askQuestion();
  }

  function markSolved(text) {
    tutor.solved = true;
    if (lessonIndex === lessons.length - 1) {
      text += "\n\n三題都做完了。\n離散數據要把數據由小到大排好：奇數個取最中間一項，偶數個取最中間兩項的平均。\n連續數據看累積頻數曲線，中位數對應總頻數的 50%，再從曲線讀回橫軸。\n兩種都叫中位數，但一個是找第幾項，一個是找一半的累積頻數。";
    }
    tutor.log.push({ kind: "tutor", text: text });
  }

  function submitStep() {
    if (tutor.mode === "known") submitKnown();
    else if (tutor.mode === "continuous") submitContinuous();
    else if (tutor.step === 1) submitTrialItem();
    else checkFinalAnswer();
  }

  function currentBalance() {
    const lesson = current();
    if (lesson.kind === "continuous") return null;
    const model = modelOf(lesson);
    const target = Number(lesson.target);
    if (model.error || !model.rows || !Number.isFinite(target)) return null;
    return MedianMath.balanceParts(model.rows, target);
  }

  function submitPiles() {
    const balance = currentBalance();
    const leftRaw = document.getElementById("leftExpr").value;
    const midRaw = document.getElementById("midExpr").value;
    const rightRaw = document.getElementById("rightExpr").value;
    tutor.log.push({ kind: "student", text: "小：" + leftRaw + "，中：" + midRaw + "，大：" + rightRaw });
    if (!balance || !balance.found) {
      tutor.log.push({ kind: "tutor", text: "請先確認中位數是表裡的其中一個數值。" });
      render();
      return;
    }
    const leftOk = MedianMath.sameExpr(MedianMath.parseExprFromText(leftRaw), balance.left);
    const midOk = MedianMath.sameExpr(MedianMath.parseExprFromText(midRaw), balance.midFreq);
    const rightOk = MedianMath.sameExpr(MedianMath.parseExprFromText(rightRaw), balance.right);
    if (leftOk && midOk && rightOk) {
      advance("對。左邊是 " + pileText(balance.leftRows) + "，中間是 " + MedianMath.formatExpr(balance.midFreq) + "，右邊是 " + pileText(balance.rightRows) + "。中間這一組先不要加進任何一邊。");
    } else {
      const notes = [];
      if (!leftOk) notes.push("比中位數小的那一堆還未對。");
      if (!midOk) notes.push("中位數那一組的個數還未對。");
      if (!rightOk) notes.push("比中位數大的那一堆還未對。");
      tutor.log.push({ kind: "tutor", text: notes.join("") + "可以先按提示一。" });
    }
    render();
  }

  function submitSpare() {
    const balance = currentBalance();
    const raw = document.getElementById("spareExpr").value;
    const parsed = MedianMath.parseExprFromText(raw);
    tutor.log.push({ kind: "student", text: "剩下 " + raw + " 個" });
    if (!balance || !balance.found) {
      tutor.log.push({ kind: "tutor", text: "請先確認中位數是表裡的其中一個數值。" });
    } else if (MedianMath.sameExpr(parsed, balance.spare)) {
      advance("對。拿走正中那 1 個之後，剩下 " + MedianMath.formatExpr(balance.spare) + " 個，才可以跟左邊或右邊一起數。");
    } else if (MedianMath.sameExpr(parsed, balance.midFreq)) {
      tutor.log.push({ kind: "tutor", text: "這是還沒減去中位數之前的個數。正中那一個不歸任何一邊。" });
    } else {
      tutor.log.push({ kind: "tutor", text: "還未對。這一組的個數先減 1。" });
    }
    render();
  }

  function submitMinEq() {
    const balance = currentBalance();
    const raw = document.getElementById("eqMin").value;
    tutor.log.push({ kind: "student", text: raw });

  function submitContinuous() {
    const answer = travelAnswer();
    if (!answer) {
      tutor.log.push({ kind: "tutor", text: "請先填好組界和累積頻數。如果有 x，先輸入一個正整數。" });

      tutor.log.push({ kind: "student", text: "總頻數 = " + raw });

    } else if (tutor.step === 2) {
      tutor.log.push({ kind: "student", text: "累積頻數 = " + raw });
      if (value === answer.half) advance("對。對應中位數的累積頻數是 " + answer.half + "。");
      else if (value === answer.total) tutor.log.push({ kind: "tutor", text: "這是總頻數。連續數據要再取它的 50%。" });
      else if (value === 0.5) tutor.log.push({ kind: "tutor", text: "那是百分比本身。把總頻數乘 50%，得到的才是累積頻數。" });
      else tutor.log.push({ kind: "tutor", text: "還未對。中位數在連續數據對應總頻數的一半。" });

      tutor.log.push({ kind: "student", text: "中位數 = " + raw });
      if (value === answer.minute) markSolved("正確。中位數是 " + answer.minute + "。累積頻數 " + answer.half + " 的水平線交到曲線後，讀到的就是這個數值。");
      else if (Number.isFinite(value) && Math.abs(value - answer.rawX) <= 1.2 && value !== answer.minute) {
        tutor.log.push({ kind: "tutor", text: "很接近。題目要最接近的整數。" });
      } else if (Number.isFinite(value) && Math.abs(value - answer.minute) === 1) {
        tutor.log.push({ kind: "tutor", text: "差一點。再看交點落在兩個組界的什麼位置。" });

  function submitSpan() {
    const model = modelOf(current());
    if (model.error || !model.rows) {
      tutor.log.push({ kind: "tutor", text: "請先填好頻數表。" });

      return;

      tutor.log.push({ kind: "tutor", text: "題目的中位數要等於表裡其中一個數值。請核對「題目的中位數」，再填第一項和最後一項。" });
      render();
      return;

    const startField = document.getElementById("spanStart");

    const endRaw = normalizeTyped(endField ? endField.value : "");

    const endOk = MedianMath.sameExpr(end, info.span.end);
    const letter = unknownLetter();
    if (startOk && endOk) advance("對。「" + current().target + "」由第 " + MedianMath.formatExpr(info.span.start, letter) + " 項到第 " + MedianMath.formatExpr(info.span.end, letter) + " 項。中間位置要落在這裡面。");

    else tutor.log.push({ kind: "tutor", text: "兩格都還未對。第一項填「前面的個數 + 1」，最後一項填「前面的個數 + 這一組的個數」。可以先看提示二。" });

    const misses = tutor.trials.filter((trial) => !trial.hit).length;
    let note = "你還沒有試過 x。仍可以繼續，用中間位置落在這一組的條件來想。";
    if (hits && misses) note = "你已經見過符合和不符合的 x，可以用它們夾出最小和最大。";
    else if (tutor.trials.length) note = "你還沒有同時見過「符合」和「不符合」。可以再試，也可以先去寫範圍。";

  function checkFinalAnswer() {
    const model = modelOf(current());
    const letter = unknownLetter();
    if (model.error || !model.rows) {
      tutor.log.push({ kind: "tutor", text: "請先填好頻數表。" });
      render();
      return;
    }
    const range = MedianMath.rangeForTarget(model.rows, Number(current().target));
    if (!range || range.none) {
      tutor.log.push({ kind: "tutor", text: "按現在這張表，沒有正整數 " + letter + " 能使中位數等於題目。" });
      render();
      return;
    }
    const minInput = document.getElementById("ansMin");
    if (!minInput) return;
    const minRaw = normalizeTyped(minInput.value);
    const min = Number(minRaw);
    const maxInput = document.getElementById("ansMax");
    const maxRaw = maxInput ? normalizeTyped(maxInput.value) : "";
    const max = maxInput ? Number(maxRaw) : null;
    tutor.log.push({ kind: "student", text: range.unbounded ? "最小 " + letter + " = " + minRaw + "，沒有最大" : "最小 " + letter + " = " + minRaw + "，最大 " + letter + " = " + maxRaw });
    if (!Number.isInteger(min) || min <= 0 || (!range.unbounded && (!Number.isInteger(max) || max <= 0))) {
      tutor.log.push({ kind: "tutor", text: "請填正整數。" });
      render();
      return;
    }
    const minOk = min === range.min;
    const maxOk = range.unbounded ? true : max === range.max;
    if (minOk && maxOk) {
      casesRevealed = true;
      showBlocks = true;
      const gap = !range.unbounded && range.intervals.length > 1 ? "\n不過中間並非每一個整數都可以。" : "";
      markSolved(successText(model, range) + gap);
    } else {
      const notes = [];
      if (!minOk && min < range.min) notes.push("你填的最小值偏小，這個 " + letter + " 的中位數還不是題目所給的數。");
      if (!minOk && min > range.min) notes.push("你填的最小值偏大，還有更小的正整數也可以。");
      if (!range.unbounded && !maxOk && max > range.max) notes.push("你填的最大值偏大，這個 " + letter + " 的中位數已經不是題目所給的數。");
      if (!range.unbounded && !maxOk && max < range.max) notes.push("你填的最大值偏小，還有更大的正整數也可以。");
      if (minOk) notes.unshift("最小值這一側是對的。");
      if (maxOk && !range.unbounded) notes.unshift("最大值這一側是對的。");
      tutor.log.push({ kind: "tutor", text: notes.join("\n") + "\n還未完成。可以按提示。我不會直接說出答案。" });
    }
    render();
  }

  function successText(model, range) {
    const target = Number(current().target);
    const letter = unknownLetter();
    const minStory = boundaryStory(model.rows, range.min, target, letter);
    if (range.unbounded) return "正確。" + letter + " 的最小可取值是 " + range.min + "，沒有最大可取值。\n" + minStory;
    const maxStory = boundaryStory(model.rows, range.max, target, letter);
    return "正確。" + letter + " 的最小可取值是 " + range.min + "，最大可取值是 " + range.max + "。\n" + minStory + "\n" + maxStory + "\n再出去一個，中間那一項就會離開「" + target + "」。";
  }

  function boundaryStory(rows, x, target, letter) {
    const view = MedianMath.medianForX(rows, x);
    const span = MedianMath.groupSpan(rows, target);
    const start = span.start.c + span.start.k * x;
    const end = span.end.c + span.end.k * x;
    const places = view.positions.map((position) => {
      if (position === start) return "第 " + position + " 項剛好是「" + target + "」的第一個";
      if (position === end) return "第 " + position + " 項剛好是「" + target + "」的最後一個";
      return "第 " + position + " 項是 " + target;
    });
    return letter + " = " + x + " 時，N = " + view.N + "，" + places.join("，") + "。";
  }

  function balanceMode() {
    return null;
  }

  function updateBalance() {
    const slot = document.getElementById("balanceSlot");
    const mode = balanceMode();
    paintTable(mode);
    if (tutor.phase !== "shown") {
      clearTimeout(walkTimer);
      document.querySelectorAll("#pictureCard .walk-layer").forEach((node) => node.remove());

  function threePiles(balance, target, splitMedian) {
    const row = document.createElement("div");
    row.className = "balance-row";
    const midChips = splitMedian
      ? [{ label: "1", note: "中位數，不計" }, { label: "其餘", note: "先不要寫出減 1 後的數" }]
      : [{ label: MedianMath.formatExpr(balance.midFreq), note: "先不要減 1" }];
    row.append(
      makePile("比 " + target + " 小", rowChips(balance.leftRows), "left"),
      makePile("等於 " + target, midChips, "mid"),
      makePile("比 " + target + " 大", rowChips(balance.rightRows), "right")
    );
    return row;
  }

  function equationRow(leftTitle, leftChips, rightTitle, rightChips) {
    const wrap = document.createElement("div");
    const row = document.createElement("div");
    row.className = "balance-row";
    const sign = document.createElement("div");
    sign.className = "eq-sign";
    sign.textContent = "=";
    const slot = document.createElement("div");
    slot.className = "median-slot";
    slot.textContent = "1 個中位數兩邊都不算";
    row.append(makePile(leftTitle, leftChips, "left"), sign, makePile(rightTitle, rightChips, "right"));
    wrap.append(row, slot);
    return wrap;
  }

  function makePile(title, chips, kind) {
    const pile = document.createElement("div");
    pile.className = "pile pile-" + kind;
    const heading = document.createElement("div");
    heading.className = "pile-title";
    heading.textContent = title;
    pile.appendChild(heading);
    chips.forEach((chip) => pile.appendChild(makeChip(chip.label, chip.note)));
    return pile;
  }

  function makeChip(label, note) {
    const chip = document.createElement("span");
    chip.className = "chip";
    const strong = document.createElement("b");
    strong.textContent = label;
    chip.appendChild(strong);
    if (note) {
      const small = document.createElement("small");
      small.textContent = note;
      chip.appendChild(small);
    }
    return chip;
  }

  function rowChips(rows) {
    const name = current().header || "數值";
    return rows.map((row) => ({ label: MedianMath.formatExpr(row.freq), note: name + " " + row.val }));
  }

  function spareChip(balance) {
    return { label: MedianMath.formatExpr(balance.spare), note: MedianMath.formatExpr(balance.midFreq) + "−1" };
  }

  function paintTable(mode) {
    document.querySelectorAll("#pictureCard td").forEach((cell) => {
      cell.classList.remove("hl-left", "hl-mid", "hl-right", "hl-join-left", "hl-join-right", "hl-join-both", "hl-ask", "hl-walk-left", "hl-walk-right", "hl-walk-mid", "hl-walk-now");
    });
    if (current().kind === "continuous") return;
    const target = Number(current().target);
    const vals = document.querySelectorAll(".input-val");
    const freqs = document.querySelectorAll(".input-freq");
    if (mode && Number.isFinite(target)) {
      vals.forEach((input, index) => {
        const value = Number(input.value);
        if (!Number.isFinite(value) || !freqs[index]) return;
        const cls = value < target ? "hl-left" : value > target ? "hl-right" : "hl-mid";
        input.parentElement.classList.add(cls);
        freqs[index].parentElement.classList.add(cls);
        if (cls !== "hl-mid") return;
        const join = mode === "min" ? "hl-join-left" : mode === "max" ? "hl-join-right" : mode === "both" ? "hl-join-both" : "";
        if (!join) return;
        input.parentElement.classList.add(join);
        freqs[index].parentElement.classList.add(join);
      });
    }
  }

  function renderUnknownControls(form, actions) {
    const model = modelOf(current());
    const target = Number(current().target);
    const span = !model.error && model.rows ? MedianMath.groupSpan(model.rows, target) : null;
    if (!span || !span.found) {
      const note = document.createElement("p");
      note.className = "problem-text";
      note.textContent = "請先確認中位數是表裡的其中一個數值。";
      form.appendChild(note);
      return;
    }
    const letter = unknownLetter();
    const row = document.createElement("div");
    row.className = "form-row";
    if (tutor.step === 1) row.append(fieldLabel("N =", "exprN"));
    else {
      const range = answerRange();
      if (range && range.unbounded) row.append(fieldLabel("最小 " + letter + " =", "ansMin"), text(" 沒有最大可取值"));
      else row.append(fieldLabel("最小 " + letter + " =", "ansMin"), fieldLabel("最大 " + letter + " =", "ansMax"));
    }
    form.appendChild(row);
    actions.appendChild(makeButton("確定", "btn", submitStep));
  }

  function classifyRows() {
    const balance = currentBalance();
    if (!balance || !balance.found) return [];
    return balance.leftRows.concat([balance.mid], balance.rightRows);
  }

  function answerClassify(choice) {
    const target = Number(current().target);
    const row = classifyRows()[tutor.cursor];
    if (!row || !Number.isFinite(target)) return;
    const expected = row.val < target ? "left" : row.val > target ? "right" : "mid";
    const label = choice === "left" ? "比 " + formatMedian(target) + " 小" : choice === "right" ? "比 " + formatMedian(target) + " 大" : "等於 " + formatMedian(target);
    tutor.log.push({ kind: "student", text: (current().header || "數值") + " " + row.val + "：" + label });
    if (choice === expected) {
      tutor.cursor += 1;
      if (tutor.cursor >= classifyRows().length) advance("對。三堆分好了。");
      else tutor.log.push({ kind: "tutor", text: "對。再看下一格。" });
    } else {
      tutor.log.push({ kind: "tutor", text: "再看這個數值比 " + formatMedian(target) + " 大還是小。" });
    }
    render();
  }

  function chooseSpare(minus) {
    const balance = currentBalance();
    if (!balance || !balance.found) return;
    const midText = MedianMath.formatExpr(balance.midFreq);
    if (!minus) {
      tutor.log.push({ kind: "student", text: midText + " 個全部算進去" });
      tutor.log.push({ kind: "tutor", text: "正中那一個不歸任何一邊。先減去這 1 個。" });
    } else {
      tutor.log.push({ kind: "student", text: "減去這 1 個" });
      tutor.phase = "confirm";
      tutor.log.push({ kind: "tutor", text: questionText() });
    }
    render();
  }

  function chooseRemainder(isSpare) {
    const balance = currentBalance();
    if (!balance || !balance.found) return;
    const spareText = MedianMath.formatExpr(balance.spare);
    const midText = MedianMath.formatExpr(balance.midFreq);
    tutor.log.push({ kind: "student", text: "剩下 " + (isSpare ? spareText : midText) });
    if (!isSpare) tutor.log.push({ kind: "tutor", text: "這是還沒減去中位數之前的個數。正中那一個不歸任何一邊。" });
    else advance("對。剩下 " + spareText + " 個，才可以跟左邊或右邊一起數。");
    render();
  }

  function equationChips(balance, kind) {
    const name = current().header || "數值";
    const chips = balance.leftRows.map((row, index) => ({
      id: "L" + index,
      label: MedianMath.formatExpr(row.freq),
      note: name + " " + row.val,
      home: "left",
      val: row.val,
      spare: false
    }));
    chips.push({
      id: "S",
      label: MedianMath.formatExpr(balance.spare),
      note: MedianMath.formatExpr(balance.midFreq) + "−1",
      home: kind === "min" ? "left" : "right",
      val: balance.mid.val,
      spare: true
    });
    balance.rightRows.forEach((row, index) => {
      chips.push({
        id: "R" + index,
        label: MedianMath.formatExpr(row.freq),
        note: name + " " + row.val,
        home: "right",
        val: row.val,
        spare: false
      });
    });
    return chips;
  }

  function writtenEquation(kind) {
    const balance = currentBalance();
    if (!balance || !balance.found) return "";
    const leftText = pileText(balance.leftRows);
    const rightText = pileText(balance.rightRows);
    const spareText = MedianMath.formatExpr(balance.spare);
    if (kind === "min") return sideText([leftText, spareText]) + " = " + sideText([rightText]);
    return sideText([leftText]) + " = " + sideText([spareText, rightText]);
  }

  function chipBuilder() {
    const balance = currentBalance();
    const wrap = document.createElement("div");
    wrap.className = "chip-builder";
    if (!balance || !balance.found) {
      wrap.textContent = "請先確認中位數是表裡的其中一個數值。";
      return wrap;
    }
    const kind = tutor.step === 3 ? "min" : "max";
    const chips = equationChips(balance, kind);
    const row = document.createElement("div");
    row.className = "chip-row";
    chips.forEach((chip) => {
      const button = document.createElement("button");
      button.type = "button";
      const side = tutor.placed[chip.id];
      const placed = side === "left" || side === "right" ? side : "pool";
      button.className = "btn chip-btn" + (tutor.selectedChip === chip.id ? " selected" : "");
      button.dataset.side = placed;
      button.setAttribute("aria-label", chip.label + " " + chip.note);
      const strong = document.createElement("b");
      strong.textContent = chip.label;
      const note = document.createElement("small");
      note.textContent = placed === "left" ? "左" : placed === "right" ? "右" : "未放";
      button.append(strong, note);
      if (tutor.phase === "shown") button.disabled = true;
      else button.addEventListener("click", () => {
        tutor.selectedChip = tutor.selectedChip === chip.id ? "" : chip.id;
        render();
      });
      row.appendChild(button);
    });
    wrap.appendChild(row);
    if (tutor.phase === "shown") {
      const eq = document.createElement("div");
      eq.className = "built-eq";
      eq.textContent = writtenEquation(kind);
      wrap.appendChild(eq);
    }
    return wrap;
  }

  function makeBasket(title, className) {
    const box = document.createElement("div");
    box.className = "basket " + className;
    const heading = document.createElement("div");
    heading.className = "pile-title";
    heading.textContent = title;
    box.appendChild(heading);
    return box;
  }

  function placeChip(side) {
    if (!tutor.selectedChip) {
      tutor.log.push({ kind: "tutor", text: "先按一塊積木。" });
      render();
      return;
    }
    tutor.placed[tutor.selectedChip] = side;
    tutor.selectedChip = "";
    render();
  }

  function checkChips() {
    const balance = currentBalance();
    if (!balance || !balance.found) {
      tutor.log.push({ kind: "tutor", text: "請先確認中位數是表裡的其中一個數值。" });
      render();
      return;
    }
    const kind = tutor.step === 3 ? "min" : "max";
    const chips = equationChips(balance, kind);
    if (chips.some((chip) => tutor.placed[chip.id] !== "left" && tutor.placed[chip.id] !== "right")) {
      tutor.log.push({ kind: "tutor", text: "還有積木未放。" });
      render();
      return;
    }
    const leftLabels = chips.filter((chip) => tutor.placed[chip.id] === "left").map((chip) => chip.label);
    const rightLabels = chips.filter((chip) => tutor.placed[chip.id] === "right").map((chip) => chip.label);
    tutor.log.push({ kind: "student", text: "左邊 " + (leftLabels.join(" + ") || "0") + " = 右邊 " + (rightLabels.join(" + ") || "0") });
    const spareWrong = chips.some((chip) => chip.spare && tutor.placed[chip.id] !== chip.home);
    const othersWrong = chips.some((chip) => !chip.spare && tutor.placed[chip.id] !== chip.home);
    if (!spareWrong && !othersWrong) {
      tutor.phase = "shown";
      tutor.walk = kind;
      tutor.walkPlayed = false;
      tutor.log.push({ kind: "tutor", text: "對。你砌成 " + writtenEquation(kind) + "。" });
    } else if (spareWrong) {
      tutor.log.push({ kind: "tutor", text: kind === "min" ? "最小時剩下的要放在左邊。" : "最大時剩下的要放在右邊。" });
    } else {
      tutor.log.push({ kind: "tutor", text: "有積木放錯邊。比中位數小的留在左邊，比中位數大的留在右邊。" });
    }
    render();
  }

  function nextAfterWalk() {
    if (tutor.step === 3) {
      advance("再看最大的情況。剩下的個數這次放到右邊。");
      render();
      return;
    }
    tutor.phase = "solve";
    tutor.walk = null;
    tutor.entry = "";
    tutor.minLocked = false;
    tutor.log.push({ kind: "tutor", text: questionText() });
    render();
  }

  function entryCaption() {
    if (tutor.mode === "unknown") {
      if (tutor.step === 1) {
        const view = trialView();
        return view && view.odd ? "第幾項" : tutor.held == null ? "第幾項" : "及第幾項";
      }
      return "最小 " + unknownLetter();
    }
    if (tutor.mode === "known") {
      const view = knownView();
      if (tutor.step === 1) return "N";
      if (tutor.step === 2) return view && view.odd ? "第幾項" : tutor.held == null ? "第幾項" : "及第幾項";
      if (tutor.step === 3) return view && view.odd ? "中間那一項的數值" : tutor.held == null ? "這一項的數值" : "另一項的數值";
      return "中位數";
    }
    if (tutor.step === 1) return "總頻數";
    if (tutor.step === 2) return "累積頻數";
    return "中位數";
  }

  function allowDecimal() {
    if (tutor.mode === "known" && (tutor.step === 3 || tutor.step === 4)) return true;
    return tutor.mode === "continuous" && tutor.step === 2;
  }

  function answerBox(onOk) {
    const row = document.createElement("div");
    row.className = "form-row answer-box";
    const input = document.createElement("input");
    input.id = "stepAnswer";
    input.type = "text";
    input.inputMode = allowDecimal() ? "decimal" : "numeric";
    input.autocomplete = "off";
    input.placeholder = entryCaption();
    input.value = tutor.entry;
    const commit = () => { tutor.entry = input.value.trim(); };
    input.addEventListener("input", commit);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        commit();
        onOk();
      }
    });
    const label = document.createElement("label");
    label.append(document.createTextNode(entryCaption() + " = "), input);
    row.appendChild(label);
    if (tutor.held != null) {
      row.appendChild(makeButton("重按上一個", "btn btn-secondary", () => {
        if (tutor.step === itemStep()) clearLastLight();
        tutor.held = null;
        tutor.entry = "";
        tutor.log.push({ kind: "tutor", text: tutor.step === 3 ? "回到這一項的數值。再填一次。" : "回到第幾項。再填一次。" });
        render();
      }));
    }
    row.appendChild(makeButton("確定", "btn", () => {
      commit();
      onOk();
    }));
    return row;
  }

  function confirmDigits() {
    if (!tutor.entry) {
      tutor.log.push({ kind: "tutor", text: "先填數字。" });
      render();
      return;
    }
    if (tutor.mode === "known") submitKnown();
    else if (tutor.mode === "unknown" && tutor.step === 1) submitTrialItem();
    else if (tutor.mode === "continuous") submitContinuous();
  }

  function confirmSolve() {
    const model = modelOf(current());
    const range = MedianMath.rangeForTarget(model.rows, Number(current().target));
    if (!range || range.none) {
      tutor.log.push({ kind: "tutor", text: "按現在這張表，沒有正整數 x 能使中位數等於題目。" });
      render();
      return;
    }
    const raw = normalizeTyped(tutor.entry);
    const value = Number(raw);
    if (!raw || !Number.isInteger(value) || value <= 0) {
      tutor.log.push({ kind: "tutor", text: "請填正整數。" });
      render();
      return;
    }
    if (!tutor.minLocked) {
      tutor.log.push({ kind: "student", text: "最小 " + value });
      if (value === range.min && range.unbounded) markSolved(successText(model, range));
      else if (value === range.min) {
        tutor.minLocked = true;
        tutor.guessMin = value;
        tutor.entry = "";
        tutor.log.push({ kind: "tutor", text: "最小這一側是對的。再按最大的 x。" });
      } else if (value < range.min) {
        tutor.log.push({ kind: "tutor", text: "你填的最小值偏小，這個 x 的中位數還不是題目所給的數。可以按提示。我不會直接說出答案。" });
      } else {
        tutor.log.push({ kind: "tutor", text: "你填的最小值偏大，還有更小的正整數也可以。可以按提示。我不會直接說出答案。" });
      }
    } else {
      tutor.log.push({ kind: "student", text: "最大 " + value });
      if (value === range.max) {
        const gap = range.intervals.length > 1 ? "\n不過中間並非每一個整數都可以。" : "";
        markSolved(successText(model, range) + gap);
      } else if (value > range.max) {
        tutor.log.push({ kind: "tutor", text: "你填的最大值偏大，這個 x 的中位數已經不是題目所給的數。可以按提示。我不會直接說出答案。" });
      } else {
        tutor.log.push({ kind: "tutor", text: "你填的最大值偏小，還有更大的正整數也可以。可以按提示。我不會直接說出答案。" });
      }
    }
    render();
  }

  function playWalk(kind) {
    if ((kind !== "min" && kind !== "max") || tutor.stale || phase !== "steps") return;
    const stage = document.querySelector("#pictureCard .table-stage");
    if (!stage) return;
    const anchor = document.getElementById("questionLine") || stage;
    const anchorTop = anchor.getBoundingClientRect().top + window.scrollY;
    const room = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    if (anchorTop > room) document.body.style.paddingBottom = (anchorTop - room + 8) + "px";
    anchor.scrollIntoView({ block: "start", inline: "nearest", behavior: "auto" });
    const token = ++walkSerial;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        if (token === walkSerial) paintWalk(kind);
      });
    });
  }

  function paintWalk(kind) {
    const balance = currentBalance();
    if (!balance || !balance.found) return;
    clearTimeout(walkTimer);
    document.querySelectorAll("#pictureCard td").forEach((cell) => {
      cell.classList.remove("hl-walk-left", "hl-walk-right", "hl-walk-mid", "hl-walk-now");
    });
    document.querySelectorAll("#pictureCard .walk-layer").forEach((node) => node.remove());
    const target = Number(current().target);
    const valInputs = [...document.querySelectorAll("#pictureCard .input-val")];
    const freqInputs = [...document.querySelectorAll("#pictureCard .input-freq")];
    const midIndex = valInputs.findIndex((input) => Number(input.value) === target);
    if (midIndex < 0) return;
    const left = [];
    const right = [];
    valInputs.forEach((input, index) => {
      const value = Number(input.value);
      if (!Number.isFinite(value)) return;
      if (index < midIndex) left.push(index);
      else if (index > midIndex) right.push(index);
    });
    right.reverse();
    const steps = Math.max(left.length, right.length);
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const mark = (index, side, now) => {
      [valInputs[index], freqInputs[index]].forEach((input) => {
        if (!input) return;
        const cell = input.parentElement;
        cell.classList.add(side === "mid" ? "hl-walk-mid" : side === "left" ? "hl-walk-left" : "hl-walk-right");
        if (now) cell.classList.add("hl-walk-now");
      });
    };
    const clearLamps = () => {
      document.querySelectorAll("#pictureCard td").forEach((cell) => {
        cell.classList.remove("hl-walk-left", "hl-walk-right", "hl-walk-mid", "hl-walk-now");
      });
    };
    if (reduce) {
      clearLamps();
      mark(midIndex, "mid", true);
      return;
    }
    const token = walkSerial;
    let step = 0;
    const tick = () => {
      if (token !== walkSerial) return;
      clearLamps();
      if (step < steps) {
        if (left[step] != null) mark(left[step], "left", true);
        if (right[step] != null) mark(right[step], "right", true);
        step += 1;
        walkTimer = setTimeout(tick, 700);
        return;
      }
      mark(midIndex, "mid", true);
    };
    tick();
  }

  async function askAi() {
    if (asking || tutor.solved || !aiOpen()) return;
    const input = document.getElementById("askInput");
    const message = normalizeTyped(input.value).slice(0, 200);
    if (!message) return;
    input.value = "";
    fieldDrafts.askInput = "";
    tutor.log.push({ kind: "student", text: message });
    asking = true;
    render();
    const result = await callGemini(message);
    asking = false;
    if (result.quota) {
      remember429(result.body);
      tutor.log.push({ kind: "tutor", text: "先看提示，完成這一小步。" });
    } else if (result.auth) {
      authFailed = true;
      tutor.log.push({ kind: "tutor", text: "先看提示，完成這一小步。" });
    } else if (result.text) {
      tutor.log.push({ kind: "tutor", text: result.text });
    } else {
      tutor.log.push({ kind: "tutor", text: "先看這一小步的數據，再試一次。" });
    }
    render();
  }

  async function callGemini(message) {
    const system = [
      "你是香港中三數學助教。",
      "同學正在做這一題：" + current().title + "。",
      "這一步的問題是：" + questionText(),
      "概念範圍：" + conceptText(),
      "只用繁體中文，句子短，適合中三。",
      "只談這一步。不要預告後面的步驟，不要給整題答案。",
      "不要說出這一步的最終數字、第幾項或完整算式。",
      "如果同學問答案或把猜想的數字寫出來，不要判斷對錯，請他按畫面上的按鈕自己核對。",
      "不要提及網頁、按鈕、額度、模型或 API。",
      "只輸出給同學看的一段話。"
    ].join("\n");
    const base = {
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role: "user", parts: [{ text: message }] }],
      generationConfig: { maxOutputTokens: 280 }
    };
    let response = await requestGemini(geminiKey(), {
      systemInstruction: base.systemInstruction,
      contents: base.contents,
      generationConfig: { maxOutputTokens: 280, thinkingConfig: { thinkingLevel: "minimal" } }
    });
    if (response.status === 400) response = await requestGemini(geminiKey(), base);
    if (response.status === 429) return { quota: true, body: response.body };
    if (response.status === 401 || response.status === 403) return { auth: true };
    if (!response.ok) return { text: "" };
    const parts = response.body && response.body.candidates && response.body.candidates[0] && response.body.candidates[0].content
      ? response.body.candidates[0].content.parts || []
      : [];
    const text = parts.filter((part) => !part.thought).map((part) => part.text || "").join("").trim();
    return { text };
  }

  async function requestGemini(key, body) {
    try {
      const response = await fetch(GEMINI_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      return { ok: response.ok, status: response.status, body: data };
    } catch (error) {
      return { ok: false, status: 0, body: {} };
    }
  }

  async function checkQuota() {
    const button = document.getElementById("checkQuota");
    if (button) button.disabled = true;
    teacherNote = "";
    if (!geminiKey()) {
      renderTeacher();
      return;
    }
    const response = await requestGemini(geminiKey(), {
      contents: [{ role: "user", parts: [{ text: "只回覆：好" }] }],
      generationConfig: { maxOutputTokens: 8 }
    });
    if (response.status === 429) {
      remember429(response.body);
      teacherNote = "";
    } else if (response.status === 401 || response.status === 403) {
      authFailed = true;
      teacherNote = "檢查時得到 " + response.status + "。";
    } else if (!response.ok) {
      teacherNote = "這次檢查沒有成功（" + response.status + "）。沒有改用其他模型。";
    } else {
      authFailed = false;
      storageRemove("medianGeminiDay");
      storageRemove("medianGeminiMinuteUntil");
      teacherNote = "剛剛檢查成功，免費問答可用。";
    }
    if (button) button.disabled = false;
    render();
  }

  setInterval(() => {
    const open = aiOpen();
    if (open !== askWasOpen) render();
    else if (teacherView) renderTeacher();
  }, 5000);

  loadLesson(0);
</script>
</body>
