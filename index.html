<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中位數</title>
  <script src="median.js"></script>
  <script>
    window.MEDIAN_TEACHER = window.MEDIAN_TEACHER || { geminiKey: "" };
  </script>
  <script src="teacher-config.js"></script>
  <style>
    :root {
      --pos-color: #2563eb;
      --pos-bg: #dbeafe;
      --val-color: #dc2626;
      --val-bg: #fee2e2;
      --median-color: #16a34a;
      --median-bg: #dcfce7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.25rem;
      color: #0f172a;
      margin: 0 0 4px;
    }

    .progress { margin: 0 0 16px; color: #475569; font-weight: bold; }

    .teacher-bar {
      background: #fff7ed;
      border: 1px solid #fdba74;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .teacher-bar p { margin: 8px 0; line-height: 1.5; }

    .card {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      margin-bottom: 10px;
    }

    .card-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .problem-text { line-height: 1.6; margin: 8px 0 12px; }
    .problem-img { max-width: 100%; height: auto; border: 1px solid #cbd5e1; border-radius: 8px; background: white; display: block; margin: 8px 0 12px; }

    .sheet p { margin: 8px 0; font-size: 1.05rem; }

    .table-wrapper {
      overflow-x: auto;
      background: white;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      padding: 4px;
    }

    table.horizontal-table { border-collapse: collapse; width: auto; min-width: 100%; white-space: nowrap; }
    .table-stage { position: relative; display: inline-block; min-width: 100%; }
    table.horizontal-table th, table.horizontal-table td {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      text-align: center;
    }
    table.horizontal-table th.row-header {
      background-color: #f8fafc;
      font-weight: bold;
      color: #334155;
      min-width: 72px;
      max-width: 7em;
      white-space: normal;
      line-height: 1.25;
    }
    .static-cell { font-weight: bold; min-width: 48px; }
    table.horizontal-table input {
      width: 64px;
      text-align: center;
      padding: 6px;
      font-size: 1rem;
      font-weight: bold;
      border: 1px solid #94a3b8;
      border-radius: 6px;
    }
    .remove-col {
      color: #dc2626;
      cursor: pointer;
      border: none;
      background: none;
      font-weight: bold;
      font-size: 1rem;
    }

    .curve-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .curve-wrap svg { width: 100%; height: auto; min-width: 640px; display: block; touch-action: none; cursor: ns-resize; }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-hint { background: #d97706; }
    .btn-hint:hover { background: #b45309; }
    .btn-hint.level-2 { background: #ea580c; }
    .btn-hint.level-2:hover { background: #c2410c; }
    .btn-hint.level-3 { background: #9a3412; }
    .btn-hint.level-3:hover { background: #7c2d12; }

    .legend { display: flex; gap: 16px; margin: 0 0 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: bold; }
    .badge { padding: 2px 8px; border-radius: 4px; }
    .badge-pos { background: var(--pos-bg); color: var(--pos-color); border: 1px solid var(--pos-color); }
    .badge-val { background: var(--val-bg); color: var(--val-color); border: 1px solid var(--val-color); }
    .badge-med { background: var(--median-bg); color: var(--median-color); border: 1px solid var(--median-color); }

    .blocks-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      background: white;
      border-radius: 8px;
      min-height: 80px;
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid #cbd5e1;
    }
    .block {
      display: flex;
      flex-direction: column;
      width: auto;
      min-width: 52px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid #cbd5e1;
      text-align: center;
    }
    .block-pos {
      background: var(--pos-bg);
      color: var(--pos-color);
      font-size: 0.68rem;
      font-weight: bold;
      padding: 2px 3px;
      white-space: nowrap;
    }
    .block-val {
      background: var(--val-bg);
      color: var(--val-color);
      font-size: 1.1rem;
      font-weight: bold;
      padding: 6px 0;
    }
    .block.highlight { border-color: var(--median-color); box-shadow: 0 0 10px rgba(22, 163, 74, 0.4); }
    .block.highlight .block-pos { background: var(--median-color); color: white; }
    .block-gap { align-self: center; font-size: 1.4rem; font-weight: bold; color: #64748b; padding: 0 4px; }
    .raw-scroll { overflow-x: auto; padding-bottom: 4px; }
    .raw-plain { font-size: 1.05rem; font-weight: 700; line-height: 1.7; margin: 4px 0 8px; }
    .raw-case { margin: 12px 0 16px; }
    .raw-case-title { font-weight: 800; color: #1d4ed8; margin-bottom: 6px; }
    .raw-track { display: flex; align-items: flex-end; gap: 10px; width: max-content; min-width: 100%; }
    .raw-col { display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 28rem; }
    .raw-above { min-height: 2.5em; color: #2563eb; font-weight: 800; text-align: center; line-height: 1.15; }
    .raw-num { font-size: 1.02rem; font-weight: 700; color: #0f172a; line-height: 1.45; text-align: center; }
    .raw-num.median-num { color: #1d4ed8; }
    .raw-under { min-height: 2.4em; border-top: 2px solid #334155; text-align: center; font-size: 0.92rem; padding-top: 3px; width: 100%; }
    .list-and-trial { display: inline-flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
    .item-scroll { overflow-x: auto; background: white; border: 1px solid #cbd5e1; border-radius: 8px; }
    .item-track { display: flex; align-items: flex-end; width: max-content; padding: 8px 6px 4px; }
    .item-cell { display: flex; flex-direction: column; align-items: center; min-width: 1.7rem; padding: 0 1px; }
    .item-pos { font-size: 0.58rem; line-height: 1; color: #2563eb; font-weight: 700; white-space: nowrap; }
    .item-val { font-size: 0.95rem; font-weight: 800; color: #b91c1c; line-height: 1.25; min-width: 1.15rem; text-align: center; border-radius: 4px; padding: 1px 2px; }
    .item-cell.lit-a .item-val { background: #fde68a; box-shadow: inset 0 0 0 2px #d97706; }
    .item-cell.lit-b .item-val { background: #bbf7d0; box-shadow: inset 0 0 0 2px #15803d; }
    .item-arrow { color: #15803d; font-size: 0.72rem; line-height: 1; font-weight: 800; }
    .item-cut { width: 0; align-self: stretch; border-left: 3px solid #7c3aed; margin: 0 4px; position: relative; }
    .item-gap { align-self: center; color: #64748b; font-weight: 800; padding: 0 4px; }

    .result-box {
      margin-top: 16px;
      background: var(--median-bg);
      border: 2px solid var(--median-color);
      border-radius: 12px;
      padding: 16px 20px;
      color: #065f46;
    }
    .result-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 8px; color: #047857; }
    .formula-step { font-size: 1.05rem; margin: 8px 0; line-height: 1.6; }

    .action-row, .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .form-row input[type="text"], .form-row input[type="number"],
    .action-row input[type="text"], .action-row input[type="number"] {
      width: 140px;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #94a3b8;
      border-radius: 6px;
    }
    #askInput { width: min(100%, 280px); }

    [hidden] { display: none !important; }

    .question-line {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 0 8px;
      padding: 6px 2px;
      background: #f1f5f9;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.45;
    }
    .cut-demo { margin: 0 0 10px; padding: 8px 8px 10px; background: #fff7ed; border: 1px solid #fdba74; border-radius: 10px; }
    .cut-kicker { margin: 0 0 8px; color: #9a3412; font-weight: 800; }
    .cut-board {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      padding-top: 1.15em;
      transition: gap 0.65s ease;
    }
    .cut-board.is-open { gap: 12px; }
    .cut-side, .cut-mid { display: flex; gap: 6px; }
    .cut-chip {
      min-width: 2.7rem;
      padding: 4px 4px 3px;
      border: 2px solid #334155;
      border-radius: 8px;
      background: white;
      text-align: center;
    }
    .cut-chip strong { display: block; font-size: 1.15rem; line-height: 1.2; }
    .cut-chip span { display: block; margin-top: 2px; color: #475569; font-size: 0.72rem; font-weight: 700; }
    .cut-mid .cut-chip { border-color: #2563eb; background: #eff6ff; }
    .cut-mid .cut-chip span { color: #1d4ed8; }
    .cut-knife { position: relative; width: 3px; }
    .cut-knife::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 2px;
      background: #dc2626;
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.4s ease 0.12s;
    }
    .cut-knife::after {
      content: "斬";
      position: absolute;
      top: -1.15em;
      left: 50%;
      color: #dc2626;
      font-size: 0.75rem;
      font-weight: 800;
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 0.25s ease 0.35s;
    }
    .cut-board.is-open .cut-knife::before { transform: scaleY(1); }
    .cut-board.is-open .cut-knife::after { opacity: 1; }
    .cut-caption { margin: 8px 0 0; line-height: 1.55; }
    .chat-log:empty { display: none; }
    .past-log { background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 10px; }
    .past-log summary { font-weight: bold; cursor: pointer; }
    .chat-log {
      background: white;
      border: none;
      padding: 8px 0 0;
      min-height: 0;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bubble { max-width: min(92%, 640px); padding: 10px 12px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; }
    .bubble-tutor { background: #f0fdf4; border: 1px solid #86efac; }
    .bubble-student { background: #dbeafe; border: 1px solid #93c5fd; align-self: flex-end; }
    .bubble-hint { background: #fffbeb; border: 1px solid #fcd34d; }
    .bubble-label { display: block; font-size: 0.75rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
    .trial-list { margin: 0; padding-left: 1.2rem; }
    .trial-readout { font-weight: 800; font-size: 1.2rem; min-width: 4.8rem; text-align: center; }
    .trial-stepper { display: inline-flex; align-items: center; gap: 6px; }
    .step-btn { min-width: 52px; min-height: 48px; font-size: 1.45rem; line-height: 1; padding: 8px 14px; }
    #toolCard { margin-bottom: 18px; }

    #pictureCard td.hl-left { background: #dbeafe; }
    #pictureCard td.hl-mid { background: #dcfce7; }
    #pictureCard td.hl-right { background: #ffedd5; }
    #pictureCard td.hl-join-left { box-shadow: inset 0 0 0 3px #2563eb; }
    #pictureCard td.hl-join-right { box-shadow: inset 0 0 0 3px #ea580c; }
    #pictureCard td.hl-join-both { box-shadow: inset 0 0 0 3px #2563eb, inset 0 0 0 6px #ea580c; }
    .balance-layout { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .balance-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
    .pile {
      flex: 1 1 160px;
      min-height: 84px;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
    }
    .pile-left { background: #dbeafe; border: 2px solid #2563eb; }
    .pile-mid { background: #dcfce7; border: 2px solid #16a34a; }
    .pile-right { background: #ffedd5; border: 2px solid #ea580c; }
    .pile-title { flex: 1 0 100%; font-size: 0.8rem; font-weight: bold; color: #334155; }
    .chip {
      background: white;
      border-radius: 8px;
      padding: 4px 8px;
      font-weight: bold;
      min-width: 42px;
      text-align: center;
      line-height: 1.2;
    }
    .chip small { display: block; font-weight: normal; color: #64748b; font-size: 0.72rem; }
    .median-slot {
      margin-top: 6px;
      background: #fef9c3;
      border: 2px solid #ca8a04;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      padding: 8px 6px;
    }
    .eq-sign { align-self: center; font-size: 1.8rem; font-weight: 800; color: #0f172a; }
    .form-row input.wide { width: min(100%, 280px); }

    #pictureCard td.hl-ask { outline: 3px solid #0f172a; outline-offset: -3px; }
    .more-box { margin-top: 10px; background: white; border-radius: 8px; padding: 8px 10px; }
    .more-box summary { font-weight: bold; cursor: pointer; }
    #tutorActions.tutor-dock {
      position: sticky;
      bottom: 0;
      z-index: 6;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -6px 16px rgba(15, 23, 42, 0.08);
    }
    .dock-btn { flex: 1 1 30%; min-height: 52px; font-size: 1.05rem; }
    .digit-wrap { flex: 1 1 100%; }
    .digit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .digit-grid .btn { min-height: 48px; background: #e2e8f0; color: #0f172a; }
    .entry-display { font-size: 1.35rem; font-weight: 800; text-align: center; padding: 6px 0 8px; }
    .chip-builder, .answer-box { flex: 1 1 100%; min-width: 100%; }
    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 4px;
    }
    .chip-btn {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 58px;
      border: 2px solid transparent;
      min-height: 52px;
      background: white;
      color: #0f172a;
      line-height: 1.15;
    }
    .chip-btn:hover { background: #f8fafc; }
    .chip-btn small { display: block; font-weight: 600; color: #64748b; font-size: 0.72rem; }
    .chip-btn.selected { outline: 3px solid #0f172a; }
    .chip-btn[data-side="left"] { border-color: #2563eb; }
    .chip-btn[data-side="right"] { border-color: #ea580c; }
    .chip-btn[data-side="pool"] { border-color: #cbd5e1; }
    .chip-btn:disabled { background: white; color: #0f172a; cursor: default; }
    #tutorLog:empty { display: none; }
    .btn-hint { min-height: 48px; }
    .built-eq { font-size: 1.2rem; font-weight: 800; text-align: center; margin: 8px 0; }
    .baskets { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
    .basket { flex: 1 1 90px; min-height: 88px; border-radius: 10px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
    .basket-pool { flex: 1 1 100%; background: #f8fafc; border: 2px dashed #94a3b8; }
    #pictureCard td.hl-walk-left { background: #93c5fd; box-shadow: inset 0 0 0 3px #1d4ed8; }
    #pictureCard td.hl-walk-right { background: #fdba74; box-shadow: inset 0 0 0 3px #c2410c; }
    #pictureCard td.hl-walk-mid { background: #86efac; box-shadow: inset 0 0 0 3px #15803d; }
    #pictureCard td.hl-walk-now { outline: 3px solid #0f172a; outline-offset: -3px; animation: walk-glow 0.7s ease; }
    @keyframes walk-glow { from { filter: brightness(1.45); } to { filter: brightness(1); } }
    .walk-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
    .walk-chip {
      position: absolute;
      width: 36px;
      box-sizing: border-box;
      padding: 3px 2px;
      border-radius: 8px;
      background: white;
      border: 2px solid #334155;
      font-weight: 800;
      text-align: center;
      line-height: 1.1;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .walk-chip small { display: block; font-weight: 600; color: #64748b; }
    .walk-chip.walk-gold { background: #fef9c3; border-color: #ca8a04; }
    .digit-grid .btn.digit-ok { background: #2563eb; color: white; }
    .dock-btn, .digit-grid .btn, .chip-btn { touch-action: manipulation; }
    @media (prefers-reduced-motion: reduce) {
      .walk-chip { transition: none !important; }
      #pictureCard td.hl-walk-now { animation: none; }
      .cut-board, .cut-knife::before, .cut-knife::after { transition: none !important; }
    }

    @media (max-width: 640px) {
      body { padding: 8px; }
      .container { padding: 10px; }
      h1 { font-size: 1.25rem; }
      .progress { margin-bottom: 8px; }
      .card { padding: 8px; margin-bottom: 6px; }
      .more-box { margin-top: 6px; padding: 4px 8px; }
      .action-row, .form-row { margin-top: 6px; }
      .question-line { margin-bottom: 6px; padding: 4px 2px; font-size: 1.08rem; }
      #tutorActions.tutor-dock { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
      .chat-log { max-height: 180px; min-height: 0; }
      table.horizontal-table th.row-header { min-width: 52px; padding: 6px 4px; }
      table.horizontal-table th, table.horizontal-table td { padding: 4px; }
      table.horizontal-table input { width: 42px; padding: 4px 2px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <div id="teacherBar" class="teacher-bar" hidden></div>
  <h1>中位數</h1>
  <p id="progress" class="progress"></p>
  <div class="card" id="pictureCard"></div>
  <div class="card" id="queueCard" hidden>
    <div class="card-title">由小至大排列的原始數據</div>
    <div id="blocksWrapper"></div>
    <div class="result-box" id="resultBox" hidden>
      <div class="result-title">中位數</div>
      <div id="resultContent"></div>
    </div>
  </div>
  <div class="card" id="tutorCard">
    <div id="tutorLog"></div>
    <div id="tutorForm"></div>
    <div class="form-row" id="tutorActions"></div>
  </div>
  <div class="card" id="checkCard" hidden>
    <div id="checkSlot"></div>
  </div>
  <div class="card" id="toolCard">
    <div id="toolSlot"></div>
  </div>
</div>
<script>
  const GEMINI_MODEL = "gemini-3.5-flash-lite";
  const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent";
  const teacherView = new URLSearchParams(location.search).get("teacher") === "1";

  const lessons = [
    {
      id: "discrete",
      kind: "discrete",
      title: "離散數據",
      header: "觀看的電影數目",
      stem: "（參考書 P10.23 例 10.12）下表所示為某班學生在暑假期間所觀看的電影數目。",
      rows: [
        { val: 0, freq: "4" },
        { val: 1, freq: "6" },
        { val: 2, freq: "9" },
        { val: 3, freq: "12" },
        { val: 4, freq: "5" }
      ],
      structure: 0
    },
    {
      id: "commute",
      kind: "continuous",
      title: "連續數據",
      chartTitle: "一組人於今早由家前往工作地點所需的交通時間",
      axisLabel: "交通時間（分鐘）",
      stem: "以下是一組人於今早由家前往工作地點所需交通時間的累積頻數曲線。可改組界、頻數或累積頻數。拖動紅線對位，再求中位數。",
      structure: 0,
      bounds: ["24.5", "29.5", "34.5", "39.5", "44.5", "49.5"],
      freqs: ["", "15", "45", "90", "100", "50"],
      cums: ["0", "15", "60", "150", "250", "300"]
    }
  ];
  const lessonTemplates = JSON.parse(JSON.stringify(lessons));

  let lessonIndex = 0;
  let phase = "type";
  let tutor = freshTutor();
  let fieldDrafts = {};
  let experiment = null;
  let showBlocks = false;
  let discreteRevealed = false;
  let casesRevealed = false;
  let asking = false;
  let authFailed = false;
  let teacherNote = "";
  let askWasOpen = false;

  function freshTutor() {
    return {
      mode: "type", step: 1, log: [], hints: {}, trials: [], trap: false, solved: false,
      stale: false, blocked: false, phase: "ask", cursor: 0, placed: {}, selectedChip: "",
      entry: "", held: null, minLocked: false, guessMin: null, walk: null, walkPlayed: false,
      lit: [], arrow: false, litTrial: null
    };

  function current() {
    return lessons[lessonIndex];
  }

  function geminiKey() {
    return String((window.MEDIAN_TEACHER && window.MEDIAN_TEACHER.geminiKey) || "").trim();
  }

  function pacificDateKey(date) {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Los_Angeles",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(date);
  }

  function storageGet(key) {
    try { return localStorage.getItem(key); } catch (error) { return null; }
  }

  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (error) { /* private mode */ }
  }

  function storageRemove(key) {
    try { localStorage.removeItem(key); } catch (error) { /* private mode */ }
  }

  function dailyLocked() {
    return storageGet("medianGeminiDay") === pacificDateKey(new Date());
  }

  function minuteLocked() {
    return Number(storageGet("medianGeminiMinuteUntil") || 0) > Date.now();
  }

  function aiOpen() {
    return !!geminiKey() && !authFailed && !dailyLocked() && !minuteLocked();
  }

  function remember429(body) {
    if (MedianMath.classifyQuota(body) === "minute") {
      storageSet("medianGeminiMinuteUntil", String(Date.now() + 60000));
    } else {
      storageSet("medianGeminiDay", pacificDateKey(new Date()));
    }
  }

  function modelOf(lesson) {
    return MedianMath.normalizeRows(lesson.rows.map((row) => ({
      val: String(row.val),
      freq: String(row.freq)
    })));
  }

  function knownView() {
    const model = modelOf(current());
    if (model.error || model.hasX) return null;
    return MedianMath.medianForX(model.rows, 1);
  }

  function parseCell(raw) {
    const text = normalizeTyped(raw).toLowerCase().replace(/\s+/g, "");
    if (!text) return null;
    if (text === "x" || text === "s") return { c: 0, k: 1 };
    const parsed = MedianMath.parseExpr(text);
    if (parsed) return parsed;
    const neg = text.match(/^-(\d+)$/);
    if (neg) return { c: -Number(neg[1]), k: 0 };
    return null;
  }

  function addExpr(a, b) {
    return { c: a.c + b.c, k: a.k + b.k };
  }

  function subExpr(a, b) {
    return { c: a.c - b.c, k: a.k - b.k };
  }

  function lessonHasX() {
    const lesson = current();
    const cells = lesson.kind === "continuous"
      ? lesson.cums.concat(lesson.freqs)
      : lesson.rows.map((row) => row.freq);
    return cells.some((cell) => {
      const expr = parseCell(cell);
      return expr && expr.k !== 0;
    });
  }

  function unknownLetter() {
    const lesson = current();
    if (!lesson || lesson.kind === "continuous") return "x";
    const found = new Set();
    lesson.rows.forEach((row) => {
      const letters = String(row.freq).toLowerCase().match(/[a-z]/g) || [];
      letters.forEach((letter) => found.add(letter));
    });
    if (found.size !== 1) return "x";
    return [...found][0];
  }

  function trialNumber() {
    const raw = document.getElementById("trialX");
    if (raw && String(raw.value).trim() !== "") return Number(raw.value);
    return experiment && Number.isInteger(experiment.x) ? experiment.x : NaN;
  }

  function currentTrial() {
    if (experiment && Number.isInteger(experiment.x) && experiment.x > 0) return experiment.x;
    return 1;
  }

  function continuousState(trialX) {
    const lesson = current();
    const bounds = lesson.bounds.map((value) => Number(value));
    const exprs = lesson.cums.map(parseCell);
    if (lesson.cums.concat(lesson.freqs).some((cell) => {
      const expr = parseCell(cell);
      return expr && expr.k !== 0;
    })) return { error: "no-x" };
    const freqExprs = lesson.freqs.slice(1).map(parseCell);
    if (bounds.some((value) => !Number.isFinite(value)) || exprs.some((expr) => !expr) || freqExprs.some((expr) => !expr)) return { error: "invalid" };
    const positive = freqExprs.filter((expr) => expr.k > 0).length;
    const negative = freqExprs.filter((expr) => expr.k < 0).length;
    if (positive > 1 || negative > 1) return { error: "multi-x" };
    const hasX = positive + negative > 0;
    if (hasX && (!Number.isInteger(trialX) || trialX <= 0)) return { error: "need-x", hasX: true };
    const x = hasX ? trialX : 0;
    const points = bounds.map((bound, index) => ({ x: bound, y: exprs[index].c + exprs[index].k * x }));
    for (let i = 1; i < points.length; i += 1) {
      if (!(points[i].x > points[i - 1].x) || points[i].y < points[i - 1].y - 1e-9) return { error: "order", hasX };
    }
    return { points, hasX, totalExpr: exprs[exprs.length - 1] };
  }

  function travelAnswer() {
    if (current().kind !== "continuous") return null;
    const state = continuousState(trialNumber());
    if (!state.points) return null;
    return MedianMath.curveMedian(state.points);
  }

  function recomputeCumsFromFreqs(lesson) {
    if (!parseCell(lesson.cums[0])) lesson.cums[0] = "0";
    for (let i = 1; i < lesson.freqs.length; i += 1) {
      const freq = parseCell(lesson.freqs[i]);
      const prev = parseCell(lesson.cums[i - 1]);
      if (!freq || !prev) continue;
      lesson.cums[i] = MedianMath.formatExpr(addExpr(prev, freq));
    }
  }

  function recomputeFreqsFromCums(lesson) {
    lesson.freqs[0] = "";
    for (let i = 1; i < lesson.cums.length; i += 1) {
      const cur = parseCell(lesson.cums[i]);
      const prev = parseCell(lesson.cums[i - 1]);
      if (!cur || !prev) continue;
      lesson.freqs[i] = MedianMath.formatExpr(subExpr(cur, prev));
    }
  }

  function writeInputValues(selector, values) {
    document.querySelectorAll(selector).forEach((input, index) => {
      if (document.activeElement === input) return;
      if (values[index] != null) input.value = values[index];
    });
  }

  function normalizeTyped(raw) {
    return String(raw ?? "").replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).trim();
  }

  function formatMedian(n) {
    if (Number.isInteger(n)) return String(n);
    return String(Math.round(n * 1000) / 1000);
  }

    lessons[index] = JSON.parse(JSON.stringify(lessonTemplates[index]));

    lesson.image = "";

    document.querySelectorAll("input[id]").forEach((input) => {
      fieldDrafts[input.id] = input.value;

  function showMode(index) {
    if (index === lessonIndex) return;
    lessonIndex = index;
    const card = document.getElementById("pictureCard");

    const checkSlot = document.getElementById("checkSlot");
    if (checkSlot) checkSlot.dataset.mode = "";
    startWork();

  function startWork() {
    const lesson = current();
    const hasX = lessonHasX();
    phase = "steps";
    tutor = freshTutor();
    fieldDrafts = {};
    experiment = null;
    showBlocks = false;
    discreteRevealed = false;
    casesRevealed = false;
    asking = false;
    if (hasX && lesson.kind !== "continuous") {
      const model = modelOf(lesson);
      const target = Number(lesson.target);
      if (!Number.isFinite(target) || model.error || !model.rows || !MedianMath.groupSpan(model.rows, target).found) {
        tutor.blocked = true;
        tutor.mode = "unknown";
        tutor.log.push({
          kind: "tutor",
          text: model.error === "multi-x"
            ? "只可以有一個未知數。請改好再按繼續。"
            : "表裡有未知數。請先填「題目的中位數」，並確認它是表裡的其中一個數值，再按繼續。"
        });
        render();
        return;
      }
    }
    tutor.mode = lesson.kind === "continuous" ? "continuous" : hasX ? "unknown" : "known";
    tutor.step = 1;
    askQuestion();
    render();
  }

  function cellInput(className, value, label) {
    const input = document.createElement("input");
    input.type = "text";
    input.className = className;
    input.value = value == null ? "" : String(value);
    input.setAttribute("aria-label", label);
    input.autocomplete = "off";
    input.addEventListener("input", onTableInput);
    return input;
  }

  function buildEditableTable(lesson) {
    const wrap = document.createElement("div");
    wrap.className = "table-wrapper";
    const stage = document.createElement("div");
    stage.className = "table-stage";
    const table = document.createElement("table");
    table.className = "horizontal-table";
    const body = document.createElement("tbody");
    if (lesson.kind === "continuous") {
      body.append(
        inputRow("組界", lesson.bounds, "input-bound", "組界"),
        inputRow("頻數", lesson.freqs, "input-cfreq", "頻數", true),
        inputRow("累積頻數", lesson.cums, "input-cum", "累積頻數"),
        removeRow(lesson.bounds.length)
      );
    } else {
      body.append(
        inputRow(lesson.header, lesson.rows.map((row) => row.val), "input-val", "數值"),
        inputRow(lesson.freqHeader || "頻數", lesson.rows.map((row) => row.freq), "input-freq", "頻數"),
        removeRow(lesson.rows.length)
      );
    }
    table.appendChild(body);
    stage.appendChild(table);
    wrap.appendChild(stage);
    return wrap;
  }

  function inputRow(header, values, className, label, blankFirst) {
    const row = document.createElement("tr");
    const head = document.createElement("th");
    head.className = "row-header";
    head.textContent = header;
    row.appendChild(head);
    values.forEach((value, index) => {
      const cell = document.createElement("td");
      if (blankFirst && index === 0) {
        cell.textContent = "—";
      } else {
        cell.appendChild(cellInput(className, value, label));
      }
      row.appendChild(cell);
    });
    return row;
  }

  function removeRow(count) {
    const row = document.createElement("tr");
    const head = document.createElement("th");
    head.className = "row-header";
    head.textContent = "";
    head.setAttribute("aria-label", "刪去這一欄");
    row.appendChild(head);
    for (let index = 0; index < count; index += 1) {
      const cell = document.createElement("td");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "remove-col";
      button.textContent = "✕";
      button.setAttribute("aria-label", "刪去這一欄");
      button.addEventListener("click", () => removeColumn(index));
      cell.appendChild(button);
      row.appendChild(cell);
    }
    return row;
  }

    slot.dataset.mode = wanted;

      targetInput.id = "targetMedian";
      targetInput.type = "text";
      targetInput.inputMode = "decimal";
      targetInput.value = current().target == null ? "" : String(current().target);
      targetInput.addEventListener("input", () => {
        current().target = targetInput.value.trim();

  function trialControls() {
    const letter = unknownLetter();
    const x = currentTrial();
    const row = document.createElement("div");
    row.className = "trial-stepper";
    const minus = makeButton("−", "btn btn-secondary step-btn", () => adjustTrial(-1));
    minus.id = "trialMinus";
    minus.disabled = x <= 1;
    minus.setAttribute("aria-label", "減少 " + letter);
    const plus = makeButton("+", "btn btn-secondary step-btn", () => adjustTrial(1));
    plus.setAttribute("aria-label", "增加 " + letter);
    const readout = document.createElement("span");
    readout.id = "trialReadout";
    readout.className = "trial-readout";
    readout.textContent = letter + " = " + x;
    row.append(minus, readout, plus);
    return row;
  }

  function trialStatusText() {
    const letter = unknownLetter();
    const x = currentTrial();
    const model = modelOf(current());
    if (model.error || !model.rows) return "先填好頻數表，再用 − 和 + 改變 " + letter + "。";
    const view = MedianMath.medianForX(model.rows, x);
    if (!view) return "這個 " + letter + " 還不能算出中位數。";
    const target = Number(current().target);
    let text = letter + " = " + x + " 時，中位數是 " + formatMedian(view.median) + "。";
    if (Number.isFinite(target)) text += MedianMath.sameNumber(view.median, target) ? "這個中位數和題目一樣。" : "這個中位數和題目不同。";
    return text;
  }

  function adjustTrial(delta) {
    const x = Math.max(1, currentTrial() + delta);
    const lesson = current();
    const model = modelOf(lesson);
    const view = model.error ? null : MedianMath.medianForX(model.rows, x);
    const median = view ? view.median : null;
    const target = Number(lesson.target);
    const hit = median != null && Number.isFinite(target) && MedianMath.sameNumber(median, target);
    experiment = { x, view, hit, median };
    if (median != null) {
      const previous = tutor.trials[tutor.trials.length - 1];
      if (!previous || previous.x !== x || previous.median !== median) tutor.trials.push({ x, median, hit });
    }
    showBlocks = true;
    tutor.lit = [];
    tutor.arrow = false;
    tutor.litTrial = null;
    if (tutor.mode === "unknown" && tutor.step === 1 && !tutor.solved) {
      tutor.held = null;
      tutor.entry = "";
    }
    render();
  }

  function toggleBlocks() {
    showBlocks = !showBlocks;
    const button = document.getElementById("toggleBlocks");
    if (button) button.textContent = showBlocks ? "收起原始數據" : "列出原始數據";
    renderQueue();
  }

  function medianBox(id, placeholder, inputMode, onOk) {
    const input = document.createElement("input");
    input.id = id;
    input.type = "text";
    input.placeholder = placeholder;
    input.inputMode = inputMode;
    input.autocomplete = "off";
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        onOk();
      }
    });
    return input;
  }

    const row = document.createElement("div");
    row.className = "action-row";
    const input = medianBox("checkDiscreteMedian", "如 6.5", "decimal", checkDiscreteMedian);
    const label = document.createElement("label");
    label.append(document.createTextNode("中位數 = "), input);
    row.append(label, makeButton("對答案", "btn", checkDiscreteMedian));
    const note = document.createElement("p");
    note.id = "discreteMedianNote";
    note.className = "problem-text";
    note.textContent = "可以先填。對了才會標出中位數。";

  function checkDiscreteMedian() {
    const note = document.getElementById("discreteMedianNote");
    const field = document.getElementById("checkDiscreteMedian");
    if (!note || !field) return;
    const view = knownView();
    if (!view) {
      note.textContent = "請先填好數值和頻數。";
      return;
    }
    const typed = normalizeTyped(field.value);
    const value = Number(typed);
    if (!typed || !Number.isFinite(value)) {
      note.textContent = "請填中位數。雙數可能要寫小數。";
      return;
    }
    if (MedianMath.sameNumber(value, view.median)) {
      discreteRevealed = true;
      showBlocks = true;
      const button = document.getElementById("toggleBlocks");
      if (button) button.textContent = "收起原始數據";
      note.textContent = "對。中位數是 " + formatMedian(view.median) + "。";
      renderQueue();
      return;
    }
    if (!view.odd && view.values.some((item) => MedianMath.sameNumber(value, item))) {
      note.textContent = "這是中間其中一個數值。雙數要把兩個數值平均。";
      return;
    }
    note.textContent = "還未對。先判斷總數是單數還是雙數，再找中間是第幾項。";
  }

  function medianChecker() {
    const wrap = document.createElement("div");
    const row = document.createElement("div");
    row.className = "action-row";
    const input = medianBox("checkMinute", "整數", "numeric", checkMedian);
    const label = document.createElement("label");
    label.append(document.createTextNode("中位數 = "), input);
    row.append(label, makeButton("核對中位數", "btn", checkMedian));
    const note = document.createElement("p");
    note.id = "medianNote";
    note.className = "problem-text";
    note.textContent = "拖紅線讀出最接近的數值後，可以直接核對，不用先看提示。";
    wrap.append(row, note);
    return wrap;
  }

  function checkMedian() {
    const note = document.getElementById("medianNote");
    const field = document.getElementById("checkMinute");
    if (!note || !field) return;
    const answer = travelAnswer();
    if (!answer) {
      note.textContent = "先把組界和累積頻數填好。";
      return;
    }
    const typed = normalizeTyped(field.value);
    const value = Number(typed);
    if (!typed || !Number.isFinite(value)) {
      note.textContent = "請填最接近的整數。";
      return;
    }
    if (value === answer.minute) {
      note.textContent = "對。中位數是 " + answer.minute + "。";
      return;
    }
    if (Math.abs(value - answer.minute) === 1 || Math.abs(value - answer.rawX) <= 1.2) {
      note.textContent = "差一點。把紅線拖到總頻數的一半，再讀最接近的整數。";
      return;
    }
    note.textContent = "還未對。中位數對應總頻數的 50%。拖紅線到那個高度，再讀橫軸。";
  }

  function rangeChecker() {
    const wrap = document.createElement("div");
    const row = document.createElement("div");
    row.className = "action-row";
    const minInput = document.createElement("input");

  function answerRange() {
    const lesson = current();
    const target = Number(lesson.target);
    if (!Number.isFinite(target)) return { error: "need-target" };
    if (lesson.kind !== "continuous") {
      const model = modelOf(lesson);
      if (model.error) return { error: model.error };
      return MedianMath.rangeForTarget(model.rows, target);
    }
    const hits = [];
    for (let x = 1; x <= 400; x += 1) {
      const state = continuousState(x);
      if (!state.points) continue;
      const answer = MedianMath.curveMedian(state.points);
      if (answer && answer.minute === target) hits.push(x);
    }
    if (!hits.length) return { none: true };
    const last = hits[hits.length - 1];
    const unbounded = last === 400 && [401, 420, 500].every((x) => {
      const state = continuousState(x);
      if (!state.points) return false;
      const answer = MedianMath.curveMedian(state.points);
      return answer && answer.minute === target;
    });
    return { min: hits[0], max: unbounded ? null : last, unbounded, none: false, intervals: [] };
  }

  function checkRange() {
    const note = document.getElementById("rangeNote");
    if (!note) return;
    const range = answerRange();
    if (range.error === "need-target") {
      note.textContent = "先填題目的中位數。";
      return;
    }
    if (range.error === "multi-x") {
      note.textContent = "只可以有一個未知數。";
      return;
    }
    if (range.error || range.none) {
      note.textContent = "按現在這張表，沒有正整數 x 能使中位數等於題目。";
      return;
    }
    const min = Number(normalizeTyped(document.getElementById("rangeMin").value));
    const max = Number(normalizeTyped(document.getElementById("rangeMax").value));
    if (!Number.isInteger(min) || min <= 0 || (!range.unbounded && (!Number.isInteger(max) || max <= 0))) {
      note.textContent = "最小和最大都要填正整數。";
      return;
    }
    const minOk = min === range.min;
    const maxOk = range.unbounded ? true : max === range.max;
    if (minOk && maxOk) {
      casesRevealed = true;
      showBlocks = true;
      const button = document.getElementById("toggleBlocks");
      if (button) button.textContent = "收起原始數據";
      note.textContent = range.unbounded
        ? "對。最小是 " + range.min + "，沒有最大可取值。"
        : "對。最小是 " + range.min + "，最大是 " + range.max + "。";
      renderQueue();
      return;
    }
    const notes = [];
    if (!minOk && min < range.min) notes.push("最小值偏小。");
    if (!minOk && min > range.min) notes.push("最小值偏大，還有更小的正整數也可以。");
    if (!range.unbounded && !maxOk && max > range.max) notes.push("最大值偏大。");
    if (!range.unbounded && !maxOk && max < range.max) notes.push("最大值偏小，還有更大的正整數也可以。");
    if (minOk) notes.unshift("最小值對了。");
    if (maxOk && !range.unbounded) notes.unshift("最大值對了。");
    note.textContent = notes.join("");
  }

  function renderCurveSlot() {

        "no-x": "連續數據請填數字，不用 x。",
        order: "組界要由左到右變大，累積頻數不可以變小。",
        invalid: "組界要是數字。累積頻數也要是數字。"
