  function equationChips(balance, kind) {
    const name = current().header || "數值";
    const chips = balance.leftRows.map((row, index) => ({
      id: "L" + index,
      label: MedianMath.formatExpr(row.freq),
      note: name + " " + row.val,
      home: "left",
      val: row.val,
      spare: false
    }));
    chips.push({
      id: "S",
      label: MedianMath.formatExpr(balance.spare),
      note: MedianMath.formatExpr(balance.midFreq) + "−1",
      home: kind === "min" ? "left" : "right",
      val: balance.mid.val,
      spare: true
    });
    balance.rightRows.forEach((row, index) => {
      chips.push({
        id: "R" + index,
        label: MedianMath.formatExpr(row.freq),
        note: name + " " + row.val,
        home: "right",
        val: row.val,
        spare: false
      });
    });
    return chips;
  }

  function writtenEquation(kind) {
    const balance = currentBalance();
    if (!balance || !balance.found) return "";
    const leftText = pileText(balance.leftRows);
    const rightText = pileText(balance.rightRows);
    const spareText = MedianMath.formatExpr(balance.spare);
    if (kind === "min") return sideText([leftText, spareText]) + " = " + sideText([rightText]);
    return sideText([leftText]) + " = " + sideText([spareText, rightText]);
  }

  function chipBuilder() {
    const balance = currentBalance();
    const wrap = document.createElement("div");
    wrap.className = "chip-builder";
    if (!balance || !balance.found) {
      wrap.textContent = "請先確認中位數是表裡的其中一個數值。";
      return wrap;

    const kind = tutor.step === 3 ? "min" : "max";

    row.className = "chip-row";
    chips.forEach((chip) => {
      const button = document.createElement("button");
      button.type = "button";
      const side = tutor.placed[chip.id];
      const placed = side === "left" || side === "right" ? side : "pool";
      button.className = "btn chip-btn" + (tutor.selectedChip === chip.id ? " selected" : "");
      button.dataset.side = placed;
      button.setAttribute("aria-label", chip.label + " " + chip.note);

      note.textContent = placed === "left" ? "左" : placed === "right" ? "右" : "未放";
      button.append(strong, note);
      if (tutor.phase === "shown") button.disabled = true;
      else button.addEventListener("click", () => {
        tutor.selectedChip = tutor.selectedChip === chip.id ? "" : chip.id;
        render();

      row.appendChild(button);
    });
    wrap.appendChild(row);

  function placeChip(side) {

      tutor.log.push({ kind: "tutor", text: "先按一塊積木。" });

  function checkChips() {
    const balance = currentBalance();
    if (!balance || !balance.found) {
      tutor.log.push({ kind: "tutor", text: "請先確認中位數是表裡的其中一個數值。" });
      render();
      return;
    }
    const kind = tutor.step === 3 ? "min" : "max";
    const chips = equationChips(balance, kind);
    if (chips.some((chip) => tutor.placed[chip.id] !== "left" && tutor.placed[chip.id] !== "right")) {
      tutor.log.push({ kind: "tutor", text: "還有積木未放。" });
      render();
      return;
    }
    const leftLabels = chips.filter((chip) => tutor.placed[chip.id] === "left").map((chip) => chip.label);
    const rightLabels = chips.filter((chip) => tutor.placed[chip.id] === "right").map((chip) => chip.label);
    tutor.log.push({ kind: "student", text: "左邊 " + (leftLabels.join(" + ") || "0") + " = 右邊 " + (rightLabels.join(" + ") || "0") });
    const spareWrong = chips.some((chip) => chip.spare && tutor.placed[chip.id] !== chip.home);
    const othersWrong = chips.some((chip) => !chip.spare && tutor.placed[chip.id] !== chip.home);
    if (!spareWrong && !othersWrong) {
      tutor.phase = "shown";
      tutor.walk = kind;
      tutor.walkPlayed = false;
      tutor.log.push({ kind: "tutor", text: "對。你砌成 " + writtenEquation(kind) + "。" });
    } else if (spareWrong) {
      tutor.log.push({ kind: "tutor", text: kind === "min" ? "最小時剩下的要放在左邊。" : "最大時剩下的要放在右邊。" });
    } else {
      tutor.log.push({ kind: "tutor", text: "有積木放錯邊。比中位數小的留在左邊，比中位數大的留在右邊。" });
    }
    render();
  }

  function nextAfterWalk() {
    if (tutor.step === 3) {
      advance("再看最大的情況。剩下的個數這次放到右邊。");
      render();
      return;
    }
    tutor.phase = "solve";
    tutor.walk = null;
    tutor.entry = "";
    tutor.minLocked = false;
    tutor.log.push({ kind: "tutor", text: questionText() });
    render();
  }

  function entryCaption() {
    if (tutor.mode === "unknown") {
      if (tutor.step === 1) {
        const view = trialView();
        return view && view.odd ? "第幾項" : tutor.held == null ? "第幾項" : "及第幾項";
      }
      return "最小 " + unknownLetter();
    }
    if (tutor.mode === "known") {
      const view = knownView();
      if (tutor.step === 1) return "總數";
      if (tutor.step === 3) return "第幾項";
      return "中位數";
    }
    if (tutor.step === 1) return "總頻數";
    if (tutor.step === 2) return "累積頻數";
    return "中位數";
  }

  function allowDecimal() {
    if (tutor.mode === "known" && tutor.step === 4) return true;
    return tutor.mode === "continuous" && tutor.step === 2;
  }

  function answerBox(onOk) {

    input.id = "stepAnswer";

  function confirmDigits() {
    if (!tutor.entry) {
      tutor.log.push({ kind: "tutor", text: "先填數字。" });
      render();
      return;
    }
    if (tutor.mode === "known") submitKnown();

  function confirmSolve() {
    const model = modelOf(current());
    const range = MedianMath.rangeForTarget(model.rows, Number(current().target));
    if (!range || range.none) {
      tutor.log.push({ kind: "tutor", text: "按現在這張表，沒有正整數 x 能使中位數等於題目。" });
      render();
      return;
    }
    const raw = normalizeTyped(tutor.entry);
    const value = Number(raw);
    if (!raw || !Number.isInteger(value) || value <= 0) {
      tutor.log.push({ kind: "tutor", text: "請填正整數。" });
      render();
      return;
    }
    if (!tutor.minLocked) {
      tutor.log.push({ kind: "student", text: "最小 " + value });
      if (value === range.min && range.unbounded) markSolved(successText(model, range));
      else if (value === range.min) {
        tutor.minLocked = true;
        tutor.guessMin = value;
        tutor.entry = "";
        tutor.log.push({ kind: "tutor", text: "最小這一側是對的。再按最大的 x。" });
      } else if (value < range.min) {
        tutor.log.push({ kind: "tutor", text: "你填的最小值偏小，這個 x 的中位數還不是題目所給的數。可以按提示。我不會直接說出答案。" });
      } else {
        tutor.log.push({ kind: "tutor", text: "你填的最小值偏大，還有更小的正整數也可以。可以按提示。我不會直接說出答案。" });
      }
    } else {
      tutor.log.push({ kind: "student", text: "最大 " + value });
      if (value === range.max) {
        const gap = range.intervals.length > 1 ? "\n不過中間並非每一個整數都可以。" : "";
        markSolved(successText(model, range) + gap);
      } else if (value > range.max) {
        tutor.log.push({ kind: "tutor", text: "你填的最大值偏大，這個 x 的中位數已經不是題目所給的數。可以按提示。我不會直接說出答案。" });
      } else {
        tutor.log.push({ kind: "tutor", text: "你填的最大值偏小，還有更大的正整數也可以。可以按提示。我不會直接說出答案。" });
      }
    }
    render();
  }

  function playWalk(kind) {
    if ((kind !== "min" && kind !== "max") || tutor.stale || phase !== "steps") return;
    const stage = document.querySelector("#pictureCard .table-stage");
    if (!stage) return;
    const anchor = document.getElementById("questionLine") || stage;
    const anchorTop = anchor.getBoundingClientRect().top + window.scrollY;
    const room = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    if (anchorTop > room) document.body.style.paddingBottom = (anchorTop - room + 8) + "px";
    anchor.scrollIntoView({ block: "start", inline: "nearest", behavior: "auto" });
    const token = ++walkSerial;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        if (token === walkSerial) paintWalk(kind);
      });
    });
  }

  function paintWalk(kind) {
    const balance = currentBalance();
    if (!balance || !balance.found) return;
    clearTimeout(walkTimer);
    document.querySelectorAll("#pictureCard td").forEach((cell) => {
      cell.classList.remove("hl-walk-left", "hl-walk-right", "hl-walk-mid", "hl-walk-now");
    });
    document.querySelectorAll("#pictureCard .walk-layer").forEach((node) => node.remove());
    const target = Number(current().target);
    const valInputs = [...document.querySelectorAll("#pictureCard .input-val")];
    const freqInputs = [...document.querySelectorAll("#pictureCard .input-freq")];
    const midIndex = valInputs.findIndex((input) => Number(input.value) === target);
    if (midIndex < 0) return;
    const left = [];
    const right = [];
    valInputs.forEach((input, index) => {
      const value = Number(input.value);
      if (!Number.isFinite(value)) return;
      if (index < midIndex) left.push(index);
      else if (index > midIndex) right.push(index);
    });
    right.reverse();
    const steps = Math.max(left.length, right.length);
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const mark = (index, side, now) => {
      [valInputs[index], freqInputs[index]].forEach((input) => {
        if (!input) return;
        const cell = input.parentElement;
        cell.classList.add(side === "mid" ? "hl-walk-mid" : side === "left" ? "hl-walk-left" : "hl-walk-right");
        if (now) cell.classList.add("hl-walk-now");
      });
    };
    const clearLamps = () => {
      document.querySelectorAll("#pictureCard td").forEach((cell) => {
        cell.classList.remove("hl-walk-left", "hl-walk-right", "hl-walk-mid", "hl-walk-now");
      });
    };
    if (reduce) {
      clearLamps();
      mark(midIndex, "mid", true);
      return;
    }
    const token = walkSerial;
    let step = 0;
    const tick = () => {
      if (token !== walkSerial) return;
      clearLamps();
      if (step < steps) {
        if (left[step] != null) mark(left[step], "left", true);
        if (right[step] != null) mark(right[step], "right", true);
        step += 1;
        walkTimer = setTimeout(tick, 700);
        return;
      }
      mark(midIndex, "mid", true);
    };
    tick();
  }

  async function askAi() {
    if (asking || tutor.solved || !aiOpen()) return;
    const input = document.getElementById("askInput");
    const message = normalizeTyped(input.value).slice(0, 200);
    if (!message) return;
    input.value = "";
    fieldDrafts.askInput = "";
    tutor.log.push({ kind: "student", text: message });
    asking = true;
    render();
    const result = await callGemini(message);
    asking = false;
    if (result.quota) {
      remember429(result.body);
      tutor.log.push({ kind: "tutor", text: "先看提示，完成這一小步。" });
    } else if (result.auth) {
      authFailed = true;
      tutor.log.push({ kind: "tutor", text: "先看提示，完成這一小步。" });
    } else if (result.text) {
      tutor.log.push({ kind: "tutor", text: result.text });
    } else {
      tutor.log.push({ kind: "tutor", text: "先看這一小步的數據，再試一次。" });
    }
    render();
  }

  async function callGemini(message) {
    const system = [
      "你是香港中三數學助教。",
      "同學正在做這一題：" + current().title + "。",
      "這一步的問題是：" + questionText(),
      "概念範圍：" + conceptText(),
      "只用繁體中文，句子短，適合中三。",
      "只談這一步。不要預告後面的步驟，不要給整題答案。",
      "不要說出這一步的最終數字、第幾項或完整算式。",
      "如果同學問答案或把猜想的數字寫出來，不要判斷對錯，請他按畫面上的按鈕自己核對。",
      "不要提及網頁、按鈕、額度、模型或 API。",
      "只輸出給同學看的一段話。"
    ].join("\n");
    const base = {
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role: "user", parts: [{ text: message }] }],
      generationConfig: { maxOutputTokens: 280 }
    };
    let response = await requestGemini(geminiKey(), {
      systemInstruction: base.systemInstruction,
      contents: base.contents,
      generationConfig: { maxOutputTokens: 280, thinkingConfig: { thinkingLevel: "minimal" } }
    });
    if (response.status === 400) response = await requestGemini(geminiKey(), base);
    if (response.status === 429) return { quota: true, body: response.body };
    if (response.status === 401 || response.status === 403) return { auth: true };
    if (!response.ok) return { text: "" };
    const parts = response.body && response.body.candidates && response.body.candidates[0] && response.body.candidates[0].content
      ? response.body.candidates[0].content.parts || []
      : [];
    const text = parts.filter((part) => !part.thought).map((part) => part.text || "").join("").trim();
    return { text };
  }

  async function requestGemini(key, body) {
    try {
      const response = await fetch(GEMINI_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      return { ok: response.ok, status: response.status, body: data };
    } catch (error) {
      return { ok: false, status: 0, body: {} };
    }
  }

  async function checkQuota() {
    const button = document.getElementById("checkQuota");
    if (button) button.disabled = true;
    teacherNote = "";
    if (!geminiKey()) {
      renderTeacher();
      return;
    }
    const response = await requestGemini(geminiKey(), {
      contents: [{ role: "user", parts: [{ text: "只回覆：好" }] }],
      generationConfig: { maxOutputTokens: 8 }
    });
    if (response.status === 429) {
      remember429(response.body);
      teacherNote = "";
    } else if (response.status === 401 || response.status === 403) {
      authFailed = true;
      teacherNote = "檢查時得到 " + response.status + "。";
    } else if (!response.ok) {
      teacherNote = "這次檢查沒有成功（" + response.status + "）。沒有改用其他模型。";
    } else {
      authFailed = false;
      storageRemove("medianGeminiDay");
      storageRemove("medianGeminiMinuteUntil");
      teacherNote = "剛剛檢查成功，免費問答可用。";
    }
    if (button) button.disabled = false;
    render();
  }

  const animTrial = { closed: true, which: "lesson", token: 0, timers: [], seen: false, clip: 1, play: "step", step: 1, pensOpen: false };

  function animStop() {
    animTrial.token += 1;
    animTrial.timers.forEach((id) => clearTimeout(id));
    animTrial.timers = [];
  }

  function animLater(token, ms, fn) {
    const id = setTimeout(() => {
      if (token !== animTrial.token) return;
      fn();
    }, ms);
    animTrial.timers.push(id);
  }

  function animSetKicker(text) {
    const node = document.getElementById("animKicker");
    if (!node) return;
    node.textContent = text;
    node.classList.toggle("anim-kicker-sr", animTrial.clip === 2);
  }

  function animBeat(n) {
    animTrial.step = n;
    const card = document.getElementById("animTrial");
    if (card) card.dataset.beat = String(n);
    animSyncControls();
  }

  function animFreqRows(values) {
    const rows = [];
    values.forEach((val) => {
      const last = rows[rows.length - 1];
      if (last && last.val === val) last.count += 1;
      else rows.push({ val, count: 1 });
    });
    return rows;
  }

  function animMids(n) {
    if (n % 2 === 1) return [(n - 1) / 2];
    return [n / 2 - 1, n / 2];
  }

  function animDataset() {
    if (current().bridge) return bridgeDataset();
    if (current().id === "pens") return pensAnimDataset();
    const model = modelOf(current());
    if (model.error || model.hasX) return null;
    const values = expandRows(model.rows, 1);
    if (values.length < 1 || values.length > 60) return null;
    const rows = model.rows.map((row) => ({ val: row.val, count: row.freq.c + row.freq.k }));
    if (rows.some((row) => !Number.isInteger(row.count) || row.count <= 0)) return null;
    return { sample: "lesson", unit: "次", values, rows };
  }

  function bridgeDataset() {
    const pairs = bridgePairs();
    const rows = [];
    pairs.forEach((item) => {
      const last = rows[rows.length - 1];
      if (last && last.val === item.val && last.extra === item.extra) last.count += 1;
      else rows.push({ val: item.val, count: 1, extra: item.extra, extraClass: item.extra ? "extra" : "" });
    });
    if (!pairs.length || pairs.length > 60) return null;
    return {
      sample: "bridge",
      unit: "",
      values: pairs.map((item) => item.val),
      extras: pairs.map((item) => item.extra),
      extraClass: "extra",
      rows
    };
  }

  function pensAnimDataset() {
    const model = modelOf(current());
    if (model.error || !model.rows) return null;
    const x = currentTrial();
    const values = [];
    const extras = [];
    const rows = [];
    model.rows.forEach((row) => {
      const count = row.freq.c + row.freq.k * x;
      if (!Number.isInteger(count) || count <= 0) return;
      const extra = row.freq.k > 0;
      rows.push({ val: row.val, count, extra, extraClass: extra ? "extra-x" : "" });
      for (let index = 0; index < count; index += 1) {
        values.push(row.val);
        extras.push(extra);
      }
    });
    if (values.length < 1 || values.length > 80) return null;
    return { sample: "lesson", unit: "枝", values, extras, extraClass: "extra-x", rows };
  }

  function animKickerText(data, beat) {
    const odd = data.values.length % 2 === 1;
    if (beat === 1) {
      const who = data.sample === "bridge" ? "加上額外數據後。" : "這題。";
      return who + "1. 總數：由左至右，把頻數相加。";
    }
    if (beat === 2) return "2. 由兩端一對一對撇走。";
    if (beat === 3) {
      return odd
        ? "3. 中位數位置。箭嘴指住正中間那一項。"
        : "3. 中位數位置。線畫在正中間兩項之間。";
    }
    return odd
      ? "4. 正中間那一項的數值就是中位數。"
      : "4. 把正中間兩項的數值加起來，再除以 2。";
  }

  function animColumns(n, boardWidth) {
    const width = boardWidth > 40 ? boardWidth : 300;
    const fit = Math.max(4, Math.floor(width / 34));
    if (n <= fit) return n;
    const mid = Math.floor((n - 1) / 2);
    for (let cols = Math.min(fit, 12); cols >= 4; cols -= 1) {
      if (n % 2 === 0 && Math.floor(mid / cols) !== Math.floor((mid + 1) / cols)) continue;
      return cols;
    }
    return Math.min(fit, n);
  }

  function animBuildGrid(board, data) {
    const grid = document.createElement("div");
    grid.className = "anim-grid";
    const values = data.values;
    const cols = animColumns(values.length, board.clientWidth);
    grid.style.gridTemplateColumns = "repeat(" + cols + ", 30px)";
    values.forEach((value, index) => {
      const chip = document.createElement("div");
      chip.className = "anim-chip";
      if (data.extras && data.extras[index] && data.extraClass) chip.classList.add(data.extraClass);
      chip.textContent = String(value);
      grid.appendChild(chip);
    });
    board.appendChild(grid);
    return grid;
  }

  function animMarkMids(grid, chips, mids) {
    if (mids.length === 1) {
      const arrow = document.createElement("span");
      arrow.className = "anim-arrow";
      arrow.textContent = "▲";
      chips[mids[0]].appendChild(arrow);
    } else {
      chips[mids[0]].classList.add("cut");
    }
    const label = document.createElement("div");
    label.className = "anim-mark";
    label.textContent = mids.length === 1
      ? "第" + (mids[0] + 1) + "項"
      : "第" + (mids[0] + 1) + "項及第" + (mids[1] + 1) + "項";
    const anchor = chips[mids[0]];
    const end = chips[mids[mids.length - 1]];
    label.style.left = ((anchor.offsetLeft + end.offsetLeft + end.offsetWidth) / 2) + "px";
    label.style.top = (anchor.offsetTop - 14) + "px";
    grid.appendChild(label);
  }

  function animShowMath(board, data, instant, token) {
    const mids = animMids(data.values.length);
    const picked = mids.map((index) => data.values[index]);
    const median = picked.length === 1 ? picked[0] : (picked[0] + picked[1]) / 2;
    const math = document.createElement("div");
    math.className = "anim-math";
    const add = (className, text) => {
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;
      math.appendChild(span);
      return span;
    };
    board.appendChild(math);
    if (picked.length === 1) {
      add("n answer show", formatMedian(median));
      add("op", "中位數");
      return;
    }
    add("op", "(");
    add("n", String(picked[0]));
    const plus = add("op", "+");
    const second = add("n", String(picked[1]));
    const close = add("op", ")");
    const div = add("op", "÷ 2");
    const eq = add("op", "=");
    const answer = add("n answer", formatMedian(median));
    if (instant) {
      answer.classList.add("show");
      return;
    }
    [plus, second, close, div, eq, answer].forEach((node) => { node.hidden = true; });
    animLater(token, 450, () => {
      plus.hidden = false;
      second.hidden = false;
      close.hidden = false;
    });
    animLater(token, 1000, () => { div.hidden = false; });
    animLater(token, 1600, () => {
      eq.hidden = false;
      answer.hidden = false;
      answer.classList.add("show");
    });
  }

  function animPaintFinal(board, data) {
    board.innerHTML = "";
    const grid = animBuildGrid(board, data);
    const chips = [...grid.querySelectorAll(".anim-chip")];
    const mids = animMids(data.values.length);
    chips.forEach((chip, index) => {
      if (mids.indexOf(index) < 0) chip.classList.add("gone");
      else chip.classList.add("keep", "grow");
    });
    animMarkMids(grid, chips, mids);
    animShowMath(board, data, true);
    animSetKicker(animKickerText(data, 4));
    animBeat(4);
  }

  function animStageMedian(board, data, token) {
    animSetKicker(animKickerText(data, 4));
    animBeat(4);
    const mids = animMids(data.values.length);
    board.querySelectorAll(".anim-chip").forEach((chip, index) => {
      if (mids.indexOf(index) >= 0) chip.classList.add("grow");
    });
    animShowMath(board, data, false, token);
    animLater(token, 1800, () => animFinishAuto(token));
  }

  function animStagePlace(board, data, token, done) {
    animSetKicker(animKickerText(data, 3));
    animBeat(3);
    const grid = board.querySelector(".anim-grid");
    const chips = [...board.querySelectorAll(".anim-chip")];
    const mids = animMids(data.values.length);
    mids.forEach((index) => chips[index].classList.add("keep"));
    if (grid) animMarkMids(grid, chips, mids);
    animLater(token, 2000, done);
  }

  function animStagePairs(board, data, token, done) {
    animSetKicker(animKickerText(data, 2));
    animBeat(2);
    board.innerHTML = "";
    animLater(token, 30, () => {
      const grid = animBuildGrid(board, data);
      const chips = [...grid.querySelectorAll(".anim-chip")];
      const odd = data.values.length % 2 === 1;
      const leave = odd ? 1 : 2;
      const pairs = Math.floor((chips.length - leave) / 2);
      const stepMs = pairs <= 6 ? 340 : Math.max(90, Math.round(2100 / pairs));
      for (let i = 0; i < pairs; i += 1) {
        animLater(token, stepMs * i, () => {
          chips[i].classList.add("gone");
          chips[chips.length - 1 - i].classList.add("gone");
        });
      }
      animLater(token, stepMs * pairs + 420, () => {
        animSetKicker(odd ? "2. 剩下一項，所以是單數。" : "2. 剩下兩項，所以是雙數。");
        animMids(chips.length).forEach((index) => chips[index].classList.add("keep"));
        animLater(token, 900, done);
      });
    });
  }

  function animStageTotal(board, data, token, done) {
    animSetKicker(animKickerText(data, 1));
    animBeat(1);
    board.innerHTML = "";
    const sheet = document.createElement("div");
    sheet.className = "anim-sheet";
    sheet.style.gridTemplateColumns = "auto repeat(" + data.rows.length + ", minmax(36px, 1fr))";
    const valLabel = document.createElement("div");
    valLabel.className = "lab";
    valLabel.textContent = "數值";
    const freqLabel = document.createElement("div");
    freqLabel.className = "lab";
    freqLabel.textContent = "頻數";
    const vals = [];
    const freqs = [];
    data.rows.forEach((row) => {
      const val = document.createElement("div");
      val.className = "anim-pill val";
      if (row.extra && data.extraClass) val.classList.add(data.extraClass);
      val.textContent = String(row.val);
      const freq = document.createElement("div");
      freq.className = "anim-pill freq";
      if (row.extra && data.extraClass) freq.classList.add(data.extraClass);
      freq.textContent = String(row.count);
      vals.push(val);
      freqs.push(freq);
    });
    sheet.append(valLabel, ...vals, freqLabel, ...freqs);
    const total = document.createElement("div");
    total.className = "anim-total";
    total.append(document.createTextNode("總數 "));
    const strong = document.createElement("strong");
    strong.textContent = "0";
    total.appendChild(strong);
    board.append(sheet, total);
    const stepMs = Math.max(320, Math.min(520, Math.round(2200 / Math.max(1, freqs.length))));
    let sum = 0;
    freqs.forEach((cell, index) => {
      animLater(token, stepMs * index, () => {
        freqs.forEach((other, i) => {
          other.classList.toggle("on", i === index);
          other.classList.toggle("done", i < index);
        });
        sum += data.rows[index].count;
        strong.textContent = String(sum);
      });
    });
    animLater(token, stepMs * freqs.length + 450, () => {
      freqs.forEach((cell) => {
        cell.classList.remove("on");
        cell.classList.add("done");
      });
      done();
    });
  }

  function animMaxStep() {
    if (animTrial.clip !== 2) return 4;
    const data = animDataset();
    if (!data) return 0;
    return animHitEnd(animCumModel(data)) + 1;
  }

  function animFinishAuto(token) {
    if (token !== animTrial.token || animTrial.play !== "auto") return;
    animTrial.play = "step";
    animSyncControls();
  }

  function animFoundRow(model, pos, count) {
    const index = model.rows.findIndex((row) => pos >= row.start && pos <= row.end);
    if (index < 0 || index >= count) return null;
    return model.rows[index];
  }

  function anim2Caption(model, count) {
    if (count <= 0) return "橙色線標的是項次位置；沿位置帶由左至右累加，找到涵蓋該位置的數值。";
    if (model.positions.some((pos) => !animFoundRow(model, pos, count))) {
      const row = model.rows[count - 1];
      const next = model.rows[count];
      const follow = next ? "下一行會接續由第 " + next.start + " 項開始。" : "";
      return "累積頻數 " + row.cum + " 尚未到達中央位置。" + follow;
    }
    if (model.positions.length === 1) return "中央項次的數值就是中位數。";
    const hitRows = model.rows.filter((row, index) => index < count && row.hit.length);
    if (hitRows.length === 1) return "兩個中央位置在同一行，所以中央數值相同；仍按公式取平均數，答案不變。";
    return "兩個中央位置落在不同的數值行。讀出兩個數值，再取平均。";
  }

  function animCumModel(data) {
    const n = data.rows.reduce((sum, row) => sum + row.count, 0);
    const odd = n % 2 === 1;
    const positions = odd ? [(n + 1) / 2] : [n / 2, n / 2 + 1];
    let cum = 0;
    const rows = data.rows.map((row) => {
      const start = cum + 1;
      cum += row.count;
      const end = cum;
      const hit = positions.filter((pos) => pos >= start && pos <= end);
      return { val: row.val, count: row.count, cum, start, end, hit, extra: !!row.extra, extraClass: row.extraClass || "" };
    });
    return { n, odd, positions, rows };
  }

  function animHitEnd(model) {
    let last = 0;
    model.rows.forEach((row, index) => {
      if (row.hit.length) last = index;
    });
    return last;
  }

  function animCentralValues(model) {
    return model.positions.map((pos) => {
      const row = model.rows.find((item) => pos >= item.start && pos <= item.end);
      return row ? row.val : null;
    });
  }

  function animSegLabel(row) {
    return row.val + " " + (row.start === row.end ? String(row.start) : row.start + "-" + row.end);
  }

  function anim2Math(model) {
    const values = animCentralValues(model);
    const math = document.createElement("div");
    math.className = "anim-math";
    const add = (className, text) => {
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;
      math.appendChild(span);
    };
    if (values.length === 1) {
      add("n answer show", formatMedian(values[0]));
      add("op", "中位數");
      return math;
    }
    const median = (values[0] + values[1]) / 2;
    add("op", "(");
    add("n", String(values[0]));
    add("op", "+");
    add("n", String(values[1]));
    add("op", ")");
    add("op", "÷ 2");
    add("op", "=");
    add("n answer show", formatMedian(median));
    return math;
  }

  function anim2Chips(data, model, count) {
    const wrap = document.createElement("div");
    wrap.className = "anim-loc-chips";
    const title = document.createElement("span");
    title.className = "anim-loc-chip title";
    title.textContent = "中央位置（項次）";
    wrap.appendChild(title);
    model.positions.forEach((pos) => {
      const chip = document.createElement("span");
      chip.className = "anim-loc-chip";
      const row = animFoundRow(model, pos, count);
      if (row) {
        chip.classList.add("found");
        chip.textContent = "第 " + pos + " 項 位置 → " + row.val + (data.unit ? " " + data.unit : "") + "數值";
      } else {
        chip.textContent = "第 " + pos + " 項 位置 待定位數值";
      }
      wrap.appendChild(chip);
    });
    const total = document.createElement("span");
    total.className = "anim-loc-chip";
    total.textContent = "N = " + model.n;
    wrap.appendChild(total);
    return wrap;
  }

  function anim2Band(model, count) {
    const card = document.createElement("div");
    card.className = "anim-band-card";
    const head = document.createElement("div");
    head.className = "anim-band-head";
    const title = document.createElement("strong");
    title.textContent = "項次位置帶";
    const status = document.createElement("span");
    status.textContent = count <= 0 ? "頻數尚未累加" : "已累加至第 " + model.rows[count - 1].end + " 項";
    head.append(title, status);
    const band = document.createElement("div");
    band.className = "anim-band";
    band.setAttribute("aria-hidden", "true");
    model.rows.forEach((row, index) => {
      const seg = document.createElement("div");
      seg.className = "anim-seg";
      seg.style.flex = String(row.count) + " " + String(row.count) + " 0";
      if (index < count) {
        seg.classList.add(row.hit.length ? "hit" : "done");
        if (row.extra && row.extraClass) seg.classList.add(row.extraClass);
        const label = document.createElement("span");
        label.textContent = animSegLabel(row);
        seg.appendChild(label);
      }
      band.appendChild(seg);
    });
    model.positions.forEach((pos) => {
      const pin = document.createElement("div");
      pin.className = "anim-pin";
      pin.style.left = ((pos - 0.5) / model.n * 100) + "%";
      band.appendChild(pin);
    });
    const foot = document.createElement("div");
    foot.className = "anim-band-foot";
    const from = document.createElement("span");
    from.textContent = "較小數值 · 從第 1 項開始";
    const to = document.createElement("span");
    to.textContent = "第 " + model.n + " 項";
    foot.append(from, to);
    card.append(head, band, foot);
    return card;
  }

  function anim2Paint(board, data, model, count) {
    const covered = model.positions.every((pos) => animFoundRow(model, pos, count));
    const caption = anim2Caption(model, count);
    animSetKicker(caption);
    animBeat(count);
    board.innerHTML = "";
    const note = document.createElement("p");
    note.className = "anim-loc-note";
    note.setAttribute("aria-hidden", "true");
    note.textContent = caption;
    board.append(anim2Chips(data, model, count), anim2Band(model, count));
    if (covered) board.appendChild(anim2Math(model));
    board.appendChild(note);
  }

  function anim2Run(shown, play, token, data) {
    const board = document.getElementById("animBoard");
    const model = animCumModel(data);
    const last = animHitEnd(model);
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce && play === "auto") {
      anim2Paint(board, data, model, last + 1);
      animFinishAuto(token);
      return;
    }
    const count = Math.max(0, Math.min(last + 1, shown));
    anim2Paint(board, data, model, count);
    if (play === "auto" && count <= last) animLater(token, 850, () => anim2Run(count + 1, play, token, data));
    else if (play === "auto") animFinishAuto(token);
  }

  function anim1Settled(board, data, step, token) {
    if (step <= 1) {
      animSetKicker(animKickerText(data, 1));
      animBeat(1);
      board.innerHTML = "";
      const sheet = document.createElement("div");
      sheet.className = "anim-sheet";
      sheet.style.gridTemplateColumns = "auto repeat(" + data.rows.length + ", minmax(36px, 1fr))";
      const valLabel = document.createElement("div");
      valLabel.className = "lab";
      valLabel.textContent = "數值";
      const freqLabel = document.createElement("div");
      freqLabel.className = "lab";
      freqLabel.textContent = "頻數";
      const vals = [];
      const freqs = [];
      let sum = 0;
      data.rows.forEach((row) => {
        const val = document.createElement("div");
        val.className = "anim-pill val";
        if (row.extra && data.extraClass) val.classList.add(data.extraClass);
        val.textContent = String(row.val);
        const freq = document.createElement("div");
        freq.className = "anim-pill freq done";
        if (row.extra && data.extraClass) freq.classList.add(data.extraClass);
        freq.textContent = String(row.count);
        vals.push(val);
        freqs.push(freq);
        sum += row.count;
      });
      sheet.append(valLabel, ...vals, freqLabel, ...freqs);
      const total = document.createElement("div");
      total.className = "anim-total";
      const strong = document.createElement("strong");
      strong.textContent = String(sum);
      total.append(document.createTextNode("總數 "), strong);
      board.append(sheet, total);
      return;
    }
    const odd = data.values.length % 2 === 1;
    animSetKicker(step === 2
      ? (odd ? "2. 剩下一項，所以是單數。" : "2. 剩下兩項，所以是雙數。")
      : animKickerText(data, step));
    animBeat(step);
    board.innerHTML = "";
    const grid = animBuildGrid(board, data);
    const chips = [...grid.querySelectorAll(".anim-chip")];
    const mids = animMids(data.values.length);
    chips.forEach((chip, index) => {
      if (mids.indexOf(index) < 0) chip.classList.add("gone");
      else chip.classList.add("keep");
    });
    if (step < 3) return;
    animLater(token, 30, () => {
      if (token !== animTrial.token) return;
      animMarkMids(grid, chips, mids);
      if (step < 4) return;
      mids.forEach((index) => chips[index].classList.add("grow"));
      animShowMath(board, data, true);
    });
  }

  function anim1Run(step, play, token, data) {
    const board = document.getElementById("animBoard");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (play === "auto" && step === 1 && !reduce) {
      animStageTotal(board, data, token, () => {
        animStagePairs(board, data, token, () => {
          animStagePlace(board, data, token, () => animStageMedian(board, data, token));
        });
      });
      return;
    }
    const show = reduce && play === "auto" ? 4 : step;
    anim1Settled(board, data, show, token);
    if (play === "auto" && show < 4) animLater(token, reduce ? 0 : 1600, () => anim1Run(show + 1, play, token, data));
    else if (play === "auto") animFinishAuto(token);
  }

  function animGo(step, play) {
    animStop();
    const token = animTrial.token;
    animTrial.play = play;
    const board = document.getElementById("animBoard");
    const data = animDataset();
    animSyncControls();
    if (!board) return;
    if (!data) {
      board.innerHTML = "";
      animSetKicker("請先填好頻數。頻數須為正整數。");
      animBeat(0);
      return;
    }
    const floor = animTrial.clip === 2 ? 0 : 1;
    const capped = Math.max(floor, Math.min(animMaxStep(), step));
    if (animTrial.clip === 2) anim2Run(capped, play, token, data);
    else anim1Run(capped, play, token, data);
  }

  function animSyncControls() {
    const card = document.getElementById("animTrial");
    const clip1 = document.getElementById("animClip1");
    const clip2 = document.getElementById("animClip2");
    const prev = document.getElementById("animPrev");
    const next = document.getElementById("animNext");
    const auto = document.getElementById("animAuto");
    const replay = document.getElementById("animReplay");
    const floor = animTrial.clip === 2 ? 0 : 1;
    if (card) card.dataset.clip = String(animTrial.clip);
    if (clip1) {
      clip1.className = animTrial.clip === 1 ? "btn" : "btn btn-secondary";
      clip1.textContent = animTrial.clip === 2 ? "回看動畫1" : "動畫1";
    }
    const lessonId = current().id;
    if (clip2) {
      clip2.hidden = lessonId === "pens";
      clip2.className = animTrial.clip === 2 ? "btn" : "btn btn-secondary";
    }
    const even = document.getElementById("animEven");
    if (even) even.hidden = lessonId !== "discrete";
    if (auto) {
      auto.className = animTrial.play === "auto" ? "btn" : "btn btn-secondary";
      auto.textContent = animTrial.clip === 2 ? "自動播放定位" : "自動播放";
    }
    if (next) {
      next.textContent = animTrial.clip === 2 ? "累加下一行" : "下一步";
      next.classList.toggle("anim-next-locate", animTrial.clip === 2);
    }
    if (replay) replay.hidden = animTrial.clip !== 2;
    if (prev) prev.disabled = animTrial.step <= floor;
    if (next) next.disabled = animTrial.step >= animMaxStep();
    animMarkButtons();
  }

  function animMarkButtons() {
    const even = document.getElementById("animEven");
    if (even) even.className = animTrial.which === "lesson" ? "btn" : "btn btn-secondary";
  }

  function syncAnimCard() {
    const card = document.getElementById("animTrial");
    if (!card) return;
    const id = current().id;
    const onLesson = id === "discrete" || id === "bridge" || (id === "pens" && animTrial.pensOpen);
    card.hidden = !onLesson;
    if (!onLesson) {
      animStop();
      animTrial.seen = false;
      return;
    }
    const body = document.getElementById("animBody");
    const reopen = document.getElementById("animReopen");
    if (body) body.hidden = !!animTrial.closed;
    if (reopen) reopen.hidden = !animTrial.closed;
    if (!animTrial.closed && !animTrial.seen) {
      animTrial.seen = true;
      animGo(current().id === "pens" ? 1 : (animTrial.clip === 2 ? 0 : 1), current().id === "pens" ? "auto" : "step");
    }
  }

  function bindAnimTrial() {
    const clip1 = document.getElementById("animClip1");
    const clip2 = document.getElementById("animClip2");
    const even = document.getElementById("animEven");
    const closeBtn = document.getElementById("animClose");
    const open = document.getElementById("animOpen");
    const prev = document.getElementById("animPrev");
    const next = document.getElementById("animNext");
    const auto = document.getElementById("animAuto");
    const replay = document.getElementById("animReplay");
    const openSample = (which) => {
      animTrial.which = which;
      animGo(animTrial.clip === 2 ? 0 : 1, "step");
    };
    if (clip1) clip1.addEventListener("click", () => {
      animTrial.clip = 1;
      animGo(1, "step");
    });
    if (clip2) clip2.addEventListener("click", () => {
      animTrial.clip = 2;
      animGo(0, "step");
    });
    if (even) even.addEventListener("click", () => openSample("lesson"));
    if (prev) prev.addEventListener("click", () => animGo(animTrial.step - 1, "step"));
    if (next) next.addEventListener("click", () => animGo(animTrial.step + 1, "step"));
    if (auto) auto.addEventListener("click", () => animGo(animTrial.clip === 2 ? 0 : 1, "auto"));
    if (replay) replay.addEventListener("click", () => animGo(0, "step"));
    if (closeBtn) closeBtn.addEventListener("click", () => {
      animTrial.closed = true;
      animStop();
      syncAnimCard();
    });
    if (open) open.addEventListener("click", () => {
      animTrial.closed = false;
      animTrial.seen = false;
      syncAnimCard();
    });
  }

  setInterval(() => {
    const open = aiOpen();
    if (open !== askWasOpen) render();
    else if (teacherView) renderTeacher();
  }, 5000);

  bindAnimTrial();
  loadLesson(0);
</script>
</body>
</html>
