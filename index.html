<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中位數</title>
  <script src="median.js"></script>
  <script>
    window.MEDIAN_TEACHER = window.MEDIAN_TEACHER || { geminiKey: "" };
  </script>
  <script src="teacher-config.js"></script>
  <style>
    :root {
      --pos-color: #2563eb;
      --pos-bg: #dbeafe;
      --val-color: #dc2626;
      --val-bg: #fee2e2;
      --median-color: #16a34a;
      --median-bg: #dcfce7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.5rem;
      color: #0f172a;
      margin: 0 0 6px;
    }

    .progress { margin: 0 0 16px; color: #475569; font-weight: bold; }

    .teacher-bar {
      background: #fff7ed;
      border: 1px solid #fdba74;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .teacher-bar p { margin: 8px 0; line-height: 1.5; }

    .card {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .card-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .problem-text { line-height: 1.6; margin: 8px 0 12px; }
    .problem-img { max-width: 100%; height: auto; border: 1px solid #cbd5e1; border-radius: 8px; background: white; display: block; margin: 8px 0 12px; }

    .sheet p { margin: 8px 0; font-size: 1.05rem; }

    .table-wrapper {
      overflow-x: auto;
      background: white;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      padding: 4px;
    }

    table.horizontal-table { border-collapse: collapse; width: 100%; white-space: nowrap; }
    table.horizontal-table th, table.horizontal-table td {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      text-align: center;
    }
    table.horizontal-table th.row-header {
      background-color: #f8fafc;
      font-weight: bold;
      color: #334155;
      min-width: 100px;
    }
    .static-cell { font-weight: bold; min-width: 48px; }

    .curve-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .curve-wrap svg { width: 100%; height: auto; min-width: 640px; display: block; }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-hint { background: #d97706; }
    .btn-hint:hover { background: #b45309; }
    .btn-hint.level-2 { background: #ea580c; }
    .btn-hint.level-2:hover { background: #c2410c; }
    .btn-hint.level-3 { background: #9a3412; }
    .btn-hint.level-3:hover { background: #7c2d12; }

    .legend { display: flex; gap: 16px; margin: 0 0 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: bold; }
    .badge { padding: 2px 8px; border-radius: 4px; }
    .badge-pos { background: var(--pos-bg); color: var(--pos-color); border: 1px solid var(--pos-color); }
    .badge-val { background: var(--val-bg); color: var(--val-color); border: 1px solid var(--val-color); }
    .badge-med { background: var(--median-bg); color: var(--median-color); border: 1px solid var(--median-color); }

    .blocks-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      background: white;
      border-radius: 8px;
      min-height: 80px;
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid #cbd5e1;
    }
    .block {
      display: flex;
      flex-direction: column;
      width: 48px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid #cbd5e1;
      text-align: center;
    }
    .block-pos {
      background: var(--pos-bg);
      color: var(--pos-color);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 0;
    }
    .block-val {
      background: var(--val-bg);
      color: var(--val-color);
      font-size: 1.1rem;
      font-weight: bold;
      padding: 6px 0;
    }
    .block.highlight { border-color: var(--median-color); box-shadow: 0 0 10px rgba(22, 163, 74, 0.4); }
    .block.highlight .block-pos { background: var(--median-color); color: white; }
    .block-gap { align-self: center; font-size: 1.4rem; font-weight: bold; color: #64748b; padding: 0 4px; }

    .result-box {
      margin-top: 16px;
      background: var(--median-bg);
      border: 2px solid var(--median-color);
      border-radius: 12px;
      padding: 16px 20px;
      color: #065f46;
    }
    .result-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 8px; color: #047857; }
    .formula-step { font-size: 1.05rem; margin: 8px 0; line-height: 1.6; }

    .action-row, .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .form-row input[type="text"], .form-row input[type="number"] {
      width: 120px;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #94a3b8;
      border-radius: 6px;
    }
    #askInput { width: min(100%, 280px); }
    #trialX { width: 90px; padding: 8px; font-size: 1rem; border: 1px solid #94a3b8; border-radius: 6px; }

    [hidden] { display: none !important; }

    .chat-log {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      min-height: 120px;
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bubble { max-width: min(92%, 640px); padding: 10px 12px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; }
    .bubble-tutor { background: #f0fdf4; border: 1px solid #86efac; }
    .bubble-student { background: #dbeafe; border: 1px solid #93c5fd; align-self: flex-end; }
    .bubble-hint { background: #fffbeb; border: 1px solid #fcd34d; }
    .bubble-label { display: block; font-size: 0.75rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
    .trial-list { margin: 0; padding-left: 1.2rem; }

    @media (max-width: 640px) {
      body { padding: 10px; }
      .container { padding: 14px; }
      h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <div id="teacherBar" class="teacher-bar" hidden></div>
  <h1>中位數</h1>
  <p id="progress" class="progress"></p>
  <div class="card" id="pictureCard"></div>
  <div class="card" id="queueCard" hidden>
    <div class="card-title">由小到大的隊列</div>
    <div class="legend">
      <div class="legend-item"><span class="badge badge-pos">藍</span>位置</div>
      <div class="legend-item"><span class="badge badge-val">紅</span>數值</div>
      <div class="legend-item"><span class="badge badge-med">綠</span>中位數用到的位置</div>
    </div>
    <div class="blocks-container" id="blocksWrapper"></div>
    <div class="result-box" id="resultBox" hidden>
      <div class="result-title">這一次的隊列</div>
      <div id="resultContent"></div>
    </div>
  </div>
  <div class="card" id="tutorCard">
    <div class="chat-log" id="tutorLog" role="log" aria-live="polite"></div>
    <div id="tutorForm"></div>
    <div class="form-row" id="tutorActions"></div>
  </div>
</div>
<script>
  const GEMINI_MODEL = "gemini-3.5-flash-lite";
  const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent";
  const teacherView = new URLSearchParams(location.search).get("teacher") === "1";

  const lessons = [
    {
      id: "cafe",
      kind: "discrete-known",
      title: "咖啡店的顧客人數",
      header: "顧客人數",
      stem: "下表顯示咖啡店某時段的顧客人數。",
      rows: [
        { val: 55, freq: 2 },
        { val: 56, freq: 8 },
        { val: 57, freq: 5 },
        { val: 58, freq: 4 },
        { val: 59, freq: 7 },
        { val: 60, freq: 4 }
      ]
    },
    {
      id: "days",
      kind: "discrete-unknown",
      title: "運動多於 30 分鐘的日數",
      header: "日數",
      stem: "下表顯示一組學生上學期運動多於 30 分鐘的日數。已知 x 是一個正整數。若中位數是 3，求 x 的最小和最大可取值。",
      image: "question12.png",
      target: 3,
      rows: [
        { val: 1, freq: 4 },
        { val: 2, freq: "x" },
        { val: 3, freq: 14 },
        { val: 4, freq: 7 },
        { val: 5, freq: 14 }
      ]
    },
    {
      id: "travel",
      kind: "continuous",
      title: "回校交通時間",
      stem: "以下的累積頻數曲線顯示一組中三學生今早由家前往學校所需的交通時間（準確至最接近的分鐘）。求這些交通時間的中位數，準確至最接近的分鐘。",
      points: [
        { x: 9.5, y: 0 },
        { x: 14.5, y: 6 },
        { x: 19.5, y: 16 },
        { x: 24.5, y: 30 },
        { x: 27, y: 50 },
        { x: 29.5, y: 72 },
        { x: 34.5, y: 90 },
        { x: 39.5, y: 100 }
      ]
    }
  ];

  let lessonIndex = 0;
  let phase = "type";
  let tutor = freshTutor();
  let fieldDrafts = {};
  let experiment = null;
  let asking = false;
  let authFailed = false;
  let teacherNote = "";
  let askWasOpen = false;

  function freshTutor() {
    return { mode: "type", step: 1, log: [], hints: {}, trials: [], trap: false, solved: false };
  }

  function current() {
    return lessons[lessonIndex];
  }

  function geminiKey() {
    return String((window.MEDIAN_TEACHER && window.MEDIAN_TEACHER.geminiKey) || "").trim();
  }

  function pacificDateKey(date) {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Los_Angeles",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(date);
  }

  function storageGet(key) {
    try { return localStorage.getItem(key); } catch (error) { return null; }
  }

  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (error) { /* private mode */ }
  }

  function storageRemove(key) {
    try { localStorage.removeItem(key); } catch (error) { /* private mode */ }
  }

  function dailyLocked() {
    return storageGet("medianGeminiDay") === pacificDateKey(new Date());
  }

  function minuteLocked() {
    return Number(storageGet("medianGeminiMinuteUntil") || 0) > Date.now();
  }

  function aiOpen() {
    return !!geminiKey() && !authFailed && !dailyLocked() && !minuteLocked();
  }

  function remember429(body) {
    if (MedianMath.classifyQuota(body) === "minute") {
      storageSet("medianGeminiMinuteUntil", String(Date.now() + 60000));
    } else {
      storageSet("medianGeminiDay", pacificDateKey(new Date()));
    }
  }

  function modelOf(lesson) {
    return MedianMath.normalizeRows(lesson.rows.map((row) => ({
      val: String(row.val),
      freq: String(row.freq)
    })));
  }

  function knownView() {
    const model = modelOf(current());
    if (model.error || model.hasX) return null;
    return MedianMath.medianForX(model.rows, 1);
  }

  function travelAnswer() {
    return MedianMath.curveMedian(current().points);
  }

  function normalizeTyped(raw) {
    return String(raw ?? "").replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).trim();
  }

  function formatMedian(n) {
    if (Number.isInteger(n)) return String(n);
    return String(Math.round(n * 1000) / 1000);
  }

  function loadLesson(index) {
    lessonIndex = index;
    phase = "type";
    tutor = freshTutor();
    fieldDrafts = {};
    experiment = null;
    asking = false;
    document.querySelectorAll("input[id]").forEach((input) => { input.value = ""; });
    tutor.log.push({ kind: "tutor", text: "做之前，先判斷：這是離散數據還是連續數據？" });
    render();
  }

  function rememberFields() {
    document.querySelectorAll("input[id]").forEach((input) => {
      fieldDrafts[input.id] = input.value;
    });
  }

  function restoreField(input) {
    if (Object.prototype.hasOwnProperty.call(fieldDrafts, input.id)) input.value = fieldDrafts[input.id];
  }

  function render() {
    rememberFields();
    renderProgress();
    renderTeacher();
    renderPicture();
    renderQueue();
    renderTutor();
    askWasOpen = aiOpen();
  }

  function renderProgress() {
    const lesson = current();
    document.getElementById("progress").textContent = "第 " + (lessonIndex + 1) + " 題，共 " + lessons.length + " 題：" + lesson.title;
  }

  function teacherStatusText() {
    if (!geminiKey()) {
      return "未寫入免費 key。用文字編輯器打開同一個資料夾的 teacher-config.js，把 key 貼在 geminiKey 的引號裡，儲存後重新整理。不要在 AI Studio 開通付款，也不要把這個檔上傳到 GitHub。";
    }
    if (authFailed) {
      return "key 不被接受。問答已停，學生只會看到三層提示。沒有改叫其他模型。請確認這把 key 來自未開通付款的免費專案。" + (teacherNote ? " " + teacherNote : "");
    }
    if (dailyLocked()) {
      return "問答已停。學生頁只留三層提示，不會寫出用完。今日免費額度已用完。太平洋時間午夜後會再試（九月約是香港時間下午 3 時）。";
    }
    if (minuteLocked()) {
      return "問得太密，問答暫停約一分鐘。學生頁不會說明原因，時間過了會自己恢復。";
    }
    return teacherNote || "免費問答可用。學生頁不會顯示這列。檢查額度會用掉一次免費問答。";
  }

  function renderTeacher() {
    const bar = document.getElementById("teacherBar");
    bar.hidden = !teacherView;
    if (!teacherView) return;
    let status = bar.querySelector("#teacherStatus");
    if (!status) {
      const heading = document.createElement("strong");
      heading.textContent = "老師檢視";
      status = document.createElement("p");
      status.id = "teacherStatus";
      const button = document.createElement("button");
      button.type = "button";
      button.id = "checkQuota";
      button.className = "btn btn-secondary";
      button.textContent = "檢查額度";
      button.addEventListener("click", checkQuota);
      bar.append(heading, status, button);
    }
    status.textContent = teacherStatusText();
  }

  function renderPicture() {
    const card = document.getElementById("pictureCard");
    const lesson = current();
    card.innerHTML = "";
    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = lesson.title;
    const stem = document.createElement("p");
    stem.className = "problem-text";
    stem.textContent = lesson.stem;
    card.append(title, stem);
    if (lesson.image) {
      const img = document.createElement("img");
      img.src = lesson.image;
      img.alt = lesson.stem;
      img.className = "problem-img";
      card.appendChild(img);
    }
    if (lesson.kind === "continuous") {
      const wrap = document.createElement("div");
      wrap.className = "curve-wrap";
      wrap.innerHTML = curveSvg(lesson.points, phase === "steps" && tutor.solved);
      card.appendChild(wrap);
      if (phase === "steps") card.appendChild(sheetBlock());
    } else {
      card.appendChild(staticTable(lesson));
    }
    if (lesson.kind === "discrete-unknown" && phase === "steps" && tutor.step >= 4 && !tutor.solved) {
      card.appendChild(trialControls());
    }
  }

  function staticTable(lesson) {
    const wrap = document.createElement("div");
    wrap.className = "table-wrapper";
    const table = document.createElement("table");
    table.className = "horizontal-table";
    const values = document.createElement("tr");
    const freq = document.createElement("tr");
    const valueHeader = document.createElement("th");
    valueHeader.className = "row-header";
    valueHeader.textContent = lesson.header;
    const freqHeader = document.createElement("th");
    freqHeader.className = "row-header";
    freqHeader.textContent = "頻數";
    values.appendChild(valueHeader);
    freq.appendChild(freqHeader);
    lesson.rows.forEach((row) => {
      const valueCell = document.createElement("td");
      valueCell.className = "static-cell";
      valueCell.textContent = String(row.val);
      const freqCell = document.createElement("td");
      freqCell.className = "static-cell";
      freqCell.textContent = String(row.freq);
      values.appendChild(valueCell);
      freq.appendChild(freqCell);
    });
    const body = document.createElement("tbody");
    body.append(values, freq);
    table.appendChild(body);
    wrap.appendChild(table);
    return wrap;
  }

  function sheetBlock() {
    const answer = travelAnswer();
    const showTotal = tutor.step > 1 || tutor.solved;
    const showHalf = tutor.step > 2 || tutor.solved;
    const box = document.createElement("div");
    box.className = "sheet";
    ["數據的總頻數 = " + (showTotal ? answer.total : "______"),
      "對應中位數的累積頻數 = 總頻數 × 50% = " + (showHalf ? answer.half : "______"),
      "中位數 = " + (tutor.solved ? answer.minute : "______") + " 分鐘"
    ].forEach((text) => {
      const line = document.createElement("p");
      line.textContent = text;
      box.appendChild(line);
    });
    return box;
  }

  function trialControls() {
    const row = document.createElement("div");
    row.className = "action-row";
    const label = document.createElement("label");
    label.append(document.createTextNode("試 x = "));
    const input = document.createElement("input");
    input.id = "trialX";
    input.type = "number";
    input.min = "1";
    input.step = "1";
    input.inputMode = "numeric";
    restoreField(input);
    label.appendChild(input);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "btn";
    button.textContent = "看看這個 x";
    button.addEventListener("click", tryX);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        tryX();
      }
    });
    row.append(label, button);
    return row;
  }

  function curveSvg(points, guide) {
    const w = 720;
    const h = 440;
    const pad = { l: 70, r: 28, t: 36, b: 72 };
    const xmin = points[0].x;
    const xmax = points[points.length - 1].x;
    const ymax = points[points.length - 1].y;
    const X = (x) => pad.l + (x - xmin) / (xmax - xmin) * (w - pad.l - pad.r);
    const Y = (y) => pad.t + (1 - y / ymax) * (h - pad.t - pad.b);
    const samples = MedianMath.curveSamples(points, 0.15);
    const line = samples.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
    const fill = line + " L" + X(xmax).toFixed(1) + " " + Y(0).toFixed(1) + " L" + X(xmin).toFixed(1) + " " + Y(0).toFixed(1) + " Z";
    let grid = "";
    for (let y = 0; y <= ymax; y += 10) {
      grid += '<line x1="' + pad.l + '" y1="' + Y(y).toFixed(1) + '" x2="' + (w - pad.r) + '" y2="' + Y(y).toFixed(1) + '" stroke="#e2e8f0"/>';
      grid += '<text x="' + (pad.l - 8) + '" y="' + (Y(y) + 4).toFixed(1) + '" text-anchor="end" font-size="12" fill="#475569">' + y + "</text>";
    }
    let dots = "";
    points.forEach((p) => {
      if (Math.abs((p.x % 1) - 0.5) > 0.01) return;
      grid += '<line x1="' + X(p.x).toFixed(1) + '" y1="' + pad.t + '" x2="' + X(p.x).toFixed(1) + '" y2="' + (h - pad.b) + '" stroke="#cbd5e1"/>';
      grid += '<text x="' + X(p.x).toFixed(1) + '" y="' + (h - pad.b + 18) + '" text-anchor="middle" font-size="12" fill="#334155">' + p.x + "</text>";
      dots += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="3.5" fill="#0f172a"/>';
    });
    let guideSvg = "";
    if (guide) {
      const answer = MedianMath.curveMedian(points);
      const gx = X(answer.rawX).toFixed(1);
      const gy = Y(answer.half).toFixed(1);
      guideSvg = '<line x1="' + pad.l + '" y1="' + gy + '" x2="' + gx + '" y2="' + gy + '" stroke="#16a34a" stroke-dasharray="6 4" stroke-width="2"/>' +
        '<line x1="' + gx + '" y1="' + gy + '" x2="' + gx + '" y2="' + (h - pad.b) + '" stroke="#16a34a" stroke-dasharray="6 4" stroke-width="2"/>' +
        '<circle cx="' + gx + '" cy="' + gy + '" r="4.5" fill="#16a34a"/>';
    }
    const midY = (pad.t + h - pad.b) / 2;
    return '<svg viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="回校交通時間的累積頻數曲線">' +
      '<text x="' + ((pad.l + w - pad.r) / 2) + '" y="20" text-anchor="middle" font-size="15" fill="#0f172a">一組學生今早由家前往學校所需的交通時間</text>' +
      grid +
      '<path d="' + fill + '" fill="#dbeafe" opacity="0.7"/>' +
      '<path d="' + line + '" fill="none" stroke="#0f172a" stroke-width="2.5"/>' +
      dots + guideSvg +
      '<text x="' + ((pad.l + w - pad.r) / 2) + '" y="' + (h - 16) + '" text-anchor="middle" font-size="13" fill="#334155">交通時間（分鐘）</text>' +
      '<text x="18" y="' + midY + '" text-anchor="middle" font-size="13" fill="#334155" transform="rotate(-90 18 ' + midY + ')">累積頻數</text>' +
      "</svg>";
  }

  function renderQueue() {
    const card = document.getElementById("queueCard");
    const lesson = current();
    const showKnown = lesson.kind === "discrete-known";
    const showUnknown = lesson.kind === "discrete-unknown" && phase === "steps" && tutor.step >= 4;
    card.hidden = !(showKnown || showUnknown);
    const wrapper = document.getElementById("blocksWrapper");
    const resultBox = document.getElementById("resultBox");
    const result = document.getElementById("resultContent");
    wrapper.innerHTML = "";
    result.innerHTML = "";
    resultBox.hidden = true;
    if (showKnown) {
      const view = knownView();
      const highlight = (tutor.step >= 3 && phase === "steps") || tutor.solved;
      renderBlocks(expandRows(modelOf(lesson).rows, 1), highlight ? view.positions.map((position) => position - 1) : []);
      if (tutor.solved) {
        resultBox.hidden = false;
        result.append(
          stepLine("N = " + view.N + (view.odd ? "（奇數）" : "（偶數）")),
          stepLine(view.odd
            ? "中間是第 " + view.positions[0] + " 項。"
            : "中間是第 " + view.positions[0] + " 項和第 " + view.positions[1] + " 項，數值是 " + view.values[0] + " 和 " + view.values[1] + "。"),
          stepLine("中位數 = " + formatMedian(view.median))
        );
      }
      return;
    }
    if (!showUnknown) return;
    if (!experiment) {
      resultBox.hidden = false;
      result.textContent = "輸入一個正整數 x，再看隊列。中位數會不會等於 3，要看過才知道。";
      return;
    }
    const view = experiment.view;
    if (view.N > 400) {
      wrapper.textContent = "這個 x 的隊列很長，不逐格畫出。下面仍寫出 N 和中位數。";
    } else {
      renderBlocks(expandRows(modelOf(lesson).rows, experiment.x), view.positions.map((position) => position - 1));
    }
    resultBox.hidden = false;
    result.append(stepLine("今次代入 x = " + experiment.x + "。"));
    if (view.odd) {
      result.append(
        stepLine("N = " + view.N + "（奇數），中間是第 " + view.positions[0] + " 項。"),
        stepLine("中位數 = " + formatMedian(view.median))
      );
    } else {
      result.append(
        stepLine("N = " + view.N + "（偶數），中間是第 " + view.positions[0] + " 項和第 " + view.positions[1] + " 項。"),
        stepLine("這兩項是 " + view.values[0] + " 和 " + view.values[1] + "，中位數 = " + formatMedian(view.median))
      );
    }
    result.append(stepLine(experiment.hit ? "這個 x 的中位數等於題目所給的數。" : "這個 x 的中位數還不是題目所給的數。"));
  }

  function stepLine(text) {
    const line = document.createElement("div");
    line.className = "formula-step";
    line.textContent = text;
    return line;
  }

  function expandRows(rows, x) {
    const expanded = [];
    rows.forEach((row) => {
      const count = row.freq.c + row.freq.k * x;
      for (let i = 0; i < count; i += 1) expanded.push(row.val);
    });
    return expanded;
  }

  function renderBlocks(expanded, medianIndices) {
    const wrapper = document.getElementById("blocksWrapper");
    wrapper.innerHTML = "";
    const keep = new Set();
    const total = expanded.length;
    if (total <= 160) {
      expanded.forEach((_, index) => keep.add(index));
    } else {
      for (let i = 0; i < Math.min(20, total); i += 1) keep.add(i);
      for (let i = Math.max(0, total - 10); i < total; i += 1) keep.add(i);
      medianIndices.forEach((idx) => {
        for (let delta = -6; delta <= 6; delta += 1) {
          const j = idx + delta;
          if (j >= 0 && j < total) keep.add(j);
        }
      });
    }
    let previous = -1;
    [...keep].sort((a, b) => a - b).forEach((index) => {
      if (previous >= 0 && index > previous + 1) {
        const gap = document.createElement("div");
        gap.className = "block-gap";
        gap.textContent = "…";
        wrapper.appendChild(gap);
      }
      previous = index;
      const block = document.createElement("div");
      block.className = "block" + (medianIndices.includes(index) ? " highlight" : "");
      const pos = document.createElement("div");
      pos.className = "block-pos";
      pos.textContent = String(index + 1);
      const val = document.createElement("div");
      val.className = "block-val";
      val.textContent = String(expanded[index]);
      block.append(pos, val);
      wrapper.appendChild(block);
    });
  }

  function tryX() {
    const input = document.getElementById("trialX");
    const x = Number(input.value);
    if (!Number.isInteger(x) || x <= 0) {
      tutor.log.push({ kind: "tutor", text: "x 要是正整數。" });
      render();
      return;
    }
    const model = modelOf(current());
    const view = MedianMath.medianForX(model.rows, x);
    const hit = MedianMath.sameNumber(view.median, current().target);
    experiment = { x, view, hit };
    const previous = tutor.trials[tutor.trials.length - 1];
    if (!previous || previous.x !== x || previous.median !== view.median) {
      tutor.trials.push({ x, median: view.median, hit });
    }
    render();
  }

  function renderTutor() {
    renderLog();
    const form = document.getElementById("tutorForm");
    const actions = document.getElementById("tutorActions");
    form.innerHTML = "";
    actions.innerHTML = "";
    if (tutor.solved) {
      if (lessonIndex < lessons.length - 1) actions.appendChild(makeButton("下一題", "btn", () => loadLesson(lessonIndex + 1)));
      else actions.appendChild(makeButton("回到第一題", "btn btn-secondary", () => loadLesson(0)));
      return;
    }
    if (phase === "type") {
      actions.appendChild(makeButton("離散數據", "btn", () => answerType(false)));
      actions.appendChild(makeButton("連續數據", "btn btn-secondary", () => answerType(true)));
    } else if (tutor.mode === "unknown" && tutor.step === 3) {
      actions.appendChild(makeButton("有可能", "btn btn-secondary", () => answerPossibility(true)));
      actions.appendChild(makeButton("沒有可能", "btn", () => answerPossibility(false)));
    } else if (tutor.mode === "unknown" && tutor.step === 4) {
      form.appendChild(trialSummary());
      actions.appendChild(makeButton("我試完了，去找範圍", "btn", finishExperiment));
    } else if (tutor.mode === "unknown" && tutor.step === 5) {
      form.appendChild(trialSummary());
      form.appendChild(answerFields());
      actions.appendChild(makeButton("核對", "btn", checkFinalAnswer));
    } else {
      form.appendChild(answerFields());
      actions.appendChild(makeButton("送出", "btn", submitStep));
    }
    [1, 2, 3].forEach((level) => {
      const used = tutor.hints[tutor.step] && tutor.hints[tutor.step][level];
      const name = "提示" + "一二三"[level - 1];
      actions.appendChild(makeButton(used ? name + "（已看）" : name, "btn btn-hint" + (level > 1 ? " level-" + level : ""), () => showHint(level)));
    });
    if (aiOpen()) actions.appendChild(askRow());
  }

  function askRow() {
    const row = document.createElement("div");
    row.className = "form-row";
    row.id = "askRow";
    const input = document.createElement("input");
    input.id = "askInput";
    input.type = "text";
    input.maxLength = 200;
    input.autocomplete = "off";
    input.placeholder = "想問這一小步，可以打在這裡";
    restoreField(input);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        askAi();
      }
    });
    const button = document.createElement("button");
    button.type = "button";
    button.id = "askSend";
    button.className = "btn btn-secondary";
    button.textContent = "問這一步";
    button.disabled = asking;
    button.addEventListener("click", askAi);
    row.append(input, button);

  function renderLog() {
    const log = document.getElementById("tutorLog");
    log.innerHTML = "";
    tutor.log.forEach((item) => {
      const bubble = document.createElement("div");
      bubble.className = "bubble bubble-" + item.kind;
      if (item.kind === "hint") {
        const label = document.createElement("span");
        label.className = "bubble-label";
        label.textContent = "提示" + "一二三"[item.level - 1];
        bubble.appendChild(label);
      }

      body.textContent = item.text;
      bubble.appendChild(body);
      log.appendChild(bubble);
    });
    log.scrollTop = log.scrollHeight;
  }

  function makeButton(label, className, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = className;
    button.textContent = label;
    button.addEventListener("click", onClick);
    return button;
  }

  function answerFields() {
    const row = document.createElement("div");
    row.className = "form-row";
    if (tutor.mode === "known" && tutor.step === 1) row.append(fieldLabel("N =", "knownN"));
    else if (tutor.mode === "known" && tutor.step === 2 && knownView() && !knownView().odd) {
      row.append(fieldLabel("第", "pos1"), text(" 項及第 "), fieldLabel("", "pos2"), text(" 項"));
    } else if (tutor.mode === "known" && tutor.step === 2) row.append(fieldLabel("第", "pos1"), text(" 項"));
    else if (tutor.mode === "known" && tutor.step === 3) row.append(fieldLabel("中位數 =", "knownMedian"));
    else if (tutor.mode === "unknown" && tutor.step === 1) row.append(fieldLabel("N =", "exprN"));
    else if (tutor.mode === "unknown" && tutor.step === 2) {
      row.append(fieldLabel("由第", "spanStart"), text(" 項到第 "), fieldLabel("", "spanEnd"), text(" 項"));
    } else if (tutor.mode === "unknown" && tutor.step === 5) {
      const range = MedianMath.rangeForTarget(modelOf(current()).rows, current().target);
      if (range && range.unbounded) row.append(fieldLabel("最小 x =", "ansMin"), text(" 沒有最大可取值"));
      else row.append(fieldLabel("最小 x =", "ansMin"), fieldLabel("最大 x =", "ansMax"));
    } else if (tutor.mode === "continuous" && tutor.step === 1) row.append(fieldLabel("總頻數 =", "cfTotal"));
    else if (tutor.mode === "continuous" && tutor.step === 2) row.append(fieldLabel("累積頻數 =", "cfHalf"));
    else if (tutor.mode === "continuous" && tutor.step === 3) row.append(fieldLabel("中位數 =", "minute"), text(" 分鐘"));

  function fieldLabel(caption, id) {
    const label = document.createElement("label");
    if (caption) label.append(document.createTextNode(caption + " "));
    const input = document.createElement("input");
    input.type = "text";
    input.id = id;
    input.autocomplete = "off";
    restoreField(input);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        if (tutor.step === 5 && tutor.mode === "unknown") checkFinalAnswer();
        else submitStep();
      }
    });

    return label;

  function trialSummary() {
    const wrap = document.createElement("div");
    if (!tutor.trials.length) {
      wrap.textContent = "你還沒有試過 x。";
      return wrap;

  function questionText() {
    if (phase === "type") return "做之前，先判斷：這是離散數據還是連續數據？";
    const lesson = current();
    if (tutor.mode === "known") {
      const view = knownView();
      if (tutor.step === 1) return "單看頻數表，這批數據一共有多少個？";
      if (tutor.step === 2) {
        return view.odd ? "N 是奇數還是偶數？中間那個位置是第幾項？" : "N 是偶數。中間要看哪兩項？";
      }
      return view.odd ? "中間那一項的數值就是中位數。它是多少？" : "中間那兩項要先平均。中位數是多少？";
    }
    if (tutor.mode === "continuous") {
      if (tutor.step === 1) return "曲線終點的高度就是數據的總頻數。總頻數是多少？";
      if (tutor.step === 2) return "連續數據的中位數，對應總頻數的 50%。這個累積頻數是多少？";
      return "在縱軸找到這個累積頻數，水平碰到曲線，再讀橫軸最接近的分鐘。中位數是多少分鐘？";
    }
    const model = modelOf(lesson);
    const names = neighborValues(model.rows, lesson.target);
    if (tutor.step === 1) return "先不要猜 x 是幾。全部數據的個數 N，應該怎樣用 x 寫出來？";
    if (tutor.step === 2) return "中位數是 " + lesson.target + "，代表排好之後，中間位置要落在「" + lesson.target + "」這一組。這一組由第幾項開始，到第幾項結束？式子可以含 x。";
    if (tutor.step === 3) {
      if (tutor.trap) {
        return names.prev != null && names.next != null
          ? "再想「相鄰」。" + names.prev + " 和 " + names.next + " 中間還有整組「" + lesson.target + "」。兩個相鄰位置的中間，可以隔著其他數據嗎？所以一個是 " + names.prev + "、一個是 " + names.next + "，有沒有可能？"
          : "兩個位置若是相鄰，中間就不能還有其他數據。有沒有可能跳過「" + lesson.target + "」那一組？";
      }
      return names.prev != null && names.next != null
        ? "N 有時是奇數，有時是偶數。如果 N 是偶數，中間兩個相鄰位置，有沒有可能一個是 " + names.prev + "、一個是 " + names.next + "，平均之後變成 " + lesson.target + "？"
        : "如果 N 是偶數，中間兩個相鄰位置，有沒有可能分別落在「" + lesson.target + "」兩邊，平均之後剛好是 " + lesson.target + "？";
    }
    if (tutor.step === 4) return "用「試 x」代入正整數。先找一個中位數剛好是 " + lesson.target + " 的 x，再試小一點和大一點的，看它從哪裡開始不符合。";
    const range = MedianMath.rangeForTarget(model.rows, lesson.target);
    return range && range.unbounded ? "x 最小可以是多少？有沒有最大可取值？" : "x 的最小可取值是多少？最大可取值是多少？";
  }

  function conceptText() {
    if (phase === "type") return "幫同學分辨分開逐個點算的數據，和有組界、用累積頻數曲線表示的數據。不要直接說出是離散還是連續。";
    if (tutor.mode === "known") {
      if (tutor.step === 1) return "幫他明白總數是把頻數相加。不要說出總數。";
      if (tutor.step === 2) return "幫他由奇數或偶數決定看中間一項還是兩項。不要說出第幾項。";
      return "幫他從中間位置讀數值；偶數要先平均。不要說出中位數。";
    }
    if (tutor.mode === "continuous") {
      if (tutor.step === 1) return "幫他從曲線終點的高度讀總頻數。不要說出那個數。";
      if (tutor.step === 2) return "幫他明白連續數據取總頻數的 50% 作累積頻數，不是第 (N+1)/2 項。不要說出算出來的數。";
      return "幫他在一半的高度看曲線交點，再讀橫軸最接近的分鐘。不要說出分鐘。";
    }
    if (tutor.step === 1) return "幫他把總人數寫成含 x 的式子，不要先代入數字，也不要寫出整條式子。";
    if (tutor.step === 2) return "幫他找出中位數那一組由第幾項到第幾項。不要寫出完整式子。";
    if (tutor.step === 3) return "幫他明白相鄰兩項中間不能還隔著整組數據。不要替他做後面的範圍。";
    if (tutor.step === 4) return "幫他用不同的正整數試 x，看中位數是否等於題目。不要說出最小或最大可取值。";
    return "幫他用試過的結果夾出範圍。不要說出 x 的最小或最大可取值。";
  }

  function neighborValues(rows, target) {
    const index = rows.findIndex((row) => MedianMath.sameNumber(row.val, target));
    return {
      prev: index > 0 ? rows[index - 1].val : null,
      next: index >= 0 && index < rows.length - 1 ? rows[index + 1].val : null
    };
  }

  function hintText(level) {
    const lesson = current();
    if (phase === "type") {
      const continuous = lesson.kind === "continuous";
      if (level === 1) return "先看數據長什麼樣子：一個個分開的數值，還是一段段範圍畫成的曲線。";
      if (level === 2) return continuous ? "看橫軸的組界（有 .5），和一路向上累積的縱軸。" : "看每一欄是不是一個分開的數值，加上它出現的次數。";
      return continuous ? "這是連續數據。" : "這是離散數據。";
    }
    if (tutor.mode === "known") return knownHint(level);
    if (tutor.mode === "continuous") return continuousHint(level);
    return unknownHint(level);
  }

  function knownHint(level) {
    const view = knownView();
    if (tutor.step === 1) {
      if (level === 1) return "頻數是每個數值出現的次數。總數是全部頻數相加。";
      if (level === 2) return "把頻數那一列的數字逐個相加。";
      return "N = " + view.N + "。";
    }
    if (tutor.step === 2) {
      if (level === 1) return view.odd ? "奇數個數據，只取最中間的一項。" : "偶數個數據，要取最中間的兩項。";
      if (level === 2) return view.odd ? "位置是第 (N+1)/2 項。" : "位置是第 N/2 項和第 N/2+1 項。";
      return view.odd ? "中間是第 " + view.positions[0] + " 項。" : "中間是第 " + view.positions[0] + " 項和第 " + view.positions[1] + " 項。";
    }
    if (level === 1) return "看中間位置上的數值。";
    if (level === 2) return view.odd ? "奇數時，中位數就是那一項的數值。" : "偶數時，把那兩項加起來再除以 2。";
    return view.odd ? "中位數是 " + formatMedian(view.median) + "。" : "中位數 = (" + view.values[0] + " + " + view.values[1] + ") / 2 = " + formatMedian(view.median) + "。";
  }

  function bracketBounds(points, rawX) {
    const bounds = points.filter((point) => Math.abs((point.x % 1) - 0.5) < 0.01).map((point) => point.x);
    let left = bounds[0];
    let right = bounds[bounds.length - 1];
    for (let i = 0; i < bounds.length - 1; i += 1) {
      if (rawX >= bounds[i] && rawX <= bounds[i + 1]) {
        left = bounds[i];
        right = bounds[i + 1];
      }
    }
    return { left, right };
  }

  function continuousHint(level) {
    const answer = travelAnswer();
    const bounds = bracketBounds(current().points, answer.rawX);
    if (tutor.step === 1) {
      if (level === 1) return "看曲線最右、最高的那一點。";
      if (level === 2) return "這一點的縱座標就是全部數據的個數。";
      return "總頻數是 " + answer.total + "。";
    }
    if (tutor.step === 2) {
      if (level === 1) return "連續數據不是找第 (N+1)/2 項，而是取總頻數的一半。";
      if (level === 2) return "用總頻數乘 50%。";
      return answer.total + " × 50% = " + answer.half + "。";
    }
    if (level === 1) return "在縱軸找到一半的累積頻數，看水平線會碰到曲線的哪裡。";
    if (level === 2) return "交點在 " + bounds.left + " 和 " + bounds.right + " 這兩個組界之間。看它靠近中間還是靠近某一邊，再寫最接近的分鐘。";
    return "中位數是 " + answer.minute + " 分鐘。";
  }

  function unknownHint(level) {
    const lesson = current();
    const model = modelOf(lesson);
    const info = MedianMath.describeProblem(model.rows, lesson.target);
    const names = neighborValues(model.rows, lesson.target);
    if (tutor.step === 1) {
      if (level === 1) return "把每一格頻數加起來。未知的那一格繼續寫 x，不要先代入數字。";
      if (level === 2) return "先把不是 x 的頻數加起來，總和是 " + info.total.c + "，然後再加上 x。";
      return "N = " + info.totalText + "。x 是正整數，所以 N 會變，有時是奇數，有時是偶數。";
    }
    if (tutor.step === 2) {
      if (level === 1) return "先數「" + lesson.target + "」前面有多少個數據，再數這一組自己有多少個。";
      if (level === 2) return "這一組前面有 " + info.beforeText + " 個數據，這一組自己有 " + info.countText + " 個。";
      return "由第 " + info.startText + " 項開始，到第 " + info.endText + " 項結束。";
    }
    if (tutor.step === 3) {
      if (level === 1) return "相鄰指兩個位置中間沒有其他數據。";
      if (level === 2) {
        return names.prev != null && names.next != null
          ? "排序後，" + names.prev + " 和 " + names.next + " 中間還有「" + lesson.target + "」。"
          : "這一組的左右如果還有數據，就不會和對面那一組緊貼。";
      }
      return "沒有可能。這一組至少有一個數據，兩邊不會緊貼。偶數時，中間兩項都必須是 " + lesson.target + "。";
    }
    if (tutor.step === 4) {
      if (level === 1) return "不要一次就找範圍。先令中位數等於題目，再向左右各試一個。";
      if (level === 2) return "看綠色的位置落在哪一個數值。不符合時，留意它變成了比題目大還是小。";
      return "符合的 x 把範圍夾在中間。太小或太大時，中間位置會滑出「" + lesson.target + "」這一組。";
    }
    const oddWord = info.total.c % 2 === 0 ? "奇數" : "偶數";
    const evenWord = info.total.c % 2 === 0 ? "偶數" : "奇數";
    if (level === 1) return "邊界通常是：中間位置剛好是這一組的第一個，或剛好是最後一個。";
    if (level === 2) return "奇數看第 (N+1)/2 項。偶數看第 N/2 項和第 N/2+1 項，而且這兩項都要是 " + lesson.target + "。";
    return "設 N = " + info.totalText + "，「" + lesson.target + "」佔第 " + info.startText + " 項到第 " + info.endText + " 項。\n" +
      oddWord + "的 x（這時 N 是奇數）：" + info.startText + " ≤ (N+1)/2 ≤ " + info.endText + "。\n" +
      evenWord + "的 x（這時 N 是偶數）：" + info.startText + " ≤ N/2，而且 N/2+1 ≤ " + info.endText + "。\n" +
      "在正整數中，同時符合的最小和最大就是答案。";
  }

  function showHint(level) {
    if (tutor.solved) return;
    tutor.hints[tutor.step] = tutor.hints[tutor.step] || {};
    if (!tutor.hints[tutor.step][level]) {
      tutor.hints[tutor.step][level] = true;
      tutor.log.push({ kind: "hint", level, text: hintText(level) });
    }
    render();
  }

  function answerType(choseContinuous) {
    const continuous = current().kind === "continuous";
    const correct = choseContinuous === continuous;
    tutor.log.push({ kind: "student", text: choseContinuous ? "連續數據" : "離散數據" });
    if (correct) {
      beginSteps();
      return;
    }
    const first = !tutor.trap;
    tutor.trap = true;
    tutor.log.push({
      kind: "tutor",
      text: continuous
        ? (first ? "還未對。橫軸標出的是組界，縱軸是一路累積的頻數。" : "這是一段段範圍，加上累積頻數曲線，不是逐個數值各算一次。再選一次。")
        : (first ? "還未對。表裡每一欄是一個分開的數值，旁邊是它的次數。沒有組界。" : "這是一個個分開的數值，各自一個次數，不是一段段範圍。再選一次。")
    });
    render();
  }

  function beginSteps() {
    const lesson = current();
    phase = "steps";
    tutor.mode = lesson.kind === "continuous" ? "continuous" : lesson.kind === "discrete-unknown" ? "unknown" : "known";
    tutor.step = 1;
    tutor.hints = {};
    tutor.trap = false;
    tutor.solved = false;
    tutor.log.push({
      kind: "tutor",
      text: lesson.kind === "continuous"
        ? "對。這是連續數據。數據被分組，中位數要在累積頻數曲線上，對應總頻數的 50%，而不是第 (N+1)/2 項。"
        : "對。這是離散數據。每個數值是分開點算的，中位數要在由小到大的隊列裡找位置，不是在曲線上取 50%。"
    });
    tutor.log.push({ kind: "tutor", text: questionText() });
    render();
  }

  function advance(message) {
    tutor.log.push({ kind: "tutor", text: message });
    const maxStep = tutor.mode === "unknown" ? 5 : 3;
    tutor.step += 1;
    tutor.trap = false;
    if (tutor.step > maxStep) {
      tutor.solved = true;
      return;
    }
    tutor.log.push({ kind: "tutor", text: questionText() });
  }

  function markSolved(text) {
    tutor.solved = true;
    tutor.log.push({ kind: "tutor", text: text });
    if (lessonIndex === lessons.length - 1) {
      tutor.log.push({
        kind: "tutor",
        text: "三題都做完了。\n離散數據要把數據由小到大排好：奇數個取最中間一項，偶數個取最中間兩項的平均。\n連續數據看累積頻數曲線，中位數對應總頻數的 50%，再從曲線讀回橫軸。\n兩種都叫中位數，但一個是找第幾項，一個是找一半的累積頻數。"
      });
    }
  }

  function submitStep() {
    if (tutor.mode === "known") submitKnown();
    else if (tutor.mode === "continuous") submitContinuous();
    else if (tutor.step === 1) submitTotal();
    else if (tutor.step === 2) submitSpan();
  }

  function submitKnown() {
    const view = knownView();
    if (tutor.step === 1) {
      const raw = normalizeTyped(document.getElementById("knownN").value);
      tutor.log.push({ kind: "student", text: "N = " + raw });
      if (Number(raw) === view.N) advance("對，共有 " + view.N + " 個數據。");
      else tutor.log.push({ kind: "tutor", text: "還未對。頻數要全部相加。" });
    } else if (tutor.step === 2) {
      const first = Number(normalizeTyped(document.getElementById("pos1").value));
      const second = view.odd ? null : Number(normalizeTyped(document.getElementById("pos2").value));
      tutor.log.push({
        kind: "student",
        text: view.odd ? "第 " + first + " 項" : "第 " + first + " 項及第 " + second + " 項"
      });
      const ok = view.odd ? first === view.positions[0] : first === view.positions[0] && second === view.positions[1];
      if (ok) advance(view.odd ? "對，就是最中間的那一項。" : "對，偶數要看中間這兩項。");
      else tutor.log.push({ kind: "tutor", text: "位置還未對。先判斷 N 是奇數還是偶數，再寫第幾項。" });
    } else if (tutor.step === 3) {
      const raw = normalizeTyped(document.getElementById("knownMedian").value);
      tutor.log.push({ kind: "student", text: "中位數 = " + raw });
      if (MedianMath.sameNumber(Number(raw), view.median)) {
        markSolved("正確。中位數是 " + formatMedian(view.median) + "。" + (view.odd ? "" : "中間兩項是 " + view.values[0] + " 和 " + view.values[1] + "，平均後就是它。"));
      } else tutor.log.push({ kind: "tutor", text: "還未對。偶數時記得把中間兩項加起來再除以 2。" });
    }
    render();
  }

  function submitContinuous() {
    const answer = travelAnswer();
    if (tutor.step === 1) {
      const raw = normalizeTyped(document.getElementById("cfTotal").value);
      tutor.log.push({ kind: "student", text: "總頻數 = " + raw });
      if (Number(raw) === answer.total) advance("對。總頻數是 " + answer.total + "。");
      else tutor.log.push({ kind: "tutor", text: "還未對。看曲線最右、最高那一點的縱座標。" });
    } else if (tutor.step === 2) {
      const raw = normalizeTyped(document.getElementById("cfHalf").value);
      const value = Number(raw);
      tutor.log.push({ kind: "student", text: "累積頻數 = " + raw });
      if (value === answer.half) advance("對。對應中位數的累積頻數是 " + answer.half + "。");
      else if (value === answer.total) tutor.log.push({ kind: "tutor", text: "這是總頻數。連續數據要再取它的 50%。" });
      else if (value === 0.5) tutor.log.push({ kind: "tutor", text: "那是百分比本身。把總頻數乘 50%，得到的才是累積頻數。" });
      else tutor.log.push({ kind: "tutor", text: "還未對。中位數在連續數據對應總頻數的一半。" });
    } else if (tutor.step === 3) {
      const raw = normalizeTyped(document.getElementById("minute").value);
      const value = Number(raw);
      tutor.log.push({ kind: "student", text: "中位數 = " + raw + " 分鐘" });
      if (value === answer.minute) markSolved("正確。中位數是 " + answer.minute + " 分鐘。累積頻數 " + answer.half + " 的水平線交到曲線後，讀到的就是這個分鐘。");
      else if (Number.isFinite(value) && Math.abs(value - answer.rawX) <= 1.2 && value !== answer.minute) {
        tutor.log.push({ kind: "tutor", text: "很接近。題目要最接近的整數分鐘。" });
      } else if (Number.isFinite(value) && Math.abs(value - answer.minute) === 1) {
        tutor.log.push({ kind: "tutor", text: "差一點。再看交點落在兩個組界的什麼位置。" });
      } else tutor.log.push({ kind: "tutor", text: "還未對。先在縱軸找到一半的累積頻數，水平碰到曲線，再垂直讀橫軸。" });
    }
    render();
  }

  function submitTotal() {
    const raw = normalizeTyped(document.getElementById("exprN").value);
    const model = modelOf(current());
    const info = MedianMath.describeProblem(model.rows, current().target);
    const parsed = MedianMath.parseExprFromText(raw);
    tutor.log.push({ kind: "student", text: "N = " + raw });
    if (MedianMath.sameExpr(parsed, info.total)) advance("對。N = " + info.totalText + "。x 還未知道，所以先留在式子裡。");
    else if (parsed && parsed.k === 0) tutor.log.push({ kind: "tutor", text: "這是一個固定數字。x 改變時，總人數也會改變，式子裡要留著 x。" });
    else tutor.log.push({ kind: "tutor", text: "還未對。把不是 x 的頻數加起來，再加上 x。" });
    render();
  }

  function submitSpan() {
    const model = modelOf(current());
    const info = MedianMath.describeProblem(model.rows, current().target);
    const startRaw = normalizeTyped(document.getElementById("spanStart").value);
    const endRaw = normalizeTyped(document.getElementById("spanEnd").value);
    const start = MedianMath.parseExprFromText(startRaw);
    const end = MedianMath.parseExprFromText(endRaw);
    tutor.log.push({ kind: "student", text: "由第 " + startRaw + " 項到第 " + endRaw + " 項" });
    const startOk = MedianMath.sameExpr(start, info.span.start);
    const endOk = MedianMath.sameExpr(end, info.span.end);
    if (startOk && endOk) advance("對。「" + current().target + "」佔第 " + info.startText + " 項到第 " + info.endText + " 項。中間位置要落在這裡面。");
    else if (startOk) tutor.log.push({ kind: "tutor", text: "開始的位置對了，結束的位置還未對。開始之後，還要加上這一組自己的個數，再減 1 才是最後一項。" });
    else if (endOk) tutor.log.push({ kind: "tutor", text: "結束的位置對了，開始的位置還未對。前面有多少個數據，下一項就是這一組的第一項。" });
    else tutor.log.push({ kind: "tutor", text: "兩端都還未對。先寫出這一組前面有多少個，再寫這一組有多少個。" });
    render();
  }

  function answerPossibility(possible) {
    tutor.log.push({ kind: "student", text: possible ? "有可能" : "沒有可能" });
    if (!possible) {
      advance("對。相鄰兩項不能跳過中間那一組。所以偶數時，中間兩項都必須是 " + current().target + "，不能靠兩邊的數平均成它。");
      tutor.trap = false;
    } else if (!tutor.trap) {
      tutor.trap = true;
      tutor.log.push({ kind: "tutor", text: questionText() });
    } else {
      tutor.log.push({ kind: "tutor", text: "還未對。相鄰就是緊貼，中間不能再有其他數據。" });
    }
    render();
  }

  function finishExperiment() {
    const hits = tutor.trials.filter((trial) => trial.hit).length;
    const misses = tutor.trials.filter((trial) => !trial.hit).length;
    let note = "你還沒有試過 x。仍可以繼續，用中間位置落在這一組的條件來想。";
    if (hits && misses) note = "你已經見過符合和不符合的 x，可以用它們夾出最小和最大。";
    else if (tutor.trials.length) note = "你還沒有同時見過「符合」和「不符合」。可以再試，也可以先去寫範圍。";
    advance(note);
    render();
  }

  function checkFinalAnswer() {
    const model = modelOf(current());
    const range = MedianMath.rangeForTarget(model.rows, current().target);
    if (!range || range.none) {
      tutor.log.push({ kind: "tutor", text: "按現在這張表，沒有正整數 x 能使中位數等於題目。" });
      render();
      return;
    }
    const minRaw = normalizeTyped(document.getElementById("ansMin").value);
    const min = Number(minRaw);
    const maxInput = document.getElementById("ansMax");
    const maxRaw = maxInput ? normalizeTyped(maxInput.value) : "";
    const max = maxInput ? Number(maxRaw) : null;
    tutor.log.push({ kind: "student", text: range.unbounded ? "最小 " + minRaw + "，沒有最大" : "最小 " + minRaw + "，最大 " + maxRaw });
    if (!Number.isInteger(min) || min <= 0 || (!range.unbounded && (!Number.isInteger(max) || max <= 0))) {
      tutor.log.push({ kind: "tutor", text: "請填正整數。" });
      render();
      return;
    }
    const minOk = min === range.min;
    const maxOk = range.unbounded ? true : max === range.max;
    if (minOk && maxOk) {
      const gap = !range.unbounded && range.intervals.length > 1 ? "\n不過中間並非每一個整數都可以。" : "";
      markSolved(successText(model, range) + gap);
    } else {
      const notes = [];
      if (!minOk && min < range.min) notes.push("你填的最小值偏小，這個 x 的中位數還不是題目所給的數。");
      if (!minOk && min > range.min) notes.push("你填的最小值偏大，還有更小的正整數也可以。");
      if (!range.unbounded && !maxOk && max > range.max) notes.push("你填的最大值偏大，這個 x 的中位數已經不是題目所給的數。");
      if (!range.unbounded && !maxOk && max < range.max) notes.push("你填的最大值偏小，還有更大的正整數也可以。");
      if (minOk) notes.unshift("最小值這一側是對的。");
      if (maxOk && !range.unbounded) notes.unshift("最大值這一側是對的。");
      tutor.log.push({ kind: "tutor", text: notes.join("\n") + "\n還未完成。可以用試過的 x 再夾一次。" });
    }
    render();
  }

  function successText(model, range) {
    const target = current().target;
    const minStory = boundaryStory(model.rows, range.min, target);
    if (range.unbounded) return "正確。x 的最小可取值是 " + range.min + "，沒有最大可取值。\n" + minStory;
    const maxStory = boundaryStory(model.rows, range.max, target);
    return "正確。x 的最小可取值是 " + range.min + "，最大可取值是 " + range.max + "。\n" + minStory + "\n" + maxStory + "\n再出去一個，中間位置就會離開「" + target + "」。";
  }

  function boundaryStory(rows, x, target) {
    const view = MedianMath.medianForX(rows, x);
    const span = MedianMath.groupSpan(rows, target);
    const start = span.start.c + span.start.k * x;
    const end = span.end.c + span.end.k * x;
    const places = view.positions.map((position) => {
      if (position === start) return "第 " + position + " 項剛好是「" + target + "」的第一個";
      if (position === end) return "第 " + position + " 項剛好是「" + target + "」的最後一個";
      return "第 " + position + " 項是 " + target;
    });
    return "x = " + x + " 時，N = " + view.N + "，" + places.join("，") + "。";
  }

  async function askAi() {
    if (asking || tutor.solved || !aiOpen()) return;
    const input = document.getElementById("askInput");
    const message = normalizeTyped(input.value).slice(0, 200);
    if (!message) return;
    input.value = "";
    fieldDrafts.askInput = "";
    tutor.log.push({ kind: "student", text: message });
    asking = true;
    render();
    const result = await callGemini(message);
    asking = false;
    if (result.quota) {
      remember429(result.body);
      tutor.log.push({ kind: "tutor", text: "先看提示，完成這一小步。" });
    } else if (result.auth) {
      authFailed = true;
      tutor.log.push({ kind: "tutor", text: "先看提示，完成這一小步。" });
    } else if (result.text) {
      tutor.log.push({ kind: "tutor", text: result.text });
    } else {
      tutor.log.push({ kind: "tutor", text: "先看這一小步的數據，再試一次。" });
    }
    render();
  }

  async function callGemini(message) {
    const system = [
      "你是香港中三數學助教。",
      "同學正在做這一題：" + current().title + "。",
      "這一步的問題是：" + questionText(),
      "概念範圍：" + conceptText(),
      "只用繁體中文，句子短，適合中三。",
      "只談這一步。不要預告後面的步驟，不要給整題答案。",
      "不要說出這一步的最終數字、位置或完整算式。",
      "如果同學問答案或把猜想的數字寫出來，不要判斷對錯，請他把想法填進空格自己核對。",
      "不要提及網頁、按鈕、額度、模型或 API。",
      "只輸出給同學看的一段話。"
    ].join("\n");
    const base = {
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role: "user", parts: [{ text: message }] }],
      generationConfig: { maxOutputTokens: 280 }
    };
    let response = await requestGemini(geminiKey(), {
      systemInstruction: base.systemInstruction,
      contents: base.contents,
      generationConfig: { maxOutputTokens: 280, thinkingConfig: { thinkingLevel: "minimal" } }
    });
    if (response.status === 400) response = await requestGemini(geminiKey(), base);
    if (response.status === 429) return { quota: true, body: response.body };
    if (response.status === 401 || response.status === 403) return { auth: true };
    if (!response.ok) return { text: "" };
    const parts = response.body && response.body.candidates && response.body.candidates[0] && response.body.candidates[0].content
      ? response.body.candidates[0].content.parts || []
      : [];
    const text = parts.filter((part) => !part.thought).map((part) => part.text || "").join("").trim();
    return { text };
  }

  async function requestGemini(key, body) {
    try {
      const response = await fetch(GEMINI_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      return { ok: response.ok, status: response.status, body: data };
    } catch (error) {
      return { ok: false, status: 0, body: {} };
    }
  }

  async function checkQuota() {
    const button = document.getElementById("checkQuota");
    if (button) button.disabled = true;
    teacherNote = "";
    if (!geminiKey()) {
      renderTeacher();
      return;
    }
    const response = await requestGemini(geminiKey(), {
      contents: [{ role: "user", parts: [{ text: "只回覆：好" }] }],
      generationConfig: { maxOutputTokens: 8 }
    });
    if (response.status === 429) {
      remember429(response.body);
      teacherNote = "";
    } else if (response.status === 401 || response.status === 403) {
      authFailed = true;
      teacherNote = "檢查時得到 " + response.status + "。";
    } else if (!response.ok) {
      teacherNote = "這次檢查沒有成功（" + response.status + "）。沒有改用其他模型。";
    } else {
      authFailed = false;
      storageRemove("medianGeminiDay");
      storageRemove("medianGeminiMinuteUntil");
      teacherNote = "剛剛檢查成功，免費問答可用。";
    }
    if (button) button.disabled = false;
    render();
  }

  setInterval(() => {
    const open = aiOpen();
    if (open !== askWasOpen) render();
    else if (teacherView) renderTeacher();
  }, 5000);

  loadLesson(0);
</script>
</body>
</html>
